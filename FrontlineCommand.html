    focus:"balanced",
    lastReportUnits:0,
    followFocus:"balanced",
    totalKills:0,
    casualties:0,
    airstrikeReadyTime:gameTime+60,
    pendingAirstrike:null,
    pendingUpgrades:[],
    spawnRecency:{}
  };

  teamChat=[[],[]];

  srand(seed);

  /*
      Enlarged battlefield.

      Each side gets a proper HQ,
      defensive trench line,
      bunkers,
      and barracks. All positions are
      defined as fractions of W/H so the
      layout scales cleanly with map size.
  */

  makeBuilding(
    "HQ",
    BLUE,
    fx(.075),
    H/2
  );

  makeBuilding(
    "HQ",
    RED,
    fx(.925),
    H/2
  );


  makeBuilding(
    "barracks",
    BLUE,
    fx(.13),
    H/2-fy(.15)
  );

  makeBuilding(
    "barracks",
    RED,
    fx(.87),
    H/2+fy(.15)
  );


  makeBuilding(
    "bunker",
    BLUE,
    fx(.185),
    H/2-fy(.135)
  );

  makeBuilding(
    "bunker",
    RED,
    fx(.815),
    H/2+fy(.135)
  );

  // A second bunker each, further down their own trench line —
  // a more built-up base than just one strongpoint.
  makeBuilding(
    "bunker",
    BLUE,
    fx(.165),
    H/2+fy(.32)
  );

  makeBuilding(
    "bunker",
    RED,
    fx(.835),
    H/2-fy(.32)
  );


  // Defensive trench systems — long zigzagged networks that
  // run most of the length of the map, WWI-front style.
  makeTrenchNetwork(BLUE,[
    {x:fx(.145),y:fy(.06)},
    {x:fx(.185),y:fy(.22)},
    {x:fx(.15),y:fy(.4)},
    {x:fx(.2),y:fy(.58)},
    {x:fx(.16),y:fy(.76)},
    {x:fx(.2),y:fy(.93)}
  ]);

  makeTrenchNetwork(RED,[
    {x:fx(.855),y:fy(.94)},
    {x:fx(.815),y:fy(.78)},
    {x:fx(.85),y:fy(.6)},
    {x:fx(.8),y:fy(.42)},
    {x:fx(.84),y:fy(.24)},
    {x:fx(.8),y:fy(.07)}
  ]);

  // A second, deeper support trench line behind the first —
  // real WWI-style fronts ran forward and support/reserve lines
  // connected by communication trenches, so the whole network
  // reads as much longer and more realistic.
  makeTrenchNetwork(BLUE,[
    {x:fx(.10),y:fy(.04)},
    {x:fx(.135),y:fy(.23)},
    {x:fx(.105),y:fy(.42)},
    {x:fx(.145),y:fy(.6)},
    {x:fx(.115),y:fy(.78)},
    {x:fx(.145),y:fy(.96)}
  ]);

  makeTrenchNetwork(RED,[
    {x:fx(.90),y:fy(.96)},
    {x:fx(.865),y:fy(.78)},
    {x:fx(.895),y:fy(.6)},
    {x:fx(.855),y:fy(.42)},
    {x:fx(.885),y:fy(.23)},
    {x:fx(.855),y:fy(.04)}
  ]);


  scatterBuildings();

  const placedBuildings=
    structures.filter(s=>s.kind==="building");

  // Central objectives, scattered across the whole no-man's-land
  // (as neutral flags) so the fight never funnels into one lane —
  // units then fight to capture and hold them based on their role.
  // Weighted toward the single-room buildings (sometimes landing
  // right inside one) so a contested flag often doubles as a
  // contested building, for more intense close-quarters fights.
  for(let i=0;i<14;i++){

    let x,y;

    if(placedBuildings.length&&rand()<.65){

      const b=
        placedBuildings[
          Math.floor(rand()*placedBuildings.length)
        ];

      // A bit wider than the footprint itself so a flag isn't
      // always planted dead-center — sometimes just outside the
      // walls, sometimes inside the room.
      x=b.x+(rand()-.5)*b.halfW*2.6;
      y=b.y+(rand()-.5)*b.halfH*2.6;

    }else{

      x=W/2+(rand()-.5)*fx(.42);
      y=H/2+(rand()-.5)*fy(.72);
    }

    flags.push({
      x,y,
      team:2,
      progress:0,
      contestedBy:null
    });
  }

  proceduralTrees();


  // Starting armies
  for(const team of [BLUE,RED]){

    const side=
      team===BLUE?
      1:
      -1;

    const bx=
      team===BLUE?
      fx(.13):
      fx(.87);

    const by=H/2;

    const starting=[
      ["rifleman",5],
      ["mg",1],
      ["medic",1],
      ["leader",1],
      ["marksman",1],
      ["grenadier",1],
      ["engineer",2],
      ["comms",1]
    ];

    for(const [type,count] of starting){

      for(let i=0;i<count;i++){

        makeUnit(
          type,
          team,
          bx+
            side*(rand()*120),
          by+
            (rand()-.5)*450
        );
      }
    }
  }
}

/* =========================================================
   ADVANCED STATS PANEL
   Live dashboard: unit composition per team, each team's
   currently-radioed strategy, and a spread of other numbers
   pulled straight from the same state the sim itself uses.
   Rebuilt every frame while open (see updateStatsPanel()),
   same as the always-on corner status panel already is.
========================================================= */

function buildStatsPanel(){

  const bodyEl=document.getElementById("statsBody");

  if(!bodyEl)
    return;

  const countsByType={};

  for(const type in TYPES)
    countsByType[type]=[0,0];

  const critical=[0,0];
  const moraleSum=[0,0];
  const moraleN=[0,0];
  const outOfAmmoCount=[0,0];

  for(const u of units){

    if(u.team!==BLUE&&u.team!==RED)
      continue;

    if(countsByType[u.type])
      countsByType[u.type][u.team]++;

    if(u.critical)
      critical[u.team]++;

    if(isOutOfAmmo(u))
      outOfAmmoCount[u.team]++;

    moraleSum[u.team]+=u.morale;
    moraleN[u.team]++;
  }

  const totalUnits=[
    units.filter(u=>u.team===BLUE).length,
    units.filter(u=>u.team===RED).length
  ];

  const sectors=[
    flags.filter(f=>f.team===BLUE).length,
    flags.filter(f=>f.team===RED).length
  ];

  const buildingsOwned=[
    structures.filter(s=>s.team===BLUE).length,
    structures.filter(s=>s.team===RED).length
  ];

  const dronesActive=[
    kamikazeDrones.filter(d=>d.team===BLUE).length,
    kamikazeDrones.filter(d=>d.team===RED).length
  ];

  const minesActive=[
    mines.filter(m=>m.team===BLUE).length,
    mines.filter(m=>m.team===RED).length
  ];

  const avgMorale=[
    moraleN[BLUE]?Math.round(moraleSum[BLUE]/moraleN[BLUE]*100):0,
    moraleN[RED]?Math.round(moraleSum[RED]/moraleN[RED]*100):0
  ];

  let html="";

  html+=
    "<div class='statSection'><h4>Current Strategy</h4>"+
    "<div style='display:flex;gap:14px;align-items:center'>"+
    "<span class='blue' style='min-width:64px;display:inline-block'>BLUE</span>"+
    "<span class='focusPill' style='color:#63a7ff;border-color:#63a7ff'>"+
    teams[BLUE].focus.toUpperCase()+
    "</span></div>"+
    "<div style='display:flex;gap:14px;align-items:center;margin-top:6px'>"+
    "<span class='red' style='min-width:64px;display:inline-block'>RED</span>"+
    "<span class='focusPill' style='color:#ff6269;border-color:#ff6269'>"+
    teams[RED].focus.toUpperCase()+
    "</span></div></div>";

  html+=
    "<div class='statSection'><h4>Unit Composition</h4>"+
    "<table class='statTable'><thead><tr>"+
    "<th>Type</th><th class='num blue'>Blue</th><th class='num red'>Red</th>"+
    "</tr></thead><tbody>";

  for(const type in TYPES){

    const c=countsByType[type];

    html+=
      "<tr><td>"+
      type.charAt(0).toUpperCase()+type.slice(1)+
      "</td><td class='num'>"+c[BLUE]+
      "</td><td class='num'>"+c[RED]+
      "</td></tr>";
  }

  html+=
    "<tr class='totalRow'><td>Total</td>"+
    "<td class='num'>"+totalUnits[BLUE]+"</td>"+
    "<td class='num'>"+totalUnits[RED]+"</td></tr>"+
    "</tbody></table></div>";

  const statRows=[
    ["Resources",Math.floor(teams[BLUE].res),Math.floor(teams[RED].res)],
    ["Score",teams[BLUE].score,teams[RED].score],
    ["Sectors held",sectors[BLUE],sectors[RED]],
    ["Total kills",teams[BLUE].totalKills,teams[RED].totalKills],
    ["Casualties",teams[BLUE].casualties,teams[RED].casualties],
    ["Out of ammo",outOfAmmoCount[BLUE],outOfAmmoCount[RED]],
    ["Buildings owned",buildingsOwned[BLUE],buildingsOwned[RED]],
    ["Downed (critical)",critical[BLUE],critical[RED]],
    ["Avg. morale",avgMorale[BLUE]+"%",avgMorale[RED]+"%"],
    ["Active drones",dronesActive[BLUE],dronesActive[RED]],
    ["Active mines",minesActive[BLUE],minesActive[RED]]
  ];

  html+=
    "<div class='statSection'><h4>Advanced Stats</h4>"+
    "<table class='statTable'><thead><tr>"+
    "<th>Stat</th><th class='num blue'>Blue</th><th class='num red'>Red</th>"+
    "</tr></thead><tbody>";

  for(const[label,b,r] of statRows){

    html+=
      "<tr><td>"+label+
      "</td><td class='num'>"+b+
      "</td><td class='num'>"+r+
      "</td></tr>";
  }

  html+="</tbody></table></div>";

  bodyEl.innerHTML=html;
}


function updateStatsPanel(){

  const overlay=document.getElementById("statsOverlay");

  if(!overlay||!overlay.classList.contains("open"))
    return;

  buildStatsPanel();
}


function buildManual(){

  const body=document.getElementById("manualBody");

  if(!body)
    return;

  let html="";

  html+="<div class='manualSection'><h4>Units</h4><div class='manualGrid' id='manualUnitGrid'></div></div>";

  html+="<div class='manualSection'><h4>Other Battlefield Assets</h4><div id='manualAssetList'></div></div>";

  body.innerHTML=html;

  const grid=document.getElementById("manualUnitGrid");

  for(const type in TYPES){

    const t=TYPES[type];
    const role=ROLE_BY_TYPE[type];

    const card=document.createElement("div");
    card.className="manualCard";

    const canvasEl=document.createElement("canvas");
    canvasEl.width=104;
    canvasEl.height=104;

    const info=document.createElement("div");
    info.className="manualCardBody";

    const label=
      type.charAt(0).toUpperCase()+type.slice(1);

    info.innerHTML=
      "<div class='name'>"+label+"</div>"+
      "<div class='roleTag'>"+(ROLE_LABELS[role]||role||"")+"</div>"+
      "<div class='stats'>"+
        "HP "+t.hp+" · Speed "+t.speed+" · Dmg "+t.damage+
        "<br>Range "+t.range+" · Rate "+t.rate+"s · Cost "+t.cost+
      "</div>"+
      "<div class='blurb'>"+(UNIT_INFO[type]||"")+"</div>";

    card.appendChild(canvasEl);
    card.appendChild(info);
    grid.appendChild(card);

    // Draw the unit's actual in-game icon (Blue team colors),
    // scaled up so it's clearly visible in the reference card.
    const ictx=canvasEl.getContext("2d");
    ictx.save();
    ictx.translate(52,52);
    ictx.scale(2,2);
    drawUnitIcon(ictx,type,BLUE,type==="marksman");
    ictx.restore();
  }

  const assetList=document.getElementById("manualAssetList");

  for(const a of ASSET_INFO){

    const card=document.createElement("div");
    card.className="assetCard";

    card.innerHTML=
      "<div class='name'>"+a.name+"</div>"+
      "<div class='blurb'>"+a.blurb+"</div>";

    assetList.appendChild(card);
  }
}

function openManual(){

  buildManual();

  wikiWasPaused=paused;
  paused=true;

  document.getElementById("manualOverlay").classList.add("open");
}

function closeManual(){

  paused=wikiWasPaused;

  document.getElementById("manualOverlay").classList.remove("open");
}

let wikiWasPaused=false;

document.getElementById("manualBtn")
  .addEventListener("click",openManual);

document.getElementById("manualClose")
  .addEventListener("click",closeManual);

document.getElementById("manualOverlay")
  .addEventListener("click",e=>{

    if(e.target.id==="manualOverlay")
      closeManual();
  });

// The Stats panel is deliberately NOT modal the way the Field
// Manual is — it's a live dashboard, so the battle keeps running
// underneath it (see updateStatsPanel(), called every frame while
// it's open) rather than pausing to read static reference text.
function openStats(){

  buildStatsPanel();

  document.getElementById("statsOverlay").classList.add("open");
}

function closeStats(){

  document.getElementById("statsOverlay").classList.remove("open");
}

document.getElementById("statsBtn")
  .addEventListener("click",openStats);

document.getElementById("statsClose")
  .addEventListener("click",closeStats);

document.getElementById("statsOverlay")
  .addEventListener("click",e=>{

    if(e.target.id==="statsOverlay")
      closeStats();
  });

addEventListener("keydown",e=>{

  if(e.key!=="Escape")
    return;

  if(
    document.getElementById("manualOverlay")
      .classList.contains("open")
  ){
    closeManual();
    return;
  }

  if(
    document.getElementById("statsOverlay")
      .classList.contains("open")
  ){
    closeStats();
  }
});


/* =========================================================
   MAIN LOOP
   Fixed simulation rate prevents the old freeze.
========================================================= */

reset();

let previous=
  performance.now();

let accumulator=0;

function loop(now){

  let frameTime=
    (now-previous)/1000;

  previous=now;

  // Never allow a tab-switch or lag spike
  // to generate hundreds of simulation steps.
  frameTime=
    Math.min(
      frameTime,
      .10
    );

  simulationAccumulator+=frameTime;

  let steps=0;
  while(simulationAccumulator>=SIM_STEP && steps<4){
    simulationStep();
    simulationAccumulator-=SIM_STEP;
    steps++;
  }
  // Drop excessive backlog instead of freezing after a stall.
  if(simulationAccumulator>SIM_STEP*4)
    simulationAccumulator=0;

  updateCamera(
    frameTime
  );

  draw();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

window.addEventListener("error", e => {
  console.error(e.error || e.message);
  const box=document.createElement("div");
  box.style.cssText="position:fixed;left:10px;bottom:10px;z-index:9999;background:#300;color:#fff;padding:10px 14px;border:1px solid #f66;border-radius:6px;font:12px monospace;max-width:90vw";
  box.textContent="Game error: "+(e.message||"unknown error");
  document.body.appendChild(box);
});
</script>
