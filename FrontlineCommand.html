    ownDowned:units.filter(u=>u.team===team&&u.critical).length,
    enemyUnits:countBy(enemy),
    enemyTotal:enemy.length,
    enemyDowned:units.filter(u=>u.team===enemyTeam&&u.critical).length,
    flagsHeld:flags.filter(f=>f.team===team).length,
    flagsEnemyHeld:flags.filter(f=>f.team===enemyTeam).length,
    flagsNeutral:flags.filter(f=>f.team!==team&&f.team!==enemyTeam).length,
    resupplyInbound:!!teams[team].pendingSupply,
    activeDrones:kamikazeDrones.filter(d=>d.team===team).length
  };
}


function localCommanderReport(summary){

  // No live model reachable right now (opened outside the
  // artifact sandbox, offline, rate-limited, etc.) — reason
  // about the same real numbers locally instead of going quiet.
  const diff=summary.ownTotal-summary.enemyTotal;

  const lines=[];

  if(summary.ownDowned>0)
    lines.push(
      summary.ownDowned+
      " man"+(summary.ownDowned>1?"s":"")+
      " down — need a rescue, hold the line here."
    );

  if(diff<=-3)
    lines.push(
      "Outnumbered "+summary.enemyTotal+" to "+summary.ownTotal+
      " — falling back, need reinforcements, over."
    );
  else if(diff>=3)
    lines.push(
      "We've got the numbers, "+summary.ownTotal+" to "+
      summary.enemyTotal+" — press it while it lasts."
    );

  if(summary.resources<40)
    lines.push(
      "Down to "+summary.resources+
      " material — requesting resupply, over."
    );

  if(summary.flagsEnemyHeld>summary.flagsHeld)
    lines.push(
      "Only holding "+summary.flagsHeld+" sector"+
      (summary.flagsHeld===1?"":"s")+
      " to their "+summary.flagsEnemyHeld+" — regroup and retake."
    );
  else if(summary.flagsHeld>summary.flagsEnemyHeld)
    lines.push(
      "Holding "+summary.flagsHeld+" sector"+
      (summary.flagsHeld===1?"":"s")+
      " to their "+summary.flagsEnemyHeld+" — dig in and defend."
    );

  if(summary.enemyDowned>0)
    lines.push(
      "Enemy's got "+summary.enemyDowned+
      " down out there — press the advantage."
    );

  if(summary.activeDrones>0)
    lines.push(
      "Drone's live and inbound — cover our approach."
    );

  if(!lines.length)
    lines.push(
      summary.ownTotal+
      " effectives on the line, steady contact — holding formation."
    );

  const message=
    lines[Math.floor(rand()*lines.length)];

  let focus="balanced";

  if(summary.resources<40)
    focus="resupply";
  else if(diff<=-3)
    focus="defend";
  else if(diff>=3)
    focus="rush";
  else if(summary.flagsEnemyHeld>summary.flagsHeld)
    focus="flank";

  return {message,focus};
}


async function requestCommanderReport(team){

  if(teams[team].commsPending||!hasComms(team))
    return;

  teams[team].commsPending=true;

  const summary=buildBattleSummary(team);

  try{

    const prompt=
      "You are the "+summary.team+" team commander in a live "+
      "battlefield simulation. Reply with ONLY one line of raw "+
      "JSON, no prose, no markdown fences, in exactly this shape: "+
      "{\"message\":\"...\",\"focus\":\"rush|defend|flank|resupply|hold\"}. "+
      "\"message\" is a short (under 16 words) military radio "+
      "brevity-code line grounded in the actual numbers below — "+
      "call out a real shortage, a real advantage, or a real plan "+
      "instead of generic chatter. \"focus\" is the single "+
      "strategic priority you're calling for right now, chosen to "+
      "actually fit the numbers.\n\nBattle state:\n"+
      JSON.stringify(summary);

    const response=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:1000,
        messages:[{role:"user",content:prompt}]
      })
    });

    if(!response.ok)
      throw new Error("bad response status");

    const data=await response.json();

    const textBlock=
      (data.content||[]).find(b=>b.type==="text");

    if(!textBlock)
      throw new Error("no text in response");

    const clean=
      textBlock.text
        .replace(/```json|```/g,"")
        .trim();

    const parsed=JSON.parse(clean);

    if(!parsed.message)
      throw new Error("no message in reply");

    addChat(team,String(parsed.message).slice(0,140));

    const allowedFocus=
      ["rush","defend","flank","resupply","hold","balanced"];

    teams[team].focus=
      allowedFocus.includes(parsed.focus)?
      parsed.focus:
      localCommanderReport(summary).focus;

  }catch(err){

    // Live model unreachable this round — fall back to a report
    // built straight from the real battle numbers so the comms
    // panel and strategy still move instead of going silent.
    const fallback=localCommanderReport(summary);

    addChat(team,fallback.message);
    teams[team].focus=fallback.focus;

  }finally{

    teams[team].commsPending=false;
  }
}


function updateCommanderComms(team,dt){

  teams[team].commsTimer-=dt;

  if(teams[team].commsTimer>0)
    return;

  // Loosely staggered so both sides don't always report at once,
  // and infrequent enough to read as deliberate radio traffic
  // rather than a stream of chatter.
  teams[team].commsTimer=16+rand()*10;

  requestCommanderReport(team);
}


function commanderAI(team,dt){

  teams[team].aiTimer-=dt;

  if(teams[team].aiTimer>0)
    return;

  teams[team].aiTimer=.7+rand()*.8;

  // Fades recent-spawn memory over time (used by pickSpawnType's
  // anti-repetition weighting) — roughly a 10-15s memory of "what
  // did we just spawn a lot of," not a permanent record.
  const recency=teams[team].spawnRecency;

  for(const k in recency)
    recency[k]*=.88;

  const base=findBase(team);

  if(!base)
    return;

  // Spawn units.
  if(teams[team].res>=20){

    const type=pickSpawnType(team);

    const cost=TYPES[type].cost;

    if(teams[team].res>=cost){

      teams[team].res-=cost;

      makeUnit(
        type,
        team,
        base.x+
          (team===BLUE?90:-90),
        base.y+
          (rand()-.5)*140
      );
    }
  }

  // Longer engineering projects: mortar (1 day), armored vehicle
  // (2 days), or a marksman upgrade kit (ghillie suit or laser
  // sights) — same construction/readyTime pattern, just cheaper
  // and faster since it's a single-unit item, not a whole new
  // asset. On completion (see processTeamTimers), an upgrade kit
  // doesn't apply itself — it gets handed to an available Supplier
  // to physically carry out and deliver.
  if(!teams[team].construction&&rand()<.3){

    const roll=rand();

    let type,dur,cost;

    if(roll<.3){
      type="mortar";dur=DAY*1;cost=90;
    }else if(roll<.55){
      type="vehicle";dur=DAY*2;cost=140;
    }else if(roll<.8){
      type="ghillie";dur=DAY*.4;cost=70;
    }else{
      type="laserSights";dur=DAY*.5;cost=90;
    }

    if(teams[team].res>=cost){

      teams[team].res-=cost;

      teams[team].construction={
        type,
        readyTime:gameTime+dur
      };

      addChat(
        team,
        "Engineers starting a "+
        (type==="ghillie"?"ghillie suit kit":
         type==="laserSights"?"laser sights kit":
         type)+
        "."
      );
    }
  }

  // Radio a resupply request — any infantry with a working radio
  // can call one in, not just engineers. An actual helicopter
  // then has to fly in, and it spawns somewhere random on the
  // battlefield itself (not safely off-map) so the enemy has a
  // genuine chance to catch and shoot it down before it lands.
  if(
    !teams[team].pendingSupply&&
    teams[team].res<90&&
    hasComms(team)&&
    rand()<
      (teams[team].focus==="resupply"?.75:.4)
  ){

    let spawnX=W/2,spawnY=H/2,tries=0;

    do{

      spawnX=140+rand()*(W-280);
      spawnY=140+rand()*(H-280);
      tries++;

    }while(
      terrainAt(spawnX,spawnY)==="water"&&
      tries<20
    );

    const dist=
      Math.hypot(
        base.x-spawnX,
        base.y-spawnY
      );

    choppers.push({
      id:nextId++,
      team,
      x:spawnX,
      y:spawnY,
      hp:70,
      maxhp:70,
      cargo:50,
      speed:dist/(DAY*2),
      targetX:base.x,
      targetY:base.y
    });

    teams[team].pendingSupply=true;

    addChat(
      team,
      "Requesting resupply — chopper's inbound, over."
    );
  }

  // Airstrike call-in — a deliberate, expensive area-denial tool
  // that sits alongside mortars rather than replacing them, so it
  // deliberately isn't cheap or spammable: 200 resources up front,
  // locked out for the first 60s of the match, and another 60s
  // cooldown after every use (measured from when the bomb actually
  // lands, not from the call itself — the plane still has to fly
  // in). Only one in flight per team at a time, same as the
  // resupply chopper.
  if(
    !teams[team].pendingAirstrike&&
    gameTime>=teams[team].airstrikeReadyTime&&
    teams[team].res>=200&&
    hasComms(team)&&
    rand()<.2
  ){

    const target=findDenseEnemyPoint(team);

    if(target){

      teams[team].res-=200;

      let spawnX=W/2,spawnY=H/2,tries=0;

      do{

        spawnX=140+rand()*(W-280);
        spawnY=140+rand()*(H-280);
        tries++;

      }while(
        (terrainAt(spawnX,spawnY)==="water"||
         Math.hypot(spawnX-target.x,spawnY-target.y)<1000)&&
        tries<20
      );

      const dist=
        Math.hypot(
          spawnX-target.x,
          spawnY-target.y
        );

      airstrikePlanes.push({
        id:nextId++,
        team,
        x:spawnX,
        y:spawnY,
        targetX:target.x,
        targetY:target.y,
        speed:dist/14
      });

      teams[team].pendingAirstrike=true;

      addChat(
        team,
        "Airstrike called in, danger close — fire in the hole."
      );
    }
  }

  // Engineers build defensive positions and run longer
  // construction projects.
  const engineers=units.filter(
    u=>u.team===team&&
       u.type==="engineer"&&
       u.hp>0&&
       !u.frozenByDrone
  );

  if(engineers.length){

    // Drone operator: engineers build a cheap, expendable,
    // unmanned drone instead of risking a trained soldier. It
    // seeks out enemy infantry and self-destructs on contact —
    // see updateKamikazeDrones(). Heavily gated on engineers
    // being alive, since they're the ones building it.
    if(
      teams[team].res>=30&&
      rand()<
        (
          teams[team].focus==="flank"||
          teams[team].focus==="rush"?
          .35:.22
        )
    ){

      const e=engineers[
        Math.floor(rand()*engineers.length)
      ];

      teams[team].res-=30;

      // The engineer is piloting the drone remotely and freezes
      // in place until it's destroyed (either by detonating or
      // being shot down) — see updateDroneOperators(). They're
      // still a normal, targetable body while frozen.
      e.frozenByDrone=true;
      e.droneThaw=0;
      e.goal=null;
      e.target=null;

      kamikazeDrones.push({
        id:nextId++,
        team,
        x:e.x,
        y:e.y,
        hp:14,
        maxhp:14,
        speed:82,
        facing:e.facing,
        operator:e
      });

      addChat(
        team,
        "Engineers deploying a drone operator."
      );
    }

    const objective=chooseObjective(team);

    // Place a wall segment toward a contested objective.
    // Structures are no longer spawned outright — four or
    // more walls clustered together get sealed into a real
    // building by updateWallClusters().
    if(
      objective&&
      teams[team].res>=18&&
      rand()<.5
    ){

      const e=engineers[
        Math.floor(rand()*engineers.length)
      ];

      if(
        Math.hypot(
          e.x-objective.x,
          e.y-objective.y
        )<420
      ){

        const wx=objective.x+(rand()-.5)*140;
        const wy=objective.y+(rand()-.5)*140;

        const cutDown=clearTreesForStructure(
          wx,wy,BUILDING_DATA.wall.r
        );

        structures.push({
          kind:"wall",
          team,
          x:wx,
          y:wy,
          angle:e.facing,
          r:BUILDING_DATA.wall.r,
          hp:BUILDING_DATA.wall.hp,
          maxhp:BUILDING_DATA.wall.hp
        });

        teams[team].res-=18;

        if(cutDown)
          addChat(team,"Clearing trees to build here.");
      }
    }

    // Lay a mine toward a contested objective — obscured to the
    // enemy (their AI never reacts to or avoids it), armed after
    // a short delay so the engineer has time to clear the area.
    // Any unit from any team can set one off, including the
    // owner's own side.
    if(
      objective&&
      teams[team].res>=40&&
      rand()<.15
    ){

      const e=engineers[
        Math.floor(rand()*engineers.length)
      ];

      if(
        Math.hypot(
          e.x-objective.x,
          e.y-objective.y
        )<420
      ){

        mines.push({
          id:nextId++,
          team,
          x:objective.x+(rand()-.5)*160,
          y:objective.y+(rand()-.5)*160,
          armTimer:3,
          armed:false,
          blastRadius:100
        });

        teams[team].res-=40;

        addChat(team,"Engineers laying a mine.");
      }
    }
  }
}


function updateWallClusters(){

  // Four or more of a team's walls clustered together get
  // sealed into a proper bunker — buildings are man-made,
  // not spawned outright.
  for(const team of [BLUE,RED]){

    const walls=structures.filter(
      s=>s.kind==="wall"&&s.team===team
    );

    if(walls.length<4)
      continue;

    const visited=new Set();

    for(const w of walls){

      if(visited.has(w))
        continue;

      const group=[w];
      visited.add(w);

      let changed=true;

      while(changed){

        changed=false;

        for(const w2 of walls){

          if(visited.has(w2))
            continue;

          if(
            group.some(
              g=>Math.hypot(g.x-w2.x,g.y-w2.y)<100
            )
          ){
            group.push(w2);
            visited.add(w2);
            changed=true;
          }
        }
      }

      if(group.length>=4){

        let cx=0,cy=0;

        for(const g of group){
          cx+=g.x;
          cy+=g.y;
        }

        cx/=group.length;
        cy/=group.length;

        structures=structures.filter(
          s=>!group.includes(s)
        );

        // A bunker has a bigger footprint than the walls that
        // formed it — clear any extra trees inside that footprint.
        clearTreesForStructure(cx,cy,BUILDING_DATA.bunker.r);

        makeBuilding("bunker",team,cx,cy);

        addChat(
          team,
          "Walls sealed up — bunker's standing."
        );
      }
    }
  }
}


function processTeamTimers(){

  for(const team of [BLUE,RED]){

    const T=teams[team];

    if(
      T.construction&&
      gameTime>=T.construction.readyTime
    ){

      const c=T.construction;
      const base=findBase(team);

      if(c.type==="ghillie"||c.type==="laserSights"){

        // Doesn't apply itself — gets handed to an available
        // Supplier to physically carry out and deliver (see the
        // supplier behavior block in updateUnitAI). If none is
        // free right now, it waits in the team's queue for the
        // next Supplier that opens up. If that Supplier dies
        // while carrying it, the upgrade — and the resources
        // spent on it — are simply gone, no refund, no
        // reassignment.
        const supplier=units.find(
          u=>u.team===team&&
             u.type==="supplier"&&
             u.hp>0&&
             !u.critical&&
             !u.carryingUpgrade
        );

        if(supplier){

          supplier.carryingUpgrade=c.type;

          addChat(
            team,
            "Upgrade ready — a supplier's carrying it out."
          );

        }else{

          T.pendingUpgrades.push(c.type);

          addChat(
            team,
            "Upgrade ready, waiting on a free supplier."
          );
        }

      }else if(base){

        makeUnit(
          c.type,
          team,
          base.x+(team===BLUE?90:-90),
          base.y+(rand()-.5)*140
        );

        addChat(
          team,
          (c.type==="vehicle"?
            "Armored car rolling out.":
            "Mortar team is set up.")
        );
      }

      T.construction=null;
    }
  }
}


function updateChoppers(dt){

  // Resupply choppers physically fly in from off-map toward
  // their own base — the enemy can shoot them down along the
  // way (see updateBullets). If one makes it, it drops its
  // cargo and clears the way for the next request.
  for(let i=choppers.length-1;i>=0;i--){

    const c=choppers[i];

    const dx=c.targetX-c.x;
    const dy=c.targetY-c.y;
    const d=Math.hypot(dx,dy);

    if(d<55){

      teams[c.team].res+=c.cargo;

      addChat(
        c.team,
        "Chopper's here — supplies dropped, over."
      );

      teams[c.team].pendingSupply=null;

      choppers.splice(i,1);
      continue;
    }

    const vx=dx/(d||1);
    const vy=dy/(d||1);

    c.x+=vx*c.speed*dt;
    c.y+=vy*c.speed*dt;
  }
}


function updateAirstrikePlanes(dt){

  // Flies in from a random point on the map (at least 1000px from
  // the target, so it isn't just spawning on top of the blast) to
  // the commander AI's chosen point, then drops its bomb — no
  // in-flight shoot-down mechanic, unlike the resupply chopper;
  // this is fire-and-forget once called.
  for(let i=airstrikePlanes.length-1;i>=0;i--){

    const p=airstrikePlanes[i];

    const dx=p.targetX-p.x;
    const dy=p.targetY-p.y;
    const d=Math.hypot(dx,dy);

    if(d<40){

      // Same falloff-by-distance blast as a mine, scaled up, and
      // just as indiscriminate — no team filter, hits anyone
      // caught in range. Same known gap as every other explosion
      // in the game: doesn't yet account for building walls.
      const blastR=250;

      for(const v of units){

        if(v.hp<=0&&!v.critical)
          continue;

        const bd=Math.hypot(v.x-p.targetX,v.y-p.targetY);

        if(bd<blastR){

          const falloff=Math.max(0,1-bd/blastR);
          damageUnit(v,100*falloff,null);
        }
      }

      spawnParticles(p.targetX,p.targetY,"#ffb347",16);
      spawnParticles(p.targetX,p.targetY,"#ff5a3d",10);
      spawnParticles(p.targetX,p.targetY,"#8a8a82",8);
      spawnBlastRing(p.targetX,p.targetY,blastR,"#ff6a3d");

      // The cooldown starts now — from the bomb actually landing —
      // not from when the strike was called in.
      teams[p.team].airstrikeReadyTime=gameTime+60;
      teams[p.team].pendingAirstrike=null;

      addChat(p.team,"Bombs away — target hit, over.");

      airstrikePlanes.splice(i,1);
      continue;
    }

    const vx=dx/(d||1);
    const vy=dy/(d||1);

    p.x+=vx*p.speed*dt;
    p.y+=vy*p.speed*dt;
  }
}


// Releases a drone's operator from the freeze — called whenever a
// drone is destroyed, whether it detonated on contact or got shot
// down. The engineer stays frozen a moment longer (see
// updateDroneOperators()) before snapping back to normal.
function releaseDroneOperator(d){

  if(
    d.operator&&
    d.operator.hp>0&&
    d.operator.frozenByDrone
  ){
    d.operator.droneThaw=1;
  }
}


function detonateKamikazeDrone(d,indiscriminate=false){

  // Splash damage, mortar/mine-style — full damage right at the
  // point of impact, tapering off toward the edge of the blast.
  // Normally only the enemy team is caught in it (that's the
  // drone's whole purpose), but a drone shot down out of the sky
  // detonates prematurely and doesn't discriminate — it can catch
  // its own team in the blast too. NOTE: blast damage is still
  // pure radial falloff and doesn't know building walls exist —
  // dampening/blocking a blast by walls is deferred, see the
  // Single-Room Buildings writeup.
  const blastR=60;

  for(const v of units){

    if(
      (indiscriminate||v.team!==d.team)&&
      (v.hp>0||v.critical)
    ){

      const bd=Math.hypot(v.x-d.x,v.y-d.y);

      if(bd<blastR){

        const falloff=Math.max(0,1-bd/blastR);
        damageUnit(v,55*falloff,null);
      }
    }
  }

  spawnParticles(d.x,d.y,"#ffb347",10);
  spawnParticles(d.x,d.y,"#ff5a3d",6);
  spawnBlastRing(d.x,d.y,blastR,"#ffb347");

  releaseDroneOperator(d);
}


function updateKamikazeDrones(dt){

  // Engineer-built, expendable, unmanned — flies toward the
  // nearest living enemy infantry unit and self-destructs once
  // it's close, dealing splash damage. The enemy can shoot it
  // down first (see updateBullets), so it isn't a free kill.
  for(let i=kamikazeDrones.length-1;i>=0;i--){

    const d=kamikazeDrones[i];

    let target=null;
    let bd=Infinity;

    for(const v of units){

      if(
        v.team===d.team||
        v.hp<=0||
        !INFANTRY_TYPES.includes(v.type)
      )
        continue;

      const dist=Math.hypot(v.x-d.x,v.y-d.y);

      if(dist<bd){
        bd=dist;
        target=v;
      }
    }

    if(target&&bd<38){

      detonateKamikazeDrone(d);
      kamikazeDrones.splice(i,1);
      continue;
    }

    let gx,gy;

    if(target){
      gx=target.x;
      gy=target.y;
    }else{

      // No infantry to hunt yet — drift toward the enemy side
      // of the map so it's in position once one appears.
      const enemyHQ=findBase(d.team===BLUE?RED:BLUE);

      gx=enemyHQ?enemyHQ.x:d.x;
      gy=enemyHQ?enemyHQ.y:d.y;
    }

    const dx=gx-d.x;
    const dy=gy-d.y;
    const dist=Math.hypot(dx,dy)||1;

    d.facing=Math.atan2(dy,dx);

    d.x+=(dx/dist)*d.speed*dt;
    d.y+=(dy/dist)*d.speed*dt;
  }
}


// How close a medic needs to be, either to a stationary critical
// casualty or one still being hauled, to start working on them.
const MEDIC_REVIVE_RANGE=70;

// A critical unit is "out of danger" once no enemy is within this
// radius — one of the conditions that makes a dragger set them
// down (see updateRescues).
const DRAG_SAFE_RADIUS=260;

function nearbyReviveMedic(v){

  for(const w of units){

    if(
      w.team===v.team&&
      w.type==="medic"&&
      w.hp>0&&
      !w.critical&&
      Math.hypot(w.x-v.x,w.y-v.y)<MEDIC_REVIVE_RANGE
    )
      return w;
  }

  return null;
}


function updateDroneOperators(dt){

  // An engineer's drone has died — keep them frozen a moment
  // longer (as if shaking off the loss of the remote link) before
  // they snap back to normal behavior.
  for(const u of units){

    if(u.frozenByDrone&&u.droneThaw>0){

      u.droneThaw-=dt;

      if(u.droneThaw<=0){
        u.droneThaw=0;
        u.frozenByDrone=false;
      }
    }
  }
}


function updateRescues(dt){

  // Clear any drag assignment that's gone stale (the rescuer
  // died, went critical themselves, or got reassigned some other
  // way) so the casualty can be picked up by someone else.
  for(const v of units){

    if(
      v.draggedBy&&
      (
        v.draggedBy.hp<=0&&!v.draggedBy.critical||
        v.draggedBy.critical||
        v.draggedBy.dragging!==v
      )
    ){
      v.draggedBy=null;
    }
  }

  // Assign the nearest eligible ally to drag any casualty that
  // doesn't already have a rescuer — "any unit" can do this, not
  // just medics.
  for(const v of units){

    if(!v.critical||v.draggedBy)
      continue;

    let best=null;
    let bd=Infinity;

    for(const w of units){

      if(
        w===v||
        w.team!==v.team||
        w.hp<=0||
        w.critical||
        w.dragging
      )
        continue;

      const d=Math.hypot(w.x-v.x,w.y-v.y);

      if(d<bd){
        bd=d;
        best=w;
      }
    }

    if(best){
      best.dragging=v;
      v.draggedBy=best;
    }
  }

  // Move every dragger + their casualty toward safety.
  for(const w of units){

    if(!w.dragging)
      continue;

    const v=w.dragging;

    if(!v.critical){

      // Already revived (a medic got there first) or gone —
      // release and go back to normal duty next think-tick.
      w.dragging=null;
      continue;
    }

    const dTo=Math.hypot(w.x-v.x,w.y-v.y);

    if(dTo>26){

      // Close the distance to the casualty first.
      w.goal={x:v.x,y:v.y};

    }else{

      // Got them — haul them toward whichever's closer: base
      // or a building.
      const dest=nearestSafePoint(w.team,w.x,w.y);

      w.goal=dest;

      // The casualty trails just behind the one dragging them.
      v.x+=(w.x-v.x)*.3;
      v.y+=(w.y-v.y)*.3;

      // Set the casualty down — and free the dragger to resume
      // normal duty/combat — as soon as any of three things is
      // true: they've reached safety (base, or simply out of any
      // enemy's sightline — see isSafeSpot()), a medic has caught
      // up and is ready to work on them, or they're simply clear
      // of the fighting.
      if(
        isSafeSpot(v)||
        nearbyReviveMedic(v)||
        assessThreat(v,DRAG_SAFE_RADIUS)===0
      ){

        w.dragging=null;
        v.draggedBy=null;
      }
    }

    w.order="dragging";
  }

  // A medic standing over a critical casualty (whether they
  // walked up to a stationary one or caught up to one still
  // being dragged) gradually revives them instead of an instant
  // fix. The longer the casualty has already been down, the
  // longer the revive takes — anywhere from 3s (only just went
  // down) up to 7s (close to bleeding out). The bleed-out timer
  // itself is paused for as long as the medic is actively
  // working on them.
  for(const v of units){

    if(!v.critical){

      v.reviveProgress=0;
      v.reviveRequired=undefined;
      v.beingHealed=false;
      continue;
    }

    const medic=nearbyReviveMedic(v);

    v.beingHealed=!!medic;

    if(!medic)
      continue;

    if(v.reviveRequired===undefined){

      const elapsed=22-v.criticalTimer;
      v.reviveRequired=clamp(3+(elapsed/22)*4,3,7);
    }

    v.reviveProgress+=dt;

    if(v.reviveProgress>=v.reviveRequired){

      // A real revive — enough to get back on their feet and
      // rejoin the fight, not just a top-up.
      v.hp=v.maxhp*.4;
      v.critical=false;
      v.criticalTimer=0;
      v.draggedBy=null;
      v.reviveProgress=0;
      v.reviveRequired=undefined;
      v.beingHealed=false;
    }
  }

  // Critical casualties recover passively once safe (base, or
  // simply out of any enemy's sightline — see isSafeSpot()) — the
  // bleed-out timer pauses there, and enough regen brings them
  // back into the fight on their own, same as a medic revive but
  // slower. Out in the open (and not being actively healed above),
  // the clock runs.
  for(const v of units){

    if(!v.critical)
      continue;

    if(isSafeSpot(v)){

      v.hp=Math.min(v.maxhp*.4,v.hp+dt*2.2);

      if(v.hp>=v.maxhp*.4){

        v.critical=false;
        v.criticalTimer=0;
        v.draggedBy=null;
        v.reviveProgress=0;
        v.reviveRequired=undefined;
      }

    }else if(!v.beingHealed){

      v.criticalTimer-=dt;
    }
  }
}


// How close a unit needs to be to a Supplier for a field resupply
// to start — same spirit as MEDIC_REVIVE_RANGE.
const SUPPLIER_RESUPPLY_RANGE=70;


function updateSupplyDeliveries(dt){

  // Timed field ammo transfer — mirrors the medic critical-revive
  // pattern exactly: a receiving unit accumulates progress every
  // frame while a Supplier holds position in range, and the
  // transfer resolves once that reaches the required duration
  // (3-7s, scaled by how much reserve is actually missing — a
  // near-empty reserve takes the full 7s, a nearly-full one barely
  // any time at all).
  for(const v of units){

    if(v.hp<=0||v.critical){

      v.resupplyProgress=0;
      v.resupplyRequired=undefined;
      v.beingResupplied=false;
      continue;
    }

    if(v.reserve>=TYPES[v.type].reserveSize){

      v.resupplyProgress=0;
      v.resupplyRequired=undefined;
      v.beingResupplied=false;
      continue;
    }

    let supplier=null;

    for(const s of units){

      if(
        s!==v&&
        s.type==="supplier"&&
        s.team===v.team&&
        s.hp>0&&
        !s.critical&&
        s.ammoPack>0&&
        Math.hypot(s.x-v.x,s.y-v.y)<SUPPLIER_RESUPPLY_RANGE
      ){
        supplier=s;
        break;
      }
    }

    v.beingResupplied=!!supplier;

    if(!supplier)
      continue;

    if(v.resupplyRequired===undefined){

      const deficit=TYPES[v.type].reserveSize-v.reserve;
      const fraction=deficit/TYPES[v.type].reserveSize;

      v.resupplyRequired=3+fraction*4;
    }

    v.resupplyProgress+=dt;

    if(v.resupplyProgress>=v.resupplyRequired){

      // Recomputed fresh at the moment of transfer (rather than
      // reusing whatever was true when the timer started) so it's
      // always correct even if a different Supplier picked up the
      // job partway through, or this one made other deliveries
      // in the meantime.
      const deficit=TYPES[v.type].reserveSize-v.reserve;
      const amount=Math.min(deficit,supplier.ammoPack);

      v.reserve+=amount;
      supplier.ammoPack=Math.max(0,supplier.ammoPack-amount);

      v.resupplyProgress=0;
      v.resupplyRequired=undefined;
      v.beingResupplied=false;
    }
  }
}


function updateMines(dt){

  // Obscured to the enemy — there's no avoidance/detection AI
  // for mines at all, so enemy units simply never react to them.
  // Any unit from any team (including the owner's own) can set
  // one off by walking too close, once it's armed.
  for(let i=mines.length-1;i>=0;i--){

    const m=mines[i];

    if(!m.armed){

      m.armTimer-=dt;

      if(m.armTimer<=0)
        m.armed=true;

      continue;
    }

    let triggered=false;

    for(const u of units){

      if(
        u.hp<=0&&!u.critical
      )
        continue;

      if(Math.hypot(u.x-m.x,u.y-m.y)<18){
        triggered=true;
        break;
      }
    }

    if(!triggered)
      continue;

    // Same falloff-by-distance blast as a mortar shell, but it
    // doesn't care whose team anyone's on — a mine hurts anyone
    // caught in range, including its own side. Same note as the
    // drone blast above: doesn't yet account for building walls.
    for(const v of units){

      if(
        v.hp<=0&&!v.critical
      )
        continue;

      const d=Math.hypot(v.x-m.x,v.y-m.y);

      if(d<m.blastRadius){

        const falloff=Math.max(0,1-d/m.blastRadius);

        damageUnit(v,65*falloff,null);
      }
    }

    spawnParticles(m.x,m.y,"#ffb347",10);
    spawnParticles(m.x,m.y,"#ff5a3d",6);
    spawnBlastRing(m.x,m.y,m.blastRadius,"#ffb347");

    mines.splice(i,1);
  }
}


/* =========================================================
   FLAGS
========================================================= */

function updateFlags(dt){

  for(const f of flags){

    const counts=[0,0];

    for(const u of units){

      if(
        u.hp>0 &&
        Math.hypot(
          u.x-f.x,
          u.y-f.y
        )<95
      ){

        counts[u.team]++;
      }
    }

    if(counts[0]===counts[1]){

      // No clear majority present right now — leave progress
      // exactly where it was (frozen, not decaying), and hide
      // the contest indicator since nobody's actively flipping it.
      f.contestedBy=null;
      continue;
    }

    const team=
      counts[0]>counts[1]?0:1;

    if(team===f.team){

      f.progress=
        Math.max(
          0,
          f.progress-dt*.3
        );

      f.contestedBy=null;

    }else{

      f.progress+=dt*.55;
      f.contestedBy=team;

      if(f.progress>=4){

        f.team=team;
        f.progress=0;
        f.contestedBy=null;
        teams[team].score+=10;
      }
    }
  }
}


/* =========================================================
   BULLETS
========================================================= */

function updateBullets(dt){

  for(let i=bullets.length-1;i>=0;i--){

    const b=bullets[i];

    b.x+=b.vx*dt;
    b.y+=b.vy*dt;
    b.life-=dt;

    let remove=b.life<=0;

    if(
      b.x<0||
      b.y<0||
      b.x>W||
      b.y>H
    )
      remove=true;

    if(remove){

      bullets.splice(i,1);
      continue;
    }

    let hit=false;

    // Unit collision. No separate "inside a ruin" immunity check
    // needed anymore — a unit sheltering behind a building's
    // walls is protected because the bullet itself gets stopped
    // by those walls first (see the building-wall barrier check
    // below), the same way a "wall" barrier already works.
    for(const u of units){

      if(
        (u.hp<=0&&!u.critical)||
        u.team===b.team
      )
        continue;

      if(
        Math.hypot(
          u.x-b.x,
          u.y-b.y
        )<
        TYPES[u.type].radius+5
      ){

        if(b.explosive){

          const blastR=b.blastRadius||75;

          for(const v of units){

            if(
              v.team!==b.team &&
              (v.hp>0||v.critical)
            ){

              const bd2=Math.hypot(
                v.x-u.x,
                v.y-u.y
              );

              if(bd2<blastR){

                // Mortars fall off smoothly with distance from
                // the point of impact; grenades keep their old
                // flat splash so existing balance is unchanged.
                const mult=
                  b.blastFalloff?
                  Math.max(0,1-bd2/blastR):
                  .55;

                damageUnit(v,b.damage*mult,b.source);
              }
            }
          }

        }else{

          damageUnit(u,b.damage,b.source);
        }

        spawnParticles(
          u.x,
          u.y,
          "#eee",
          3
        );

        if(b.explosive)
          spawnBlastRing(
            u.x,
            u.y,
            b.blastRadius||75,
            b.blastFalloff?"#ff9a4d":"#ffcf6e"
          );

        bullets.splice(i,1);
        hit=true;
        break;
      }
    }

    if(hit)
      continue;

    // Barrier collision — a wall mostly stops bullets passing
    // through it (from either side, since it's just a physical
    // obstacle), but gaps in the sandbags occasionally let one
    // slip through. Uses a rotated rectangle so it matches the
    // barrier's actual drawn footprint (which now follows the
    // engineer's facing at build time) rather than a plain circle.
    // A Laser-Sighted shot punches through with no chance to be
    // stopped at all.
    for(const s of structures){

      if(s.kind!=="wall"||b.laserPen)
        continue;

      const angle=s.angle||0;
      const dx=b.x-s.x;
      const dy=b.y-s.y;

      const cos=Math.cos(-angle);
      const sin=Math.sin(-angle);

      const lx=dx*cos-dy*sin;
      const ly=dx*sin+dy*cos;

      if(
        Math.abs(lx)<=s.r&&
        Math.abs(ly)<=9
      ){

        if(rand()<.8){

          spawnParticles(
            b.x,
            b.y,
            "#8c7b57",
            3
          );

          bullets.splice(i,1);
          hit=true;
        }

        break;
      }
    }

    if(hit)
      continue;

    // Building-wall collision — a single-room building's solid
    // wall segments stop a bullet outright (no gap-chance the way
    // a sandbag barrier has; these are proper standing walls), but
    // an opening — a segment that simply isn't in s.walls — has
    // nothing here to hit at all, so a shot through a gap sails
    // through untouched. A Laser-Sighted shot punches through
    // regardless, same as it always could against the old ruins.
    for(const s of structures){

      if(s.kind!=="building"||b.laserPen)
        continue;

      if(Math.hypot(b.x-s.x,b.y-s.y)>s.r+20)
        continue;

      let hitWall=false;

      for(const w of s.walls){

        if(distToSegment(b.x,b.y,w.x1,w.y1,w.x2,w.y2)<6){
          hitWall=true;
          break;
        }
      }

      if(hitWall){

        spawnParticles(
          b.x,
          b.y,
          "#5c5648",
          3
        );

        bullets.splice(i,1);
        hit=true;
        break;
      }
    }

    if(hit)
      continue;

    // Structure collision — buildings were previously being
    // shot at (nearestEnemy correctly picks them as targets)
    // but nothing ever actually damaged them. HQ/barracks/bunker
    // now take real damage, which is what lets a side actually
    // win by destroying the enemy HQ.
    for(const s of structures){

      if(s.team===b.team)
        continue;

      if(
        s.kind!=="HQ"&&
        s.kind!=="barracks"&&
        s.kind!=="bunker"
      )
        continue;

      if(
        Math.hypot(
          s.x-b.x,
          s.y-b.y
        )<s.r
      ){

        s.hp-=b.damage;

        spawnParticles(
          b.x,
          b.y,
          "#ccc",
          4
        );

        bullets.splice(i,1);
        hit=true;
        break;
      }
    }

    if(hit)
      continue;

    // Chopper collision — the opposing team can shoot a supply
    // run down before it reaches base.
    for(const c of choppers){

      if(c.team===b.team)
        continue;

      if(
        Math.hypot(
          c.x-b.x,
          c.y-b.y
        )<24
      ){

        c.hp-=b.damage;

        spawnParticles(
          c.x,
          c.y,
          "#eee",
          3
        );

        bullets.splice(i,1);

        if(c.hp<=0){

          addChat(
            c.team,
            "Chopper's down — resupply lost!"
          );

          teams[c.team].pendingSupply=null;

          const idx=choppers.indexOf(c);

          if(idx>=0)
            choppers.splice(idx,1);
        }

        hit=true;
        break;
      }
    }

    if(hit)
      continue;

    // Kamikaze drone collision — the opposing team can shoot
    // a drone operator's drone down before it reaches a target.
    for(const kd of kamikazeDrones){

      if(kd.team===b.team)
        continue;

      if(
        Math.hypot(
          kd.x-b.x,
          kd.y-b.y
        )<28
      ){

        kd.hp-=b.damage;

        spawnParticles(
          kd.x,
          kd.y,
          "#eee",
          3
        );

        bullets.splice(i,1);

        if(kd.hp<=0){

          // Shot down mid-flight — it goes off right where it
          // was hit, and unlike a clean contact-detonation it
          // doesn't discriminate by team.
          detonateKamikazeDrone(kd,true);

          const idx=kamikazeDrones.indexOf(kd);

          if(idx>=0)
            kamikazeDrones.splice(idx,1);
        }

        hit=true;
        break;
      }
    }
  }

  // Absolute safety cap.
  if(bullets.length>900)
    bullets.splice(
      0,
      bullets.length-900
    );
}


/* =========================================================
   PARTICLES
========================================================= */

function spawnParticles(x,y,color,n=4){

  for(let i=0;i<n;i++){

    particles.push({
      x,
      y,

      vx:(rand()-.5)*80,
      vy:(rand()-.5)*80,

      life:.25+rand()*.2,

      color
    });
  }
}

function updateParticles(dt){

  for(let i=particles.length-1;i>=0;i--){

    const p=particles[i];

    p.x+=p.vx*dt;
    p.y+=p.vy*dt;

    p.life-=dt;

    if(p.life<=0)
      particles.splice(i,1);
  }

  if(particles.length>500)
    particles.splice(
      0,
      particles.length-500
    );
}


/* =========================================================
   BLAST RINGS
   A visible ring drawn at an explosion's actual damage radius,
   so splash weapons (mortar, grenadier, mines, kamikaze drones,
   airstrikes) read clearly as "this is how far that just
   reached" instead of only a small particle puff at the center.
   Purely visual — has no effect on damage, which is already
   resolved wherever spawnBlastRing() gets called from.
========================================================= */

function spawnBlastRing(x,y,radius,color="#ffb347"){

  blastRings.push({
    x,y,radius,color,
    age:0,
    duration:.45
  });
}


function updateBlastRings(dt){

  for(let i=blastRings.length-1;i>=0;i--){

    const b=blastRings[i];

    b.age+=dt;

    if(b.age>=b.duration)
      blastRings.splice(i,1);
  }
}


function drawBlastRings(){

  for(const b of blastRings){

    const t=clamp(b.age/b.duration,0,1);

    // Quick outward pop from ~35% of the radius up to the full
    // blast radius, fading out as it goes — reads as a shockwave
    // that shows exactly how far the blast reached.
    const rr=b.radius*(.35+.65*t);
    const alpha=1-t;

    ctx.save();

    ctx.globalAlpha=alpha*.18;
    ctx.fillStyle=b.color;
    ctx.beginPath();
    ctx.arc(b.x,b.y,rr,0,Math.PI*2);
    ctx.fill();

    ctx.globalAlpha=alpha*.9;
    ctx.strokeStyle=b.color;
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.arc(b.x,b.y,rr,0,Math.PI*2);
    ctx.stroke();

    ctx.restore();
  }
}


/* =========================================================
   CLEANUP
========================================================= */

function cleanup(){

  // Remove dead units immediately — but a unit in Critical
  // Failure stays on the field (hp pinned at 0) until they're
  // rescued/healed or their bleed-out timer runs out. Anyone
  // actually removed here (bled out, or finished off while
  // already down) is a permanent loss for their team — tallied
  // for the Advanced Stats panel, separate from the "Downed"
  // count of units still recoverable on the field.
  units=units.filter(u=>{

    const stillHere=
      u.hp>0||(u.critical&&u.criticalTimer>0);

    if(
      !stillHere&&
      (u.team===BLUE||u.team===RED)
    )
      teams[u.team].casualties++;

    return stillHere;
  });

  structures=structures.filter(
    s=>s.hp>0
  );
}


/* =========================================================
   SIMULATION
========================================================= */

const SIM_STEP=1/30;
let simulationAccumulator=0;
let wallCheckTimer=1.5;

function simulationStep(){

  if(paused)
    return;

  gameTime+=SIM_STEP;

  for(const team of [0,1]){

    const camps=structures.filter(
      s=>s.team===team&&
         s.kind==="barracks"
    ).length;

    const sectors=flags.filter(
      f=>f.team===team
    ).length;

    teams[team].res+=
      SIM_STEP*
      (1.4+camps*.5+sectors*.8);
  }

  commanderAI(BLUE,SIM_STEP);
  commanderAI(RED,SIM_STEP);

  updateCommanderComms(BLUE,SIM_STEP);
  updateCommanderComms(RED,SIM_STEP);

  processTeamTimers();

  wallCheckTimer-=SIM_STEP;

  if(wallCheckTimer<=0){
    updateWallClusters();
    wallCheckTimer=1.5;
  }

  for(const u of units){

    u.cd=Math.max(
      0,
      u.cd-SIM_STEP
    );

    if(u.stunned>0)
      u.stunned=Math.max(0,u.stunned-SIM_STEP);

    if(u.meleeCd>0)
      u.meleeCd=Math.max(0,u.meleeCd-SIM_STEP);

    if(u.recentlyStabbedTimer>0)
      u.recentlyStabbedTimer=Math.max(0,u.recentlyStabbedTimer-SIM_STEP);

    if(u.reloading){

      u.reloadTimer-=SIM_STEP;

      if(u.reloadTimer<=0){

        const t=TYPES[u.type];
        const needed=t.magSize-u.mag;
        const drawn=Math.min(needed,u.reserve);

        u.mag+=drawn;
        u.reserve-=drawn;
        u.reloading=false;
        u.reloadTimer=0;
        u.lastReloadTime=gameTime;
      }
    }

    updateUnitAI(
      u,
      SIM_STEP
    );

    moveUnit(
      u,
      SIM_STEP
    );
  }

  updateFlags(SIM_STEP);
  updateBullets(SIM_STEP);
  updateParticles(SIM_STEP);
  updateBlastRings(SIM_STEP);
  updateChoppers(SIM_STEP);
  updateAirstrikePlanes(SIM_STEP);
  updateKamikazeDrones(SIM_STEP);
  updateDroneOperators(SIM_STEP);
  updateLeaderFollowDwell(SIM_STEP);
  updateRescues(SIM_STEP);
  updateSupplyDeliveries(SIM_STEP);
  updateBleeding(SIM_STEP);
  updateMines(SIM_STEP);

  cleanup();

  const blueHQ=structures.some(
    s=>s.team===BLUE&&s.kind==="HQ"
  );

  const redHQ=structures.some(
    s=>s.team===RED&&s.kind==="HQ"
  );

  if(!blueHQ||!redHQ){

    paused=true;

    setTimeout(()=>{

      alert(
        (blueHQ?"BLUE":"RED")+
        " WINS!\nSeed: "+
        seed
      );

    },50);
  }
}


/* =========================================================
   TERRAIN DRAWING
========================================================= */

function drawTerrain(){

  const left=
    cam.x-innerWidth/(2*cam.zoom)-80;

  const right=
    cam.x+innerWidth/(2*cam.zoom)+80;

  const top=
    cam.y-innerHeight/(2*cam.zoom)-80;

  const bottom=
    cam.y+innerHeight/(2*cam.zoom)+80;

  const minTX=Math.floor(left/TILE);
  const maxTX=Math.ceil(right/TILE);

  const minTY=Math.floor(top/TILE);
  const maxTY=Math.ceil(bottom/TILE);

  for(
    let ty=minTY;
    ty<=maxTY;
    ty++
  ){

    for(
      let tx=minTX;
      tx<=maxTX;
      tx++
    ){

      const n=hash(tx,ty);

      let c;

      if(n<.045)
        c="#315b69";
      else if(n<.14)
        c="#365b32";
      else if(n<.22)
        c="#686447";
      else if(n<.28)
        c="#5c6248";
      else
        c="#4e6d42";

      ctx.fillStyle=c;

      ctx.fillRect(
        tx*TILE,
        ty*TILE,
        TILE+1,
        TILE+1
      );
    }
  }
}


/* =========================================================
   TREE DRAWING
========================================================= */

function drawTrees(){

  for(const t of trees){

    // shadow
    ctx.fillStyle="#182617";

    ctx.beginPath();
    ctx.ellipse(
      t.x,
      t.y+8,
      t.r*1.25,
      t.r*.55,
      0,0,Math.PI*2
    );
    ctx.fill();

    // trunk
    ctx.fillStyle="#4b3423";

    ctx.fillRect(
      t.x-4,
      t.y,
      8,
      20
    );

    // foliage
    ctx.fillStyle="#203d24";

    ctx.beginPath();
    ctx.arc(
      t.x,
      t.y-7,
      t.r,
      0,
      Math.PI*2
    );
    ctx.fill();

    ctx.fillStyle="#31582d";

    ctx.beginPath();
    ctx.arc(
      t.x-7,
      t.y-12,
      t.r*.65,
      0,
      Math.PI*2
    );
    ctx.fill();

    ctx.beginPath();
    ctx.arc(
      t.x+7,
      t.y-8,
      t.r*.6,
      0,
      Math.PI*2
    );
    ctx.fill();
  }
}


/* =========================================================
   TRENCH DRAWING
========================================================= */

function drawTrench(s){

  ctx.save();

  ctx.translate(s.x,s.y);
  ctx.rotate(s.angle);

  // outer earth berm
  ctx.fillStyle="#504531";

  ctx.fillRect(
    -38,
    -17,
    76,
    34
  );

  // trench hole
  ctx.fillStyle="#171913";

  ctx.fillRect(
    -38,
    -7,
    76,
    14
  );

  // inner dirt
  ctx.strokeStyle="#806d4c";
  ctx.lineWidth=3;

  ctx.beginPath();

  ctx.moveTo(-38,-10);
  ctx.lineTo(-20,-10);
  ctx.lineTo(-10,-7);
  ctx.lineTo(5,-10);
  ctx.lineTo(20,-7);
  ctx.lineTo(38,-10);

  ctx.stroke();

  // sandbags
  for(let x=-30;x<35;x+=12){

    ctx.fillStyle="#8c7b57";

    ctx.fillRect(
      x,
      -19,
      9,
      5
    );
  }

  ctx.restore();
}


/* =========================================================
   BUILDING DRAWING
========================================================= */

function drawBuilding(s){

  const r=s.r;

  ctx.save();

  ctx.translate(s.x,s.y);

  if(s.kind==="trench"){

    drawTrench(s);
    ctx.restore();
    return;
  }

  if(s.kind==="wall"){

    ctx.rotate(s.angle||0);

    ctx.fillStyle="#75664c";

    ctx.fillRect(
      -r,
      -9,
      r*2,
      18
    );

    ctx.fillStyle="#a08b62";

    for(let x=-r;x<r;x+=16)
      ctx.fillRect(x,-13,11,5);

    ctx.restore();
    return;
  }

  if(s.kind==="building"){

    // Single-room building — neutral, crumbling cover replacing
    // the old ruins. Not team-colored, not a legitimate attack
    // target, just terrain to fight around. Each solid wall
    // segment is drawn individually (in local coords, since ctx
    // is already translated to the building's center) so the
    // irregular gaps between them read clearly as openings —
    // nothing is drawn there at all.
    const hw=s.halfW;
    const hh=s.halfH;

    ctx.fillStyle="#20241d";
    ctx.fillRect(-hw-8,-hh-8,hw*2+16,hh*2+16);

    ctx.fillStyle="#3a362c";
    ctx.fillRect(-hw,-hh,hw*2,hh*2);

    ctx.fillStyle="#4a4436";

    for(const [ox,oy,rr] of [
      [-hw*.5,hh*.4,6],
      [hw*.4,-hh*.3,5],
      [hw*.1,hh*.55,4],
      [-hw*.6,-hh*.5,5]
    ]){
      ctx.beginPath();
      ctx.arc(ox,oy,rr,0,Math.PI*2);
      ctx.fill();
    }

    ctx.strokeStyle="#6b6152";
    ctx.lineWidth=9;
    ctx.lineCap="butt";

    for(const w of s.walls){
      ctx.beginPath();
      ctx.moveTo(w.x1-s.x,w.y1-s.y);
      ctx.lineTo(w.x2-s.x,w.y2-s.y);
      ctx.stroke();
    }

    ctx.strokeStyle="#8b8172";
    ctx.lineWidth=2;

    for(const w of s.walls){
      ctx.beginPath();
      ctx.moveTo(w.x1-s.x,w.y1-s.y-3);
      ctx.lineTo(w.x2-s.x,w.y2-s.y-3);
      ctx.stroke();
    }

    ctx.restore();
    return;
  }

  const wallColor=
    s.team===BLUE?
    "#526b7b":
    "#76575b";

  const wallDark=
    s.team===BLUE?
    "#3d5361":
    "#5c4245";

  const roofColor=
    s.kind==="bunker"?
    "#3a3a34":
    "#292d2a";

  // ground foundation slab, a bit wider than the walls
  ctx.fillStyle="#20241d";

  ctx.fillRect(
    -r-10,
    -r-10,
    r*2+20,
    r*2+20
  );

  // building shadow
  ctx.fillStyle="#172018";

  ctx.fillRect(
    -r+7,
    -r+8,
    r*2,
    r*2
  );

  // main building
  ctx.fillStyle=wallColor;

  ctx.fillRect(
    -r,
    -r,
    r*2,
    r*2
  );

  // side annex wing (barracks/HQ only — bunkers stay squat and reinforced)
  if(s.kind!=="bunker"){

    const wingW=r*.85;
    const wingH=r*1.15;

    ctx.fillStyle=wallDark;

    ctx.fillRect(
      r-4,
      -wingH/2,
      wingW,
      wingH
    );

    ctx.fillStyle=roofColor;

    ctx.fillRect(
      r-8,
      -wingH/2-5,
      wingW+10,
      8
    );
  }

  // corrugated / paneled wall texture
  ctx.strokeStyle="#00000030";
  ctx.lineWidth=1.5;

  for(let x=-r+8;x<r-4;x+=9){

    ctx.beginPath();
    ctx.moveTo(x,-r+4);
    ctx.lineTo(x,r-4);
    ctx.stroke();
  }

  // concrete/brick foundation band
  ctx.fillStyle="#00000025";

  ctx.fillRect(
    -r,
    r-10,
    r*2,
    10
  );

  // corner support beams
  ctx.fillStyle=wallDark;

  const cSize=7;

  for(const cx of [-r,r-cSize])
    for(const cy of [-r,r-cSize])
      ctx.fillRect(cx,cy,cSize,cSize);

  // roof
  ctx.fillStyle=roofColor;

  ctx.fillRect(
    -r-5,
    -r-7,
    r*2+10,
    10
  );

  // roof ridge line + panel seams
  ctx.strokeStyle="#00000055";
  ctx.lineWidth=1.5;

  ctx.beginPath();
  ctx.moveTo(-r-5,-r-2);
  ctx.lineTo(r+5,-r-2);
  ctx.stroke();

  for(let x=-r;x<r;x+=14){
    ctx.beginPath();
    ctx.moveTo(x,-r-7);
    ctx.lineTo(x,-r+3);
    ctx.stroke();
  }

  // roof vent / chimney
  ctx.fillStyle="#1c1c19";

  ctx.fillRect(
    r*.35,
    -r-16,
    9,
    10
  );

  // bunker firing slits instead of house windows
  if(s.kind==="bunker"){

    ctx.fillStyle="#0c0c0a";

    for(const wy of [-r*.35,r*.1]){

      ctx.fillRect(
        -r+10,
        wy,
        r*2-20,
        6
      );
    }

    // reinforced concrete rib lines
    ctx.strokeStyle="#00000040";
    ctx.lineWidth=2;

    for(let y=-r+14;y<r-6;y+=13){
      ctx.beginPath();
      ctx.moveTo(-r+4,y);
      ctx.lineTo(r-4,y);
      ctx.stroke();
    }

  }else{

    // windows
    ctx.fillStyle="#16242b";

    const win=[
      [-r+15,-r+18],
      [r-27,-r+18],
      [-r+15,8],
      [r-27,8]
    ];

    for(const w of win){

      ctx.fillRect(
        w[0],
        w[1],
        12,
        16
      );

      // window mullion + frame
      ctx.strokeStyle="#6f6250";
      ctx.lineWidth=1.5;
      ctx.strokeRect(w[0],w[1],12,16);

      ctx.beginPath();
      ctx.moveTo(w[0]+6,w[1]);
      ctx.lineTo(w[0]+6,w[1]+16);
      ctx.stroke();
    }
  }

  // doors
  const doorColor="#171512";

  ctx.fillStyle=doorColor;

  // front entrance
  ctx.fillRect(
    -13,
    -r-2,
    26,
    18
  );

  // rear exit
  ctx.fillRect(
    -13,
    r-16,
    26,
    18
  );

  // side exits
  ctx.fillRect(
    -r-2,
    -13,
    18,
    26
  );

  ctx.fillRect(
    r-16,
    -13,
    18,
    26
  );

  // door frames
  ctx.strokeStyle="#b99b69";
  ctx.lineWidth=3;

  ctx.strokeRect(
    -13,
    -r-2,
    26,
    18
  );

  ctx.strokeRect(
    -13,
    r-16,
    26,
    18
  );

  // door handles
  ctx.fillStyle="#d8c48c";
  ctx.fillRect(6,-r+10,3,3);
  ctx.fillRect(6,r-9,3,3);

  // sandbags around entrances
  ctx.fillStyle="#897754";

  for(let x=-35;x<=25;x+=12){

    ctx.fillRect(
      x,
      -r-14,
      9,
      5
    );
  }

  // corner sandbag stacks
  ctx.fillStyle="#7d6c4b";

  for(const cx of [-r-14,r+5])
    for(let i=0;i<2;i++)
      ctx.fillRect(
        cx,
        r-2-i*7,
        14,
        6
      );

  // camouflage netting patches on the roof
  ctx.fillStyle="#3d4a30";

  ctx.beginPath();
  ctx.moveTo(-r*.5,-r-7);
  ctx.lineTo(-r*.15,-r-15);
  ctx.lineTo(r*.15,-r-7);
  ctx.closePath();
  ctx.fill();

  // HQ radio mast + secondary watch post
  if(s.kind==="HQ"){

    ctx.strokeStyle="#222";
    ctx.lineWidth=4;

    ctx.beginPath();
    ctx.moveTo(0,-r);
    ctx.lineTo(0,-r-55);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(-20,-r-42);
    ctx.lineTo(0,-r-55);
    ctx.lineTo(20,-r-42);
    ctx.stroke();

    // signal dish
    ctx.strokeStyle="#333";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(0,-r-48,7,Math.PI*.15,Math.PI*1.1);
    ctx.stroke();

    // flag
    ctx.fillStyle=teamColors[s.team];

    ctx.fillRect(
      0,
      -r-55,
      25,
      13
    );

    // watchtower on the opposite corner
    ctx.fillStyle=wallDark;
    ctx.fillRect(-r-18,-r-30,16,30+r*.4);

    ctx.fillStyle=roofColor;
    ctx.beginPath();
    ctx.moveTo(-r-22,-r-30);
    ctx.lineTo(-r-10,-r-30);
    ctx.lineTo(-r-16,-r-42);
    ctx.closePath();
    ctx.fill();
  }

  // health
  ctx.fillStyle="#111";

  ctx.fillRect(
    -r,
    -r-22,
    r*2,
    5
  );

  ctx.fillStyle=teamColors[s.team];

  ctx.fillRect(
    -r,
    -r-22,
    r*2*
      clamp(
        s.hp/s.maxhp,
        0,
        1
      ),
    5
  );

  ctx.restore();
}


/* =========================================================
   UNIT DRAWING
========================================================= */

function drawMeleeKnife(c){

  // Simple fighting knife — steel blade forward, dark grip
  // behind — drawn in place of a melee-eligible unit's normal
  // weapon whenever u.order==="melee". Swaps back to the regular
  // weapon automatically the instant order changes, since this is
  // just a live read of current state each frame, not a separate
  // animation to reset.
  c.fillStyle="#d8d8d8";
  c.strokeStyle="#111";
  c.lineWidth=1.5;

  c.beginPath();
  c.moveTo(6,-2);
  c.lineTo(24,0);
  c.lineTo(6,2);
  c.closePath();
  c.fill();
  c.stroke();

  c.fillStyle="#3d2c17";
  c.fillRect(0,-3,7,6);
}


function drawUnitIcon(c,type,team,ghillie,laser,melee){

  // Draws just the colored body + weapon/role icon, centered at
  // the origin, facing +X (0 radians). Shared by the live-game
  // renderer (drawUnit, which wraps this in translate+rotate) and
  // the field-manual reference icons (which call it unrotated).
  const t=TYPES[type];

  if(!t)
    return;

  // large team body
  c.fillStyle=teamColors[team];

  c.beginPath();

  c.arc(
    0,
    0,
    t.radius,
    0,
    Math.PI*2
  );

  c.fill();

  c.strokeStyle="#111";
  c.lineWidth=2;
  c.stroke();

  // role icon + weapon — everything below is drawn "facing
  // +X" (0 radians).
  c.fillStyle="#f0f0df";
  c.strokeStyle="#111";
  c.lineWidth=2;

  if(type==="rifleman"){

    c.fillRect(-7,-9,14,18);

    if(melee)
      drawMeleeKnife(c);
    else
      c.fillRect(3,-3,22,5); // rifle

  }else if(type==="mg"){

    c.fillRect(-9,-10,18,20);
    c.fillRect(3,-4,25,7); // heavier barrel

  }else if(type==="medic"){

    c.fillRect(-10,-10,20,20);

    c.fillStyle="#d33";

    c.fillRect(-3,-9,6,18);
    c.fillRect(-9,-3,18,6);

    // sidearm — medics still carry something
    c.fillStyle="#f0f0df";
    c.fillRect(6,-2,13,4);

  }else if(type==="leader"){

    c.beginPath();

    c.moveTo(0,-15);
    c.lineTo(12,7);
    c.lineTo(0,14);
    c.lineTo(-12,7);
    c.closePath();

    c.fill();

    c.fillStyle="#ffd66e";

    c.fillRect(-4,-4,8,8);

    // sidearm/rifle slung forward (or a knife, in melee mode)
    c.fillStyle="#f0f0df";

    if(melee)
      drawMeleeKnife(c);
    else
      c.fillRect(4,-2,18,5);

  }else if(type==="marksman"){

    c.beginPath();

    c.arc(
      0,0,9,
      0,Math.PI*2
    );

    c.fill();

    c.fillRect(
      0,-16,
      25,
      4
    ); // long scoped rifle

    if(ghillie){

      // Mottled camo blotches over the body — a quick visual
      // tell for "this one's much harder to spot in cover."
      c.fillStyle="#5c6b3d";

      for(const [ox,oy,rr] of [
        [-5,-4,4],
        [4,-6,3.5],
        [-2,5,4],
        [5,3,3]
      ]){

        c.beginPath();
        c.arc(ox,oy,rr,0,Math.PI*2);
        c.fill();
      }

      c.fillStyle="#7c8a55";

      c.beginPath();
      c.arc(0,0,3,0,Math.PI*2);
      c.fill();

    }else if(laser){

      // A bright red glint off the scope plus a thin laser
      // line down the barrel — the telltale sign that gives
      // this marksman away at a distance.
      c.fillStyle="#ff3b3b";

      c.beginPath();
      c.arc(6,-16,3,0,Math.PI*2);
      c.fill();

      c.strokeStyle="#ff3b3b";
      c.lineWidth=1.5;

      c.beginPath();
      c.moveTo(25,-14);
      c.lineTo(46,-14);
      c.stroke();
    }

  }else if(type==="grenadier"){

    c.beginPath();

    c.arc(
      0,0,11,
      0,Math.PI*2
    );

    c.fill();

    if(melee)
      drawMeleeKnife(c);
    else
      c.fillRect(
        0,-15,
        18,
        6
      ); // launcher tube

  }else if(type==="comms"){

    c.fillRect(
      -10,-10,
      20,20
    );

    c.beginPath();

    c.arc(
      0,-10,
      15,
      Math.PI,
      Math.PI*2
    );

    c.stroke();

    // sidearm
    c.fillStyle="#f0f0df";
    c.fillRect(8,-2,12,4);

  }else if(type==="engineer"){

    c.fillRect(
      -11,-10,
      22,20
    );

    c.fillStyle="#e0bd51";

    c.fillRect(
      -3,-15,
      6,30
    );

    c.fillRect(
      -15,-3,
      30,6
    );

  }else if(type==="vehicle"){

    // tracks
    c.fillStyle="#1c1c1a";
    c.fillRect(-20,-17,40,5);
    c.fillRect(-20,12,40,5);

    // hull
    c.fillStyle="#f0f0df";
    c.fillRect(-19,-12,36,24);

    // turret
    c.beginPath();
    c.arc(-2,0,11,0,Math.PI*2);
    c.fill();
    c.stroke();

    // cannon barrel
    c.fillRect(6,-3,27,6);

  }else if(type==="mortar"){

    // tripod legs
    c.strokeStyle="#443725";
    c.lineWidth=3;

    c.beginPath();
    c.moveTo(-2,-14);
    c.lineTo(-9,11);
    c.moveTo(-2,-14);
    c.lineTo(4,12);
    c.moveTo(-2,-14);
    c.lineTo(-2,15);
    c.stroke();

    // base plate
    c.fillStyle="#333";
    c.beginPath();
    c.arc(-2,12,5,0,Math.PI*2);
    c.fill();

    // tube, angled forward-and-up — mortars fire high-angle
    c.strokeStyle="#f0f0df";
    c.lineWidth=6;
    c.beginPath();
    c.moveTo(-2,-14);
    c.lineTo(20,-24);
    c.stroke();

    c.lineWidth=2;

  }else if(type==="supplier"){

    c.fillRect(-9,-9,18,18);

    // ammo crate slung on the back
    c.fillStyle="#7a5a2e";

    c.fillRect(-16,-9,10,18);

    c.strokeStyle="#3d2c17";
    c.lineWidth=1.5;
    c.strokeRect(-16,-9,10,18);

    c.beginPath();
    c.moveTo(-16,-2);
    c.lineTo(-6,-2);
    c.moveTo(-16,4);
    c.lineTo(-6,4);
    c.stroke();

    // sidearm
    c.fillStyle="#f0f0df";
    c.strokeStyle="#111";
    c.lineWidth=2;
    c.fillRect(6,-2,12,4);
  }
}


function drawUnit(u){

  const t=TYPES[u.type];

  ctx.save();

  ctx.translate(u.x,u.y);

  if(u.critical){

    // Down and out — a dim, flattened silhouette lying where they
    // fell, with a pulsing distress marker instead of a weapon,
    // and a countdown bar (bleed-out timer) instead of a health bar.
    ctx.save();
    ctx.rotate(u.facing);

    ctx.fillStyle=
      u.team===BLUE?
      "#2c4657":
      "#4a2f31";

    ctx.beginPath();
    ctx.ellipse(0,0,t.radius+3,t.radius*.55,0,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle="#00000080";
    ctx.lineWidth=1.5;
    ctx.stroke();

    const pulse=.5+.5*Math.sin(gameTime*6);

    ctx.fillStyle=`rgba(255,80,60,${pulse})`;
    ctx.beginPath();
    ctx.arc(0,0,3.5,0,Math.PI*2);
    ctx.fill();

    ctx.restore();

    const frac=clamp(u.criticalTimer/22,0,1);

    ctx.fillStyle="#111";
    ctx.fillRect(-15,-t.radius-9,30,4);

    ctx.fillStyle=
      u.draggedBy?
      "#63a7ff":
      "#ff6269";

    ctx.fillRect(-15,-t.radius-9,30*frac,4);

    ctx.restore();
    return;
  }

  // Body + weapon rotate to face u.facing. The health bar below
  // is drawn afterward, outside this rotated block, so it stays
  // flat and readable no matter which way the unit is looking.
  ctx.save();
  ctx.rotate(u.facing);

  // selection / command aura
  ctx.strokeStyle="#ffffff55";
  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    t.radius+4,
    0,
    Math.PI*2
  );

  ctx.stroke();

  drawUnitIcon(ctx,u.type,u.team,u.ghillie,u.laserSights,u.order==="melee");

  ctx.restore();

  // health bar — deliberately unrotated so it's always readable
  ctx.fillStyle="#111";

  ctx.fillRect(
    -15,
    -t.radius-9,
    30,
    4
  );

  ctx.fillStyle=u.bleeding?"#ff4d4d":"#70df68";

  ctx.fillRect(
    -15,
    -t.radius-9,
    30*
      clamp(
        u.hp/u.maxhp,
        0,
        1
      ),
    4
  );

  // Ammo readout — visible the whole time a unit is mid-reload
  // (so the mechanic is actually visible while it's happening),
  // then lingers for a couple seconds afterward showing the
  // refreshed count before fading back out, rather than
  // permanently cluttering every unit on screen with numbers.
  const sinceReload=gameTime-u.lastReloadTime;
  const showAmmo=u.reloading||sinceReload<2.5;

  if(showAmmo){

    const ammoAlpha=
      u.reloading?
      1:
      clamp(1-sinceReload/2.5,0,1);

    ctx.save();

    ctx.globalAlpha=ammoAlpha;
    ctx.fillStyle=u.reloading?"#ffcf6e":"#e8e8dc";
    ctx.font="10px sans-serif";
    ctx.textAlign="center";

    ctx.fillText(
      u.mag+"/"+u.reserve,
      0,
      -t.radius-13
    );

    ctx.restore();
  }

  // Carrying-upgrade indicator — a Supplier physically hauling a
  // finished upgrade kit gets a small marker so it reads
  // differently from one that's just out running ammo. Doesn't
  // say which upgrade, just that it's carrying something.
  if(u.type==="supplier"&&u.carryingUpgrade){

    ctx.save();
    ctx.translate(t.radius+3,-t.radius-3);

    ctx.fillStyle="#ffd66e";
    ctx.strokeStyle="#5a4110";
    ctx.lineWidth=1;

    ctx.beginPath();
    ctx.arc(0,0,6,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();

    ctx.lineWidth=1.5;

    ctx.beginPath();
    ctx.moveTo(-3,0);
    ctx.lineTo(3,0);
    ctx.moveTo(0,-3);
    ctx.lineTo(0,3);
    ctx.stroke();

    ctx.restore();
  }

  ctx.restore();
}


/* =========================================================
   CHOPPER DRAWING
========================================================= */

function drawChopper(c){

  ctx.save();

  ctx.translate(c.x,c.y);

  const angle=Math.atan2(
    c.targetY-c.y,
    c.targetX-c.x
  );

  ctx.rotate(angle);

  const bodyColor=
    c.team===BLUE?
    "#2f4d63":
    "#5c3336";

  // rotor blur
  ctx.strokeStyle="#00000055";
  ctx.lineWidth=2;

  ctx.beginPath();
  ctx.ellipse(0,-2,26,7,0,0,Math.PI*2);
  ctx.stroke();

  // tail boom
  ctx.fillStyle=bodyColor;
  ctx.fillRect(-30,-3,20,6);

  // tail rotor
  ctx.strokeStyle="#00000055";
  ctx.beginPath();
  ctx.ellipse(-30,-2,2,7,0,0,Math.PI*2);
  ctx.stroke();

  // body
  ctx.beginPath();
  ctx.ellipse(4,0,16,10,0,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle="#111";
  ctx.lineWidth=1.5;
  ctx.stroke();

  // cockpit
  ctx.fillStyle="#bcd6e6";
  ctx.beginPath();
  ctx.ellipse(12,-1,6,5,0,0,Math.PI*2);
  ctx.fill();

  // skids
  ctx.strokeStyle="#111";
  ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(-6,9);
  ctx.lineTo(16,9);
  ctx.stroke();

  ctx.restore();

  // health bar (unrotated, above the chopper)
  ctx.fillStyle="#111";
  ctx.fillRect(c.x-15,c.y-24,30,4);

  ctx.fillStyle="#70df68";
  ctx.fillRect(
    c.x-15,
    c.y-24,
    30*clamp(c.hp/c.maxhp,0,1),
    4
  );
}


/* =========================================================
   AIRSTRIKE PLANE DRAWING
========================================================= */

function drawAirstrikePlane(p){

  // A target reticle at the impact point for the whole flight, so
  // the incoming strike reads as a threat worth reacting to, not
  // just a silent plane crossing the map.
  const pulse=
    .6+Math.sin(gameTime*6)*.4;

  ctx.strokeStyle=
    p.team===BLUE?
    "#3d8cff":
    "#ff4d55";

  ctx.globalAlpha=pulse;
  ctx.lineWidth=2;

  ctx.beginPath();
  ctx.arc(p.targetX,p.targetY,26,0,Math.PI*2);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(p.targetX-34,p.targetY);
  ctx.lineTo(p.targetX-14,p.targetY);
  ctx.moveTo(p.targetX+14,p.targetY);
  ctx.lineTo(p.targetX+34,p.targetY);
  ctx.moveTo(p.targetX,p.targetY-34);
  ctx.lineTo(p.targetX,p.targetY-14);
  ctx.moveTo(p.targetX,p.targetY+14);
  ctx.lineTo(p.targetX,p.targetY+34);
  ctx.stroke();

  ctx.globalAlpha=1;

  ctx.save();

  ctx.translate(p.x,p.y);

  const angle=Math.atan2(
    p.targetY-p.y,
    p.targetX-p.x
  );

  ctx.rotate(angle);

  const bodyColor=
    p.team===BLUE?
    "#2f4d63":
    "#5c3336";

  // wings
  ctx.fillStyle=bodyColor;
  ctx.fillRect(-4,-22,7,44);

  // fuselage
  ctx.beginPath();
  ctx.ellipse(0,0,20,5,0,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle="#111";
  ctx.lineWidth=1.2;
  ctx.stroke();

  // tail fin
  ctx.fillRect(-20,-10,5,12);

  ctx.restore();
}


/* =========================================================
   KAMIKAZE DRONE DRAWING
========================================================= */

function drawKamikazeDrone(d){

  ctx.save();

  ctx.translate(d.x,d.y);
  ctx.rotate(d.facing||0);

  const bodyColor=
    d.team===BLUE?
    "#3d8cff":
    "#ff4d55";

  // rotor arms
  ctx.strokeStyle="#1c1c1a";
  ctx.lineWidth=2;

  ctx.beginPath();
  ctx.moveTo(-8,-8); ctx.lineTo(8,8);
  ctx.moveTo(-8,8); ctx.lineTo(8,-8);
  ctx.stroke();

  // rotor blur circles
  ctx.strokeStyle="#00000055";
  ctx.lineWidth=1.5;

  for(const [rx,ry] of [[-8,-8],[8,-8],[-8,8],[8,8]]){
    ctx.beginPath();
    ctx.arc(rx,ry,4,0,Math.PI*2);
    ctx.stroke();
  }

  // body
  ctx.fillStyle=bodyColor;
  ctx.beginPath();
  ctx.arc(0,0,7,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle="#111";
  ctx.lineWidth=1.5;
  ctx.stroke();

  // armed indicator light — pulses so it reads as "live payload"
  const pulse=.6+.4*Math.sin(gameTime*8);

  ctx.fillStyle=`rgba(255,90,60,${pulse})`;
  ctx.beginPath();
  ctx.arc(3,0,2.5,0,Math.PI*2);
  ctx.fill();

  ctx.restore();

  // health bar (unrotated)
  ctx.fillStyle="#111";
  ctx.fillRect(d.x-12,d.y-18,24,3);

  ctx.fillStyle="#70df68";
  ctx.fillRect(
    d.x-12,
    d.y-18,
    24*clamp(d.hp/d.maxhp,0,1),
    3
  );
}


/* =========================================================
   MINE DRAWING
========================================================= */

function drawMine(m){

  // Deliberately subtle — mines are "obscured to the enemy" in
  // the sense that the enemy AI never reacts to or avoids them;
  // visually they're just kept low-key/low-opacity so they don't
  // read as an obvious marker on the battlefield.
  ctx.save();

  ctx.globalAlpha=m.armed?.75:.4;

  ctx.translate(m.x,m.y);

  ctx.fillStyle="#2a2a24";
  ctx.beginPath();
  ctx.arc(0,0,8,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle=
    m.team===BLUE?
    "#3d8cff":
    "#ff4d55";

  ctx.lineWidth=1.5;
  ctx.setLineDash([3,2]);
  ctx.beginPath();
  ctx.arc(0,0,8,0,Math.PI*2);
  ctx.stroke();
  ctx.setLineDash([]);

  if(m.armed){

    const pulse=.4+.6*Math.sin(gameTime*10);

    ctx.fillStyle=`rgba(255,60,50,${pulse})`;
    ctx.beginPath();
    ctx.arc(0,0,2.5,0,Math.PI*2);
    ctx.fill();
  }

  ctx.restore();
}


/* =========================================================
   RENDER
========================================================= */

function draw(){

  ctx.clearRect(
    0,0,
    innerWidth,
    innerHeight
  );

  ctx.save();

  ctx.translate(
    innerWidth/2,
    innerHeight/2
  );

  ctx.scale(
    cam.zoom,
    cam.zoom
  );

  ctx.translate(
    -cam.x,
    -cam.y
  );

  drawTerrain();

  // tree lines behind everything
  drawTrees();

  // trenches first
  for(const s of structures)
    if(s.kind==="trench")
      drawTrench(s);

  // buildings
  for(const s of structures)
    if(s.kind!=="trench")
      drawBuilding(s);

  // flags — drawn after buildings/trenches so a flag planted near
  // or inside a building's footprint renders on top of it, not
  // hidden underneath.
  for(const f of flags){

    ctx.strokeStyle=
      f.team===2?
      "#ddd":
      teamColors[f.team];

    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.arc(
      f.x,
      f.y,
      32,
      0,
      Math.PI*2
    );

    ctx.stroke();

    ctx.fillStyle=
      f.team===2?
      "#aaa":
      teamColors[f.team];

    ctx.fillRect(
      f.x-3,
      f.y-55,
      6,
      55
    );

    ctx.fillRect(
      f.x+3,
      f.y-55,
      28,
      15
    );

    // Capture progress bar — only shown while a team is actively
    // flipping this flag (contestedBy set in updateFlags), colored
    // in the contesting team's color, empty-to-full as progress
    // climbs from 0 toward the 4.0 flip threshold.
    if(f.contestedBy!=null&&f.progress>0){

      const barW=56;
      const barH=8;
      const bx=f.x-barW/2;
      const by=f.y+42;

      ctx.fillStyle="rgba(0,0,0,.55)";
      ctx.fillRect(bx-2,by-2,barW+4,barH+4);

      ctx.fillStyle="#20261e";
      ctx.fillRect(bx,by,barW,barH);

      const pct=clamp(f.progress/4,0,1);

      ctx.fillStyle=teamColors[f.contestedBy];
      ctx.fillRect(bx,by,barW*pct,barH);

      ctx.strokeStyle="#111";
      ctx.lineWidth=1;
      ctx.strokeRect(bx,by,barW,barH);
    }
  }

  // units
  for(const u of units)
    drawUnit(u);

  // resupply choppers
  for(const c of choppers)
    drawChopper(c);

  // airstrike planes
  for(const p of airstrikePlanes)
    drawAirstrikePlane(p);

  // kamikaze drones
  for(const kd of kamikazeDrones)
    drawKamikazeDrone(kd);

  // mines
  for(const m of mines)
    drawMine(m);

  // bullets
  for(const b of bullets){

    ctx.fillStyle=
      b.explosive?
      "#ffd66e":
      "#fff";

    ctx.beginPath();

    ctx.arc(
      b.x,
      b.y,
      b.explosive?4:3,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  // particles
  for(const p of particles){

    ctx.globalAlpha=
      clamp(
        p.life/.4,
        0,1
      );

    ctx.fillStyle=p.color;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      3,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.globalAlpha=1;

  // blast rings — visible extent of every explosion this frame
  drawBlastRings();

  ctx.restore();

  drawMinimap();

  updateUI();

  updateStatsPanel();

  renderChat();
}


/* =========================================================
   MINIMAP
========================================================= */

function drawMinimap(){

  const mw=140;
  const mh=90;

  mctx.fillStyle="#1d291b";
  mctx.fillRect(
    0,0,mw,mh
  );

  const sx=mw/W;
  const sy=mh/H;

  for(let y=0;y<H;y+=TILE){

    for(let x=0;x<W;x+=TILE){

      const n=hash(
        Math.floor(x/TILE),
        Math.floor(y/TILE)
      );

      mctx.fillStyle=
        n<.045?
        "#315b69":
        n<.14?
        "#365b32":
        "#4e6d42";

      mctx.fillRect(
        x*sx,
        y*sy,
        TILE*sx+1,
        TILE*sy+1
      );
    }
  }

  for(const s of structures){

    mctx.fillStyle=
      s.kind==="trench"?"#75664c":
      s.kind==="building"?"#6b6152":
      teamColors[s.team];

    mctx.fillRect(
      s.x*sx-2,
      s.y*sy-2,
      4,
      4
    );
  }

  for(const u of units){

    mctx.fillStyle=
      teamColors[u.team];

    mctx.fillRect(
      u.x*sx-1,
      u.y*sy-1,
      2,
      2
    );
  }

  for(const c of choppers){

    mctx.fillStyle="#ffd66e";

    mctx.fillRect(
      c.x*sx-2,
      c.y*sy-2,
      4,
      4
    );
  }

  for(const p of airstrikePlanes){

    mctx.fillStyle="#e8e8e8";

    mctx.fillRect(
      p.x*sx-2,
      p.y*sy-2,
      4,
      4
    );
  }

  for(const kd of kamikazeDrones){

    mctx.fillStyle="#ff5a3d";

    mctx.fillRect(
      kd.x*sx-1.5,
      kd.y*sy-1.5,
      3,
      3
    );
  }

  for(const m of mines){

    mctx.fillStyle=
      m.team===BLUE?
      "#3d8cff88":
      "#ff4d5588";

    mctx.fillRect(
      m.x*sx-1.5,
      m.y*sy-1.5,
      3,
      3
    );
  }
}


/* =========================================================
   UI
========================================================= */

function updateUI(){

  const blueUnits=
    units.filter(
      u=>u.team===BLUE
    ).length;

  const redUnits=
    units.filter(
      u=>u.team===RED
    ).length;

  const blueFlags=
    flags.filter(
      f=>f.team===BLUE
    ).length;

  const redFlags=
    flags.filter(
      f=>f.team===RED
    ).length;

  statusEl.innerHTML=`
    <span class="blue">BLUE AI</span>
    ${Math.floor(teams[BLUE].res)}
    resources ·
    ${blueUnits} units ·
    ${blueFlags} sectors
    <br>
    <span class="red">RED AI</span>
    ${Math.floor(teams[RED].res)}
    resources ·
    ${redUnits} units ·
    ${redFlags} sectors
    <br>
    <span class="gold">
    Battle time:
    ${Math.floor(gameTime)}s
    </span>
    <br>
    Buildings:
    ${structures.length}
    <br>
    ${paused?
      "<b>⏸ PAUSED</b>":
      "⚔ AI BATTLE IN PROGRESS"}
  `;
}


function renderChat(){

  for(const team of [BLUE,RED]){

    const el=chatEls[team];

    if(!el)
      continue;

    const label=
      "<b class='"+
      (team===BLUE?"blue":"red")+
      "'>"+teamNames[team]+" COMMS</b>";

    if(!hasComms(team)){

      el.innerHTML=
        label+
        "<div class='chatline chatdown'>"+
        "[ radio operator down — comms silent ]"+
        "</div>";

      continue;
    }

    const recent=teamChat[team].slice(-6);

    if(!recent.length){

      el.innerHTML=
        label+
        "<div class='chatline chatdown'>"+
        "[ channel quiet ]"+
        "</div>";

      continue;
    }

    let html=label;

    for(const c of recent){

      html+=
        "<div class='chatline'>"+
        String(c.text)
          .replace(/&/g,"&amp;")
          .replace(/</g,"&lt;")+
        "</div>";
    }

    el.innerHTML=html;
  }
}


/* =========================================================
   CAMERA
========================================================= */

addEventListener(
  "keydown",
  e=>{

    if(e.code==="Space")
      paused=!paused;

    if(e.key.toLowerCase()==="r")
      newGame();
  }
);

let keys={};

addEventListener(
  "keydown",
  e=>{
    keys[e.key.toLowerCase()]=true;
  }
);

addEventListener(
  "keyup",
  e=>{
    keys[e.key.toLowerCase()]=false;
  }
);

canvas.addEventListener(
  "wheel",
  e=>{

    e.preventDefault();

    cam.zoom=clamp(
      cam.zoom*
      Math.exp(-e.deltaY*.001),
      .18,
      1.8
    );

  },
  {passive:false}
);

canvas.addEventListener(
  "mousedown",
  e=>{

    if(e.button===1){

      mouse.middle=true;

      canvas.style.cursor=
        "grabbing";
    }
  }
);

canvas.addEventListener(
  "mouseup",
  e=>{

    if(e.button===1){

      mouse.middle=false;

      canvas.style.cursor=
        "grab";
    }
  }
);

canvas.addEventListener(
  "mousemove",
  e=>{

    if(mouse.middle){

      cam.x-=
        e.movementX/cam.zoom;

      cam.y-=
        e.movementY/cam.zoom;
    }
  }
);


/* =========================================================
   CAMERA KEYBOARD
========================================================= */

function updateCamera(dt){

  const speed=
    950/cam.zoom;

  if(keys.w)
    cam.y-=speed*dt;

  if(keys.s)
    cam.y+=speed*dt;

  if(keys.a)
    cam.x-=speed*dt;

  if(keys.d)
    cam.x+=speed*dt;

  cam.x=clamp(
    cam.x,
    200,
    W-200
  );

  cam.y=clamp(
    cam.y,
    160,
    H-160
  );
}


/* =========================================================
   NEW GAME
========================================================= */

function newGame(){

  seed=(
    Date.now()^
    ((Math.random()*0xffffffff)>>>0)
  )>>>0;

  reset();
}

    score:0,
    aiTimer:0,
    construction:null,
    pendingSupply:null,
    commsTimer:3+rand()*3,
