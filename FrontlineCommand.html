<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d", {alpha:false});
if(!ctx){
  document.body.innerHTML="<pre style='padding:20px;color:white;background:#111'>Canvas 2D is unavailable in this browser.</pre>";
  throw new Error("Canvas 2D unavailable");
}

const mini=document.getElementById("minimap");
const mctx=mini.getContext("2d");

const statusEl=document.getElementById("status");
const chatEls=[
  document.getElementById("chatBlue"),
  document.getElementById("chatRed")
];

let DPR=1;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);

  canvas.width=Math.max(1,Math.floor(innerWidth*DPR));
  canvas.height=Math.max(1,Math.floor(innerHeight*DPR));
  canvas.style.width=innerWidth+"px";
  canvas.style.height=innerHeight+"px";

  ctx.setTransform(DPR,0,0,DPR,0,0);
}

addEventListener("resize",resize);
resize();


/* =========================================================
   WORLD
   ENLARGED AGAIN — big open theater
========================================================= */

const W=4400;
const H=2850;
const TILE=55;

function fx(f){ return W*f; }
function fy(f){ return H*f; }

let seed=Date.now()>>>0;
let rng=1;

function srand(s){
  rng=s>>>0;
}

function rand(){
  rng=(rng*1664525+1013904223)>>>0;
  return rng/4294967296;
}

function hash(x,y){
  let n=(x*374761393+y*668265263+seed)>>>0;
  n=(n^(n>>13))*1274126177>>>0;
  return ((n^(n>>16))>>>0)/4294967296;
}

function clamp(v,a,b){
  return Math.max(a,Math.min(b,v));
}

function distToSegment(px,py,x1,y1,x2,y2){

  // Closest distance from a point to a finite line segment —
  // shared by building-wall movement collision, bullet collision,
  // and (via segmentsIntersect below) indirectly informs the LOS
  // math too.
  const dx=x2-x1;
  const dy=y2-y1;
  const len2=dx*dx+dy*dy||1;

  let t=((px-x1)*dx+(py-y1)*dy)/len2;
  t=clamp(t,0,1);

  const cx=x1+dx*t;
  const cy=y1+dy*t;

  return Math.hypot(px-cx,py-cy);
}

function segmentsIntersect(x1,y1,x2,y2,x3,y3,x4,y4){

  // Standard finite-segment intersection test — used to check a
  // sightline (or bullet path) against a single building wall
  // segment. Returns false for parallel/collinear segments, which
  // is fine here (a sightline running exactly along a wall isn't
  // the case this needs to catch).
  const d1x=x2-x1, d1y=y2-y1;
  const d2x=x4-x3, d2y=y4-y3;

  const denom=d1x*d2y-d1y*d2x;

  if(Math.abs(denom)<1e-9)
    return false;

  const t=((x3-x1)*d2y-(y3-y1)*d2x)/denom;
  const u=((x3-x1)*d1y-(y3-y1)*d1x)/denom;

  return t>=0&&t<=1&&u>=0&&u<=1;
}

function rectCircleOverlap(rx,ry,halfW,halfH,cx,cy,cr){

  // Used by building placement to reject overlap against existing
  // (circular-footprint) structures — closest point on the
  // candidate rectangle to the other structure's center, compared
  // against its radius.
  const px=clamp(cx,rx-halfW,rx+halfW);
  const py=clamp(cy,ry-halfH,ry+halfH);

  return Math.hypot(cx-px,cy-py)<cr;
}

function distance(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y);
}


/* =========================================================

/* =========================================================

const TYPES={

 },

// "Infantry" — the boots-on-the-ground roles that are allowed to
// dig field trenches. Vehicles, the mortar crew, and engineers
// (who build instead) don't.
const INFANTRY_TYPES=[
  "rifleman","mg","medic","leader",
  "marksman","grenadier","comms"
];

// Each unit type plays a different strategy so squads don't all
// pile onto the same flag:
//  - "rusher"   pushes hard toward the enemy HQ, mostly ignoring flags
//  - "capturer" chases down and holds contested/enemy flags (the classic push)
//  - "defender" holds a flag the team already owns, or its own back line
//  - "sniper"   hangs back near the frontline and fights at long range
//  - "support"  unchanged specialist behavior (medic/comms/engineer)
const ROLE_BY_TYPE={
  rifleman:"rusher",
  vehicle:"rusher",

  grenadier:"capturer",

  mg:"defender",
  leader:"defender",

  marksman:"sniper",
  mortar:"sniper",

  medic:"support",
  comms:"support",
  engineer:"support",
  supplier:"support"
};


/* =========================================================
   STRUCTURES
========================================================= */

const BUILDING_DATA={
 HQ:{
  r:75,
  hp:1100
 },

 barracks:{
  r:55,
  hp:500
 },

 bunker:{
  r:48,
  hp:650
 },

 trench:{
  r:35,
  hp:220
 },

 wall:{
  r:25,

 }
};


/* =========================================================
   TERRAIN
========================================================= */

function terrainAt(x,y){

  if(x<0||y<0||x>W||y>H)
    return "water";

  const tx=Math.floor(x/TILE);
  const ty=Math.floor(y/TILE);

  const n=hash(tx,ty);

  if(n<.045)return "water";
  if(n<.14)return "forest";
  if(n<.22)return "rough";
  if(n<.28)return "hill";

  return "field";
}


/* =========================================================
   PROCEDURAL FOREST
   Organic clumps grown from layered noise fields instead of
   straight defensive belts — no two battles look alike, and
   nothing spawns as a hard border.
========================================================= */

function treeClearOf(x,y,r){

  // Keep trees off buildings, trenches, and each other's trunks
  // so forest clumps never visually merge into structures.
  for(const s of structures){

    const pad=
      s.kind==="trench"?
      46:
      s.r+34;

    if(Math.hypot(x-s.x,y-s.y)<pad+r)
      return false;
  }

  // keep a breathing corridor around each HQ's spawn yard
  for(const hqTeam of [BLUE,RED]){

    const hq=findBase(hqTeam);

    if(hq && Math.hypot(x-hq.x,y-hq.y)<260)
      return false;
  }

  return true;
}


function forestField(x,y){

  // Three octaves of hashed noise, blended, produce soft
  // organic clumping instead of a uniform scatter.
  const n1=hash(Math.floor(x/210),Math.floor(y/210));
  const n2=hash(Math.floor(x/95)+4021,Math.floor(y/95)+7333);
  const n3=hash(Math.floor(x/38)+8811,Math.floor(y/38)+1190);

  return n1*.5+n2*.32+n3*.18;
}


function proceduralTrees(){

  trees=[];

  // Denser sampling grid and a lower density threshold than
  // before — noticeably more forest overall, but it's still
  // driven by the same clumped noise field, so it grows as
  // thicker/wider clusters rather than an even scatter.
  const cell=52;

  for(let gy=cell;gy<H-cell;gy+=cell){

    for(let gx=cell;gx<W-cell;gx+=cell){

      const jx=gx+(rand()-.5)*cell*.6;
      const jy=gy+(rand()-.5)*cell*.6;

      const density=forestField(jx,jy);

      if(density<.30)
        continue;

      // denser noise -> bigger, thicker clump
      const clumpCount=
        1+Math.floor((density-.30)*38);

      for(let i=0;i<clumpCount;i++){

        const x=jx+(rand()-.5)*cell*1.3;
        const y=jy+(rand()-.5)*cell*1.3;
        const r=12+rand()*9;

        if(treeClearOf(x,y,r)){
          trees.push({x,y,r});
        }
      }
    }
  }

  buildTreeGrid();

  scatterFieldTrees();
}


function scatterFieldTrees(){

  // A light, sparse sprinkling of standalone trees across open
  // field tiles — separate from the dense forest clumps above,
  // and deliberately kept thin so open ground still reads as
  // open, not a second forest.
  const cell=150;

  for(let gy=cell;gy<H-cell;gy+=cell){

    for(let gx=cell;gx<W-cell;gx+=cell){

      if(rand()>.24)
        continue;

      const x=gx+(rand()-.5)*cell*.7;
      const y=gy+(rand()-.5)*cell*.7;

      if(terrainAt(x,y)!=="field")
        continue;

      // stay well clear of existing clumps so this reads as
      // scattered trees, not an extension of the forest
      if(treesNear(x,y,55)>0)
        continue;

      const r=10+rand()*6;

      if(treeClearOf(x,y,r))
        trees.push({x,y,r});
    }
  }

  buildTreeGrid();
}


function buildTreeGrid(){

  treeGrid=new Map();

  for(const t of trees){

    const key=
      Math.floor(t.x/TREE_CELL)+
      ","+
      Math.floor(t.y/TREE_CELL);

    if(!treeGrid.has(key))
      treeGrid.set(key,[]);

    treeGrid.get(key).push(t);
  }
}


function findDenseEnemyPoint(team){

  // Coarse grid-binning to find where the enemy is currently
  // clustered — same spirit as treeGrid's spatial hash above, just
  // used once per airstrike call rather than kept live. Much
  // cheaper than a per-unit O(n^2) distance-clustering scan, and
  // simple enough that it doesn't need to be.
  const CELL=300;
  const counts=new Map();

  for(const u of units){

    if(u.team===team||u.hp<=0)
      continue;

    const gx=Math.floor(u.x/CELL);
    const gy=Math.floor(u.y/CELL);
    const key=gx+","+gy;

    counts.set(key,(counts.get(key)||0)+1);
  }

  let bestKey=null;
  let bestCount=0;

  for(const[key,count] of counts){

    if(count>bestCount){
      bestCount=count;
      bestKey=key;
    }
  }

  if(!bestKey)
    return null;

  const[gx,gy]=bestKey.split(",").map(Number);

  return {
    x:(gx+.5)*CELL,
    y:(gy+.5)*CELL
  };
}


function treesNear(x,y,radius){

  // Grid-bucketed lookup so concealment checks stay cheap
  // even with thousands of trees on a large map.
  const cx=Math.floor(x/TREE_CELL);
  const cy=Math.floor(y/TREE_CELL);

  const span=Math.ceil(radius/TREE_CELL)+1;

  let count=0;

  for(let gy=cy-span;gy<=cy+span;gy++){

    for(let gx=cx-span;gx<=cx+span;gx++){

      const bucket=treeGrid.get(gx+","+gy);

      if(!bucket)
        continue;

      for(const t of bucket){

        if(Math.hypot(x-t.x,y-t.y)<radius+t.r)
          count++;
      }
    }
  }

  return count;
}


function isConcealed(u){

  // A unit tucked against a few trees is much harder to spot —
  // this is what lets a marksman hide in the treeline. A
  // ghillie-suited marksman blends in with just a single tree.
  const needed=u.ghillie?1:2;

  return treesNear(u.x,u.y,26)>=needed;
}


function structuresBlockLOS(ax,ay,bx,by){

  // Only solid buildings occlude sight — trenches and low
  // sandbag walls don't. Uses point-to-segment distance so a
  // building anywhere along the sightline blocks it. Single-room
  // buildings are handled separately, per wall segment, by
  // buildingWallsBlockLOS() below — they have real openings, so a
  // single whole-disc test would be wrong for them.
  const dx=bx-ax;
  const dy=by-ay;
  const len2=dx*dx+dy*dy||1;

  for(const s of structures){

    if(
      s.kind!=="HQ"&&
      s.kind!=="barracks"&&
      s.kind!=="bunker"
    )
      continue;

    let t=
      ((s.x-ax)*dx+(s.y-ay)*dy)/len2;

    t=clamp(t,0,1);

    const px=ax+dx*t;
    const py=ay+dy*t;

    if(Math.hypot(px-s.x,py-s.y)<s.r*.92)
      return true;
  }

  return false;
}


function buildingWallsBlockLOS(ax,ay,bx,by,ignoreBuildingWalls=false){

  // Single-room buildings block sight per wall segment instead of
  // as one opaque disc — a sightline through a gap between two
  // solid segments is simply never tested against anything, so it
  // passes clean. That's what makes shelter emergent: a unit
  // behind a wall genuinely isn't visible from that angle, one
  // standing in an opening genuinely is. A Laser-Sighted marksman
  // sees straight through these walls, same as they always could
  // with the old ruins.
  if(ignoreBuildingWalls)
    return false;

  for(const s of structures){

    if(s.kind!=="building")
      continue;

    // Cheap bounding-circle reject before checking every segment.
    if(distToSegment(s.x,s.y,ax,ay,bx,by)>s.r+20)
      continue;

    for(const w of s.walls){

      if(segmentsIntersect(ax,ay,bx,by,w.x1,w.y1,w.x2,w.y2))
        return true;
    }
  }

  return false;
}


function sightBlocked(ax,ay,bx,by,ignoreBuildingWalls=false){

  return (
    structuresBlockLOS(ax,ay,bx,by)||
    buildingWallsBlockLOS(ax,ay,bx,by,ignoreBuildingWalls)||
    treesBlockLOS(ax,ay,bx,by)
  );
}


function treesBlockLOS(ax,ay,bx,by){

  // Walks the sightline through the tree grid in short hops and
  // checks nearby trunks with point-to-segment distance, so a
  // thick tree line blocks sight the same way a building does —
  // a single lone tree is thin enough to usually still see past.
  const dx=bx-ax;
  const dy=by-ay;
  const len2=dx*dx+dy*dy||1;
  const dist=Math.hypot(dx,dy)||1;

  const hops=Math.max(1,Math.ceil(dist/(TREE_CELL*.5)));

  const seenCells=new Set();

  for(let i=0;i<=hops;i++){

    const t=i/hops;
    const px=ax+dx*t;
    const py=ay+dy*t;

    const cx=Math.floor(px/TREE_CELL);
    const cy=Math.floor(py/TREE_CELL);

    for(let gy=cy-1;gy<=cy+1;gy++){

      for(let gx=cx-1;gx<=cx+1;gx++){

        const key=gx+","+gy;

        if(seenCells.has(key))
          continue;

        seenCells.add(key);

        const bucket=treeGrid.get(key);

        if(!bucket)
          continue;

        for(const tr of bucket){

          let tt=
            ((tr.x-ax)*dx+(tr.y-ay)*dy)/len2;

          tt=clamp(tt,0,1);

          const cxp=ax+dx*tt;
          const cyp=ay+dy*tt;

          if(Math.hypot(cxp-tr.x,cyp-tr.y)<tr.r*.85)
            return true;
        }
      }
    }
  }

  return false;
}


function hasLineOfSight(a,b){

  return !sightBlocked(a.x,a.y,b.x,b.y);
}


/* =========================================================
   TRENCHES
========================================================= */

function makeTrenchLine(team,x1,y1,x2,y2){

  const d=Math.hypot(x2-x1,y2-y1);
  const count=Math.floor(d/45);

  for(let i=0;i<count;i++){

    const t=(i+.5)/count;

    const x=x1+(x2-x1)*t;
    const y=y1+(y2-y1)*t;

    const angle=Math.atan2(y2-y1,x2-x1);

    structures.push({
      kind:"trench",
      team,
      x:x+(rand()-.5)*8,
      y:y+(rand()-.5)*8,
      angle,
      r:34,
      hp:220,
      maxhp:220
    });
  }

  // communication trench connectors
  structures.push({
    kind:"trench",
    team,
    x:(x1+x2)/2,
    y:(y1+y2)/2,
    angle:Math.atan2(y2-y1,x2-x1),
    r:42,
    hp:220,
    maxhp:220
  });
}


function makeTrenchNetwork(team,points){

  for(let i=0;i<points.length-1;i++){

    makeTrenchLine(
      team,
      points[i].x,
      points[i].y,
      points[i+1].x,
      points[i+1].y
    );
  }
}


function digFieldTrench(team,x,y){

  // Don't stack foxholes on top of each other — only dig if
  // there isn't already a friendly trench nearby.
  for(const s of structures){

    if(
      s.kind==="trench"&&
      s.team===team&&
      Math.hypot(s.x-x,s.y-y)<75
    )
      return;
  }

  // A single foxhole/trench segment dug in the field by
  // whichever infantry unit stopped to dig — angled toward
  // the enemy HQ so it actually offers cover.
  const enemyHQ=findBase(team===BLUE?RED:BLUE);

  const angle=
    enemyHQ?
    Math.atan2(enemyHQ.y-y,enemyHQ.x-x)+Math.PI/2:
    rand()*Math.PI*2;

  structures.push({
    kind:"trench",
    team,
    x,y,
    angle,
    r:32,
    hp:190,
    maxhp:190
  });
}


/* =========================================================
   BUILDINGS
========================================================= */

function clearTreesForStructure(x,y,r){

  // Building something means clearing the ground for it first —
  // any tree whose canopy overlaps the new structure's footprint
  // gets cut down. Bigger structures (bigger r) clear a wider
  // area, so a bunker costs a lot more treeline than a wall does.
  let cleared=0;

  trees=trees.filter(t=>{

    if(Math.hypot(t.x-x,t.y-y)<r+t.r){
      cleared++;
      return false;
    }

    return true;
  });

  if(cleared)
    buildTreeGrid();

  return cleared;
}


function makeBuilding(kind,team,x,y){

  const d=BUILDING_DATA[kind];

  structures.push({
    kind,
    team,
    x,
    y,
    r:d.r,
    hp:d.hp,
    maxhp:d.hp,

    // Multiple doors / entrances
    doors:[
      {side:"front",open:false},
      {side:"rear",open:false},
      {side:"left",open:false},
      {side:"right",open:false}
    ],

    spawn:0
  });
}


function makeSingleRoomBuilding(x,y){

  // Single-room buildings, replacing ruins. Footprint size and
  // wall/opening layout are both keyed off the building's own
  // position via hash() (not the shared rand() stream), so a
  // given building's interior is reproducible regardless of
  // generation order — same approach terrainAt()/forestField()
  // already use.
  const bx=Math.floor(x);
  const by=Math.floor(y);

  const halfW=45+hash(bx,by+1)*40;
  const halfH=45+hash(bx+7,by+3)*40;
  const r=Math.hypot(halfW,halfH);

  const corners=[
    {x:x-halfW,y:y-halfH},
    {x:x+halfW,y:y-halfH},
    {x:x+halfW,y:y+halfH},
    {x:x-halfW,y:y+halfH}
  ];

  const sides=[
    [corners[0],corners[1]],
    [corners[1],corners[2]],
    [corners[2],corners[3]],
    [corners[3],corners[0]]
  ];

  // Each wall is walked in runs the same way makeTrenchLine()
  // walks a trench line, alternating irregular-length solid runs
  // with irregular-length OPEN runs — but every open run is
  // guaranteed at least MIN_OPEN_RUN segments long, so a gap is
  // always comfortably wider than even the largest unit's
  // collision footprint (a vehicle, 48px across) rather than
  // sometimes landing as a single too-narrow segment nobody can
  // actually walk through. That per-run randomness (not a fixed
  // door width/count) is still what produces the irregular gap
  // pattern.
  //
  // Solid/open state is tracked per segment here (rather than
  // emitting wall geometry immediately) so a top-up pass below can
  // guarantee a minimum amount of actual wall, since a short side
  // can otherwise roll one single open run that swallows the
  // entire side and leaves it with no wall at all.
  const segLen=34;
  const MIN_OPEN_RUN=3;
  const MIN_WALL_SEGMENTS=4;

  const sideSegs=[];

  for(let side=0;side<4;side++){

    const p1=sides[side][0];
    const p2=sides[side][1];
    const len=Math.hypot(p2.x-p1.x,p2.y-p1.y);
    const count=Math.max(MIN_OPEN_RUN,Math.round(len/segLen));
    const solid=new Array(count).fill(true);

    let i=0;

    while(i<count){

      const roll=hash(
        bx*13+side*97+i*3+1,
        by*17+side*31+i*7+1
      );

      const canOpenHere=(count-i)>=MIN_OPEN_RUN;

      if(roll<.4&&canOpenHere){

        // An opening run — always at least MIN_OPEN_RUN segments,
        // with a little extra irregular length layered on top
        // when there's room for it.
        const extraRoll=hash(
          bx*31+side*53+i*11+2,
          by*29+side*71+i*17+2
        );

        const runLen=Math.min(
          MIN_OPEN_RUN+Math.floor(extraRoll*3),
          count-i
        );

        for(let k=0;k<runLen;k++)
          solid[i+k]=false;

        i+=runLen;

      }else{

        // A solid run of irregular length — this, plus which
        // stretches above get promoted to openings, is what
        // produces the non-uniform wall pattern.
        const lenRoll=hash(
          bx*17+side*61+i*7+3,
          by*23+side*43+i*19+3
        );

        const runLen=Math.min(
          1+Math.floor(lenRoll*3),
          count-i
        );

        i+=runLen;
      }
    }

    sideSegs.push({p1,p2,count,solid});
  }

  function totalSolid(){

    let n=0;

    for(const s of sideSegs)
      for(const v of s.solid)
        if(v)
          n++;

    return n;
  }

  function openRuns(){

    const runs=[];

    for(let side=0;side<4;side++){

      const s=sideSegs[side];
      let runStart=null;

      for(let i=0;i<=s.count;i++){

        const open=i<s.count&&!s.solid[i];

        if(open&&runStart===null)
          runStart=i;

        if((!open||i===s.count)&&runStart!==null){
          runs.push({side,start:runStart,length:i-runStart});
          runStart=null;
        }
      }
    }

    return runs;
  }

  // Safety net — guarantee at least one properly-sized opening
  // exists even if every run happened to roll solid. Carves one
  // out of whichever side has the most segments to work with.
  if(totalSolid()===sideSegs.reduce((n,s)=>n+s.count,0)){

    let best=0;

    for(let side=1;side<4;side++)
      if(sideSegs[side].count>sideSegs[best].count)
        best=side;

    const s=sideSegs[best];

    const startIdx=Math.floor(
      hash(bx+99,by+199)*(s.count-MIN_OPEN_RUN+1)
    );

    for(let k=0;k<MIN_OPEN_RUN;k++)
      s.solid[startIdx+k]=false;
  }

  // Top-up pass — guarantee at least MIN_WALL_SEGMENTS solid
  // segments total, so a building never reads as "barely any
  // walls." Always shrinks the CURRENTLY-LARGEST open run by one
  // segment at a time first (it has the most slack above
  // MIN_OPEN_RUN), only fully closing a run once it's already at
  // that passable-width floor — and never closes the very last
  // opening left, so the room always stays enterable.
  let guard=0;

  while(totalSolid()<MIN_WALL_SEGMENTS&&guard<40){

    guard++;

    const runs=openRuns();

    if(!runs.length)
      break;

    let best=runs[0];

    for(const rn of runs)
      if(rn.length>best.length)
        best=rn;

    if(best.length>MIN_OPEN_RUN){

      sideSegs[best.side].solid[best.start]=true;

    }else if(runs.length>1){

      for(let k=0;k<best.length;k++)
        sideSegs[best.side].solid[best.start+k]=true;

    }else{

      break;
    }
  }

  // Emit the actual wall segment geometry from the final
  // solid/open state. Openings are simply segments that never get
  // added to `walls`, so LOS/collision/bullets naturally pass
  // through them without any special-cased "is this a door"
  // lookup.
  const walls=[];

  for(const{p1,p2,count,solid} of sideSegs){

    for(let i=0;i<count;i++){

      if(!solid[i])
        continue;

      const t0=i/count;
      const t1=(i+1)/count;

      walls.push({
        x1:p1.x+(p2.x-p1.x)*t0,
        y1:p1.y+(p2.y-p1.y)*t0,
        x2:p1.x+(p2.x-p1.x)*t1,
        y2:p1.y+(p2.y-p1.y)*t1
      });
    }
  }

  const hp=Math.round(650+(halfW+halfH)*3);

  const s={
    kind:"building",
    team:2,
    x,y,
    halfW,halfH,
    r,
    walls,
    hp,
    maxhp:hp
  };

  structures.push(s);

  return s;
}


function scatterBuildings(){

  // Nine neutral single-room buildings dotted around no-man's-land
  // — the same role ruins used to play (extra cover/obstacles
  // beyond each team's own HQ/barracks/bunker), same count, same
  // central-area placement bias, just with real walls and real
  // openings instead of one "fully sheltered inside" disc.
  for(let i=0;i<9;i++){

    let attempts=0;
    let placed=false;

    // The last several attempts relax the overlap padding so a
    // crowded map still ends up with all 9 rather than silently
    // placing fewer, the way scatterRuins() used to be able to.
    const maxAttempts=70;
    const relaxAt=maxAttempts-15;

    while(attempts<maxAttempts&&!placed){

      attempts++;

      const x=W/2+(rand()-.5)*fx(.6);
      const y=H/2+(rand()-.5)*fy(.82);

      if(terrainAt(x,y)==="water")
        continue;

      const bx=Math.floor(x);
      const by=Math.floor(y);

      // Same size formula as makeSingleRoomBuilding() — peeked
      // here so the overlap check knows the real footprint before
      // committing to this position.
      const halfW=45+hash(bx,by+1)*40;
      const halfH=45+hash(bx+7,by+3)*40;

      const pad=
        attempts>relaxAt?
        40:
        90;

      let clear=true;

      for(const s of structures){

        if(rectCircleOverlap(x,y,halfW,halfH,s.x,s.y,s.r+pad)){
          clear=false;
          break;
        }
      }

      if(clear){

        const s=makeSingleRoomBuilding(x,y);

        clearTreesForStructure(s.x,s.y,s.r);

        placed=true;
      }
    }
  }
}


/* =========================================================
   COLLISION
========================================================= */

function blocked(x,y,r=10){

  if(x<25||y<25||x>W-25||y>H-25)
    return true;

  if(terrainAt(x,y)==="water")
    return true;

  for(const s of structures){

    if(s.kind==="trench")
      continue;

    if(s.kind==="wall" &&
       Math.hypot(x-s.x,y-s.y)<s.r+r)
      return true;

    if(s.kind==="building"){

      // Cheap bounding-circle reject before checking individual
      // wall segments. A unit can walk freely through any gap —
      // openings simply aren't in s.walls at all, so there's
      // nothing here to collide with at those angles.
      if(Math.hypot(x-s.x,y-s.y)>s.r+r)
        continue;

      for(const w of s.walls){

        if(distToSegment(x,y,w.x1,w.y1,w.x2,w.y2)<r+4)
          return true;
      }

      continue;
    }

    if(
      (s.kind==="HQ"||
       s.kind==="barracks"||
       s.kind==="bunker") &&
      Math.hypot(x-s.x,y-s.y)<s.r+r
    ){
      // entrances remain walkable
      if(isNearDoor(s,x,y))
        continue;

      return true;
    }
  }

  return false;
}


function isNearDoor(s,x,y){

  const r=s.r;

  const doors=[
    [s.x,s.y-r],
    [s.x,s.y+r],
    [s.x-r,s.y],
    [s.x+r,s.y]
  ];

  for(const d of doors)
    if(Math.hypot(x-d[0],y-d[1])<24)
      return true;

  return false;
}


function nearestDoorPoint(s,fromX,fromY){

  // A structure's bare center sits deep inside its solid disc —
  // blocked() only lets a unit through within 24px of one of the
  // four door points (see isNearDoor above), so sending a goal
  // straight at the center makes a unit walk up to the wall, get
  // rejected, and re-target the same unreachable point forever
  // (the frozen-at-HQ bug). Biasing toward whichever door pocket
  // is closest to the unit's approach angle fixes that, and a
  // small jitter — same idea as the defender fallback's spread —
  // keeps multiple units retreating to the same door from all
  // stacking on the exact same pixel.
  const r=s.r;

  const doors=[
    {x:s.x,y:s.y-r},
    {x:s.x,y:s.y+r},
    {x:s.x-r,y:s.y},
    {x:s.x+r,y:s.y}
  ];

  let best=doors[0];
  let bestD=Infinity;

  for(const d of doors){

    const dist=Math.hypot(fromX-d.x,fromY-d.y);

    if(dist<bestD){
      bestD=dist;
      best=d;
    }
  }

  return {
    x:best.x+(rand()-.5)*20,
    y:best.y+(rand()-.5)*20
  };
}


/* =========================================================
   UNITS
========================================================= */

function makeUnit(type,team,x,y){

  const t=TYPES[type];

  units.push({
    id:nextId++,
    type,
    team,
    x,y,

    role:ROLE_BY_TYPE[type]||"capturer",

    // which way the unit is visually facing (radians, 0 = +X);
    // starts pointed roughly toward the enemy and turns to track
    // its target or movement direction — see updateFacing().
    facing:team===BLUE?0:Math.PI,

    hp:t.hp,
    maxhp:t.hp,

    cd:rand()*t.rate,

    // Ammo — see shoot() and the reload-timer decrement in
    // simulationStep(). Starts topped up: a full magazine plus a
    // full reserve on top of it.
    mag:t.magSize,
    reserve:t.reserveSize,
    reloading:false,
    reloadTimer:0,

    // Set the moment a reload finishes, so the ammo readout (see
    // drawUnit()) knows when to start fading back out.
    lastReloadTime:-999,

    // Supplier's 1000-round pack, drawn down as it resupplies
    // allies in the field — see updateSupplyDeliveries() and the
    // supplier behavior block in updateUnitAI(). Meaningless for
    // any other type.
    ammoPack:type==="supplier"?1000:0,

    // Set on a Supplier that's physically carrying a completed
    // upgrade kit (see processTeamTimers()) out to whoever it fits
    // — null, "ghillie", or "laserSights". Lost for good if this
    // Supplier dies before delivering it.
    carryingUpgrade:null,

    // Field resupply — mirrors the medic critical-revive timer
    // pattern (reviveProgress/reviveRequired above): a receiving
    // unit accumulates progress while a Supplier is in range,
    // taking 3-7s depending on how much reserve is actually
    // missing, resolved by updateSupplyDeliveries() each frame.
    resupplyProgress:0,
    resupplyRequired:undefined,
    beingResupplied:false,

    goal:null,
    order:"idle",

    // Placeholder hook for the eventual empty-handed melee
    // mechanic — see the out-of-ammo branch in updateUnitAI().
    // Not real combat yet, just tracks whether this unit is
    // currently in that state.
    meleeFallback:false,

    // Melee combat — see resolveMeleeAttack()/updateBleeding().
    // meleeCd is a separate cooldown from the ranged u.cd, so
    // switching to a knife doesn't fight over the same timer as
    // a rifle. recentlyStabbedTimer arms briefly on a landed hit
    // (see RECENTLY_STABBED_WINDOW) — if the victim starts
    // retreating while it's still active, bleeding kicks in.
    meleeCd:0,
    recentlyStabbedTimer:0,
    bleeding:false,
    bleedTimeLeft:0,
    bleedTickTimer:0,

    kills:0,
    brain:rand(),

    aiTimer:rand()*.5,

    target:null,
    retreat:false,

    // Critical Failure — see enterCriticalFailure()/damageUnit()
    critical:false,
    criticalTimer:0,
    dragging:null,    // the critical-failure unit this unit is currently dragging to safety
    draggedBy:null,   // the unit currently dragging THIS unit to safety (only set while critical)
    reviveProgress:0, // seconds a medic has spent reviving this critical unit
    reviveRequired:undefined, // seconds needed to finish this particular revive
    beingHealed:false,// true this tick while a medic is actively working on a critical unit

    // Drone operator lock — an engineer piloting a kamikaze drone
    // (see the engineer build logic) freezes in place until the
    // drone dies, then thaws out a second later. See
    // updateDroneOperators().
    frozenByDrone:false,
    droneThaw:0,

    // Laser Sights (marksman upgrade) — see the engineer kit-out
    // logic and updateBullets(). Mutually exclusive with ghillie.
    laserSights:false,

    // Seconds of stun remaining — set on laser-sighted marksmen
    // whenever they're hit (see damageUnit()).
    stunned:0,

    // Leader-follow system — see updateLeaderFollowDwell() and
    // updateUnitAI(). leaderDwell/dwellLeader are pure proximity
    // tracking: continuous seconds spent near dwellLeader,
    // regardless of whether the escort is currently full.
    // followingLeader is the actual, cap-checked "currently being
    // driven by the leader" state — that's what countLeaderFollowers()
    // counts, and what speedOverride is tied to.
    leaderDwell:0,
    dwellLeader:null,
    followingLeader:null,
    speedOverride:null,

    cover:null,

    // morale drifts with combat outcomes and shapes how
    // readily a unit breaks off and retreats
    morale:.75+rand()*.25,

    // flanking bias: -1..1, decided once per unit so a squad
    // naturally spreads left/right instead of stacking a line
    flankBias:(rand()-.5)*2,

    // movement / steering state used by moveUnit's obstacle
    // avoidance and idle-wander behavior
    stuck:0,
    lastDist:undefined,
    wanderTimer:rand()*2,
    wanderGoal:null
  });
}


/* =========================================================
   TARGETING
========================================================= */

// High-value roles worth prioritizing when a comparably-close
// alternative target is available — killing a medic or leader
// hurts the enemy team more than another rifleman.
const HIGH_VALUE_TYPES=["medic","leader","comms","engineer","supplier"];

function anyLivingEnemyInRange(u,range){

  // Deliberately ignores line of sight — used only to tell mortar
  // "there's nobody to shoot at all" apart from "there's someone
  // out there, I just can't see them," which is exactly the
  // distinction that triggers indirect fire.
  for(const v of units){

    if(v.team===u.team||v.hp<=0)
      continue;

    if(Math.hypot(u.x-v.x,u.y-v.y)<range)
      return true;
  }

  return false;
}


function nearestEnemy(u,range=Infinity,preferValue=false){

  let best=null;
  let bd=range;

  for(const v of units){

    // Fully-dead units are skipped as before, but a unit in
    // Critical Failure (hp pinned at 0) can still be targeted —
    // that's what lets the enemy finish off a downed casualty.
    // Shelter behind a building's walls isn't a separate check
    // here anymore — it falls straight out of the sightBlocked()
    // call below, which tests per wall segment instead of one
    // "fully inside = invisible" disc.
    if(
      v.team===u.team||
      (v.hp<=0&&!v.critical)
    )
      continue;

    // Concealed units (tucked in trees) are only spottable at
    // much closer range — a marksman in a ghillie suit is even
    // harder to spot than one without. Laser Sights is the
    // opposite trade: the glint makes them noticeable from much
    // farther away.
    const effRange=
      isConcealed(v)?
      Math.min(
        bd,
        v.laserSights?230:(v.ghillie?90:150)
      ):
      bd;

    const rawD=Math.hypot(u.x-v.x,u.y-v.y);

    // A smarter commander doesn't just shoot the nearest body —
    // support and command roles are worth closing extra distance
    // for, so treat them as if they were closer than they are.
    const d=
      preferValue&&HIGH_VALUE_TYPES.includes(v.type)?
      Math.max(0,rawD-70):
      rawD;

    if(d<effRange){

      // Buildings AND tree lines block sight the same way they
      // block bullets — units can't see (or shoot) through them.
      // A Laser-Sighted shooter's view isn't blocked by ruins.
      if(sightBlocked(u.x,u.y,v.x,v.y,u.laserSights))
        continue;

      bd=d;
      best=v;
    }
  }

  for(const s of structures){

    if(s.team===u.team)
      continue;

    if(s.kind==="trench"||s.kind==="wall"||s.kind==="building")
      continue;

    const d=Math.hypot(u.x-s.x,u.y-s.y);

    if(d<bd){
      bd=d;
      best=s;
    }
  }

  // Resupply choppers are valid targets too — flying above the
  // treeline and buildings, so nothing blocks line of sight to
  // them the way it would a unit on the ground.
  for(const c of choppers){

    if(c.team===u.team)
      continue;

    const d=Math.hypot(u.x-c.x,u.y-c.y);

    if(d<bd){
      bd=d;
      best=c;
    }
  }

  return best;
}


function nearestEnemyDrone(u,range=Infinity){

  // A live kamikaze drone rushing toward your side is a real
  // threat worth shooting at on sight, not just something that
  // occasionally eats a stray bullet meant for someone else.
  let best=null;
  let bd=range;

  for(const d of kamikazeDrones){

    if(d.team===u.team)
      continue;

    const dist=Math.hypot(u.x-d.x,u.y-d.y);

    if(dist<bd){
      bd=dist;
      best=d;
    }
  }

  return best;
}


/* =========================================================
   AI
========================================================= */

function chooseObjective(team){

  let best=null;
  let score=-Infinity;

  const focus=teams[team].focus;

  for(const f of flags){

    let s=0;

    if(f.team!==team)
      s+=300;

    s-=Math.abs(
      f.x-(team===BLUE?0:W)
    )*.08;

    if(f.team===team)
      s+=80;

    // The commander's current radioed focus nudges which flag
    // looks most worth committing to this pass.
    if(focus==="rush"&&f.team!==team)
      s+=Math.abs(f.x-(team===BLUE?0:W))*.05;

    if(focus==="defend"&&f.team===team)
      s+=140;

    if(focus==="hold"&&f.team===team)
      s+=90;

    s+=rand()*60;

    if(s>score){
      score=s;
      best=f;
    }
  }

  return best;
}


function findBase(team){

  return structures.find(
    s=>s.team===team&&s.kind==="HQ"
  );
}


function nearestSupplyDepot(team,x,y){

  // Any of the team's own solid structures count as a depot for
  // an empty Supplier to instantly refill at — a depot has
  // effectively unlimited logistics, unlike a field handoff
  // between two soldiers.
  let best=null;
  let bestD=Infinity;

  for(const s of structures){

    if(s.team!==team)
      continue;

    if(
      s.kind!=="HQ"&&
      s.kind!=="barracks"&&
      s.kind!=="bunker"
    )
      continue;

    const d=Math.hypot(s.x-x,s.y-y);

    if(d<bestD){
      bestD=d;
      best=s;
    }
  }

  return best;
}


function isSafeSpot(u){

  // Replaces the old ruin-specific isSheltered(). There's no more
  // binary "inside = fully unhittable" flag — shelter behind a
  // building's walls now falls naturally out of correct
  // per-segment line of sight instead. "Safe" here just means:
  // near the team's own base, or not currently visible to any
  // living enemy (which a wall, or just being out of anyone's
  // sightline, both satisfy on their own).
  const base=findBase(u.team);

  if(base&&Math.hypot(u.x-base.x,u.y-base.y)<120)
    return true;

  for(const v of units){

    if(v.team===u.team||v.hp<=0)
      continue;

    if(Math.hypot(u.x-v.x,u.y-v.y)>900)
      continue;

    if(hasLineOfSight(u,v))
      return false;
  }

  return true;
}


function nearestSafePoint(team,x,y,includeSuppliers=false){

  // Whichever is closer: the team's own base, or the nearest
  // single-room building — used both by retreating units and by
  // anyone dragging a critical-failure casualty back to safety.
  // When the retreat trigger is empty ammo rather than low HP,
  // includeSuppliers also throws the nearest living Supplier into
  // the running, since that's the actual fix for the problem.
  const base=findBase(team);

  let best=null;

  if(base){

    const p=nearestDoorPoint(base,x,y);

    best={x:p.x,y:p.y,d:Math.hypot(p.x-x,p.y-y)};
  }

  for(const s of structures){

    if(s.kind!=="building")
      continue;

    const d=Math.hypot(s.x-x,s.y-y);

    if(!best||d<best.d)
      best={x:s.x,y:s.y,d};
  }

  if(includeSuppliers){

    for(const v of units){

      if(
        v.type!=="supplier"||
        v.team!==team||
        v.hp<=0||
        v.critical
      )
        continue;

      const d=Math.hypot(v.x-x,v.y-y);

      if(!best||d<best.d)
        best={x:v.x,y:v.y,d};
    }
  }

  return best?{x:best.x,y:best.y}:null;
}


function enterCriticalFailure(v){

  // Instead of dying outright, a unit reduced to 0 HP goes down
  // but stays on the field — incapacitated, unable to fight or
  // move on its own, until a medic revives them, an ally drags
  // them to safety, or the bleed-out timer runs out.
  v.critical=true;
  v.criticalTimer=22;
  v.hp=0;
  v.goal=null;
  v.target=null;
  v.retreat=false;
  v.dragging=null;
}


function damageUnit(v,amount,source){

  // The single entry point for all damage dealt to a `units`
  // array member, so Critical Failure is handled consistently
  // everywhere (direct hits, explosions, mines) instead of each
  // damage site needing its own logic.
  if(v.hp<=0){

    // Already down. Any further damage while critical finishes
    // them off for real — no more chances.
    if(v.critical)
      v.criticalTimer=0;

    return;
  }

  // Laser Sights trades stealth for reach and penetration, but
  // the glint gives them away and the recoil off a spotted shot
  // rattles them — a brief stun every time they're hit.
  if(v.laserSights){
    v.stunned=1;
    v.goal=null;
    v.target=null;
  }

  v.hp-=amount;

  if(v.hp<=0){

    enterCriticalFailure(v);

    if(source){
      source.kills++;
      teams[source.team].totalKills++;
    }
  }
}


function findCover(u){

  let best=null;
  let score=-Infinity;

  for(const s of structures){

    if(
      s.team!==u.team||
      (s.kind!=="trench"&&
       s.kind!=="bunker")
    )
      continue;

    const d=Math.hypot(u.x-s.x,u.y-s.y);

    if(d>300)
      continue;

    const scoreHere=300-d;

    if(scoreHere>score){
      score=scoreHere;
      best=s;
    }
  }

  return best;
}


function nearbyLeader(u,radius=190){

  for(const v of units){

    if(
      v.team===u.team&&
      v.type==="leader"&&
      v.hp>0&&
      Math.hypot(u.x-v.x,u.y-v.y)<radius
    )
      return v;
  }

  return null;
}


// Leader-follow tuning. Deliberately a smaller, separate radius
// from the 190px morale/damage aura above — reusing that radius
// for the follow trigger would turn "following" into "basically
// the whole team" any time units happen to cluster near the
// leader for an unrelated reason (e.g. converging on the same
// flag).
const LEADER_FOLLOW_RADIUS=130;
const LEADER_FOLLOW_DWELL=2;
const LEADER_RUSH_FOLLOWER_THRESHOLD=7;

// Hard cap on the escort — without one, the whole team can end up
// clumped on the leader with nobody left to hold flags or press
// anywhere else. Once this many are already following, anyone
// else who crosses the dwell threshold just falls through to
// their normal role goal instead of joining the pile.
const LEADER_FOLLOW_CAP=10;


function countLeaderFollowers(leaderUnit,exclude=null){

  let n=0;

  for(const v of units){

    if(
      v!==exclude&&
      v.hp>0&&
      v.followingLeader===leaderUnit
    )
      n++;
  }

  return n;
}


// Melee tuning — point-blank engage range, distinct from any
// unit's normal ranged `range` stat.
const MELEE_ENGAGE_RANGE=45;

// 25% miss chance, and a miss costs an extra .1s on top of the
// normal stab-rate cooldown — a deliberate double penalty, not
// just a coin-flip on damage.
const MELEE_MISS_CHANCE=.25;
const MELEE_MISS_PENALTY=.1;
const MELEE_DAMAGE=45;

// How long a "just got stabbed" flag stays armed — if the victim
// starts retreating within this window, bleeding kicks in (see
// updateBleeding()). Doesn't have to be the literal same tick as
// the hit.
const RECENTLY_STABBED_WINDOW=3;


function isMeleeEligible(u){

  // Same roster the out-of-ammo placeholder already used: rifleman
  // and grenadier always (rusher/capturer by ROLE_BY_TYPE), a
  // Leader only while its current dynamic behavior is actively
  // rushing — same check chooseLeaderGoal()'s rush branch uses,
  // not its static "defender" role tag. Vehicle never gets melee,
  // even though it's technically a rusher too.
  if(u.type==="vehicle")
    return false;

  if(u.type==="leader"){

    return (
      teams[u.team].focus==="rush"&&
      countLeaderFollowers(u)>=LEADER_RUSH_FOLLOWER_THRESHOLD
    );
  }

  return u.role==="capturer"||u.role==="rusher";
}


function resolveMeleeAttack(u,target){

  if(u.meleeCd>0)
    return;

  const stabRate=TYPES[u.type].stabRate||1.5;

  if(rand()<MELEE_MISS_CHANCE){

    // Wastes the attempt AND costs extra time on top of the
    // normal stab-rate cooldown.
    u.meleeCd=stabRate+MELEE_MISS_PENALTY;
    return;
  }

  damageUnit(target,MELEE_DAMAGE,u);

  target.recentlyStabbedTimer=RECENTLY_STABBED_WINDOW;

  u.meleeCd=stabRate;
}


function updateBleeding(dt){

  // Deliberately separate from damageUnit() — bleeding can never
  // be the direct cause of a unit going down, only get it close.
  // Every other damage source routes through damageUnit(), which
  // always triggers Critical Failure the instant HP crosses 0
  // with no exceptions, so bleed can't reuse it as-is.
  for(const u of units){

    if(!u.bleeding)
      continue;

    if(u.hp<=0||u.critical){
      u.bleeding=false;
      continue;
    }

    u.bleedTickTimer-=dt;

    if(u.bleedTickTimer<=0){

      u.bleedTickTimer+=.5;

      // Hard floor — withhold the tick entirely rather than
      // applying partial damage and letting a normal 0-HP check
      // fire from here.
      if(u.hp-1<=0){
        u.bleeding=false;
        continue;
      }

      u.hp-=1;
    }

    u.bleedTimeLeft-=dt;

    if(u.bleedTimeLeft<=0){
      u.bleeding=false;
    }
  }
}


function updateLeaderFollowDwell(dt){

  // If a team's radioed focus changed, following ends immediately
  // for everyone on that team — a fresh order supersedes whatever
  // the escort was doing, rather than them instantly re-latching
  // onto the leader once dwell time is already banked.
  for(const team of [BLUE,RED]){

    if(teams[team].focus!==teams[team].followFocus){

      teams[team].followFocus=teams[team].focus;

      for(const v of units){

        if(v.team===team){
          v.leaderDwell=0;
          v.dwellLeader=null;
        }
      }
    }
  }

  // Per-unit dwell timer — increments continuously while within
  // the follow radius of the same leader, and resets the instant
  // that isn't true (not a chance roll).
  for(const v of units){

    if(v.type==="leader")
      continue;

    const near=nearbyLeader(v,LEADER_FOLLOW_RADIUS);

    if(near){

      v.leaderDwell=
        v.dwellLeader===near?
        v.leaderDwell+dt:
        dt;

      v.dwellLeader=near;

    }else{

      v.leaderDwell=0;
      v.dwellLeader=null;
    }
  }
}


function assessThreat(u,radius){

  // How many enemies are pressing this unit right now —
  // feeds the retreat/hold-ground decision below.
  let count=0;

  for(const v of units){

    if(
      v.team!==u.team&&
      v.hp>0&&
      Math.hypot(u.x-v.x,u.y-v.y)<radius
    )
      count++;
  }

  return count;
}


function updateUnitAI(u,dt){

  // Down and out — a Critical Failure unit can't act on its own
  // at all. It just lies there until a medic revives it, an ally
  // drags it to safety, or its bleed-out timer runs out (all
  // handled centrally by updateRescues()).
  if(u.critical)
    return;

  // Committed to dragging a casualty to safety — updateRescues()
  // drives this unit's goal directly each tick, so normal combat/
  // objective AI is suspended (defenseless while on rescue duty).
  if(u.dragging)
    return;

  // Piloting a kamikaze drone — see the engineer build logic and
  // updateDroneOperators(). Frozen in place, but still a fully
  // valid, targetable body standing on the field.
  if(u.frozenByDrone)
    return;

  // Laser Sights punishes getting shot at with a brief stun.
  if(u.stunned>0)
    return;

  u.aiTimer-=dt;

  if(u.aiTimer>0)
    return;

  // AI thinks only a few times per second.
  u.aiTimer=.15+rand()*.18;

  const t=TYPES[u.type];

  // Laser Sights extends a marksman's effective engagement range
  // before the shot loses its edge.
  const engageRange=
    u.laserSights?t.range*1.35:t.range;

  const threat=assessThreat(u,t.range*1.1);
  const outnumbered=threat>=3;

  // Morale drifts: pinned-down or outnumbered units get shaky,
  // quiet moments and nearby leaders steady them back up.
  const leader=nearbyLeader(u);

  if(outnumbered)
    u.morale-=dt*.12;
  else if(leader)
    u.morale+=dt*.18;
  else
    u.morale+=dt*.05;

  u.morale=clamp(u.morale,.15,1);

  // Bravery varies by role: medics/engineers break sooner,
  // leaders and riflemen hold on longer. Low morale lowers
  // the hp% at which a unit is still willing to fight.
  const bravery=
    u.type==="leader"?.14:
    u.type==="rifleman"?.20:
    u.type==="medic"?.30:
    u.type==="engineer"?.28:
    .22;

  const wasRetreating=u.retreat;

  const breakPoint=
    t.hp*(bravery+(1-u.morale)*.18);

  if(u.hp<breakPoint){
    u.retreat=true;
  }

  // Completely out of ammo (magazine AND reserve both empty).
  // Support/defense roles always fall back toward help — a medic,
  // comms, engineer, supplier, mg, or a leader that isn't
  // currently in an active rush all retreat the same way a
  // badly-wounded unit does. Capturers and rushers (rifleman,
  // grenadier — but never a vehicle, which has no infantry melee
  // option) get an alternative: fighting on empty-handed instead
  // of falling back — meleeFallback just flags that; the actual
  // engagement is resolved by the close-quarters melee block
  // below (isMeleeEligible() is the same check both triggers use).
  if(isOutOfAmmo(u)){

    if(isMeleeEligible(u)){

      // Doesn't override an already-active retreat (e.g. a unit
      // that's both badly wounded AND dry still falls back —
      // melee is only the "otherwise fine, just out of bullets"
      // case).
      if(!u.retreat)
        u.meleeFallback=true;

    }else{

      u.retreat=true;
      u.meleeFallback=false;
    }

  }else{

    u.meleeFallback=false;
  }

  // Close-quarters melee — independent of ammo. An eligible unit
  // (rifleman/grenadier always, a Leader only while actively
  // rushing, never a vehicle) swaps to melee the instant a living
  // enemy is within point-blank range, even with a full magazine.
  // An out-of-ammo eligible unit with nothing close enough yet
  // (meleeFallback) closes the distance toward the nearest enemy
  // instead of just standing idle with nothing to do.
  if(u.meleeFallback||isMeleeEligible(u)){

    if(!u.retreat){

      const closeEnemy=nearestEnemy(u,MELEE_ENGAGE_RANGE,false);

      if(closeEnemy||u.meleeFallback){

        u.order="melee";

        if(closeEnemy){

          resolveMeleeAttack(u,closeEnemy);
          u.goal=null;

        }else{

          const anyEnemy=nearestEnemy(u,engageRange*1.25,false);

          u.goal=anyEnemy?{x:anyEnemy.x,y:anyEnemy.y}:null;
        }

        return;
      }
    }
  }

  const enemy=nearestEnemy(
    u,
    engageRange*1.25,
    true
  );

  if(u.retreat){

    // Whichever's closer — the team's own base, a nearby
    // building, or (only when ammo is actually the problem) the
    // nearest Supplier — units shelter at whichever fits the
    // reason they're retreating.
    const dest=nearestSafePoint(
      u.team,
      u.x,
      u.y,
      isOutOfAmmo(u)
    );

    if(dest){

      u.goal=dest;
      u.order="retreat";
    }

    // Bleed kicks in only on the tick retreat actually starts
    // (not every tick it's already retreating) while the
    // recently-stabbed flag is still armed.
    if(
      !wasRetreating&&
      u.retreat&&
      u.recentlyStabbedTimer>0&&
      !u.bleeding
    ){
      u.bleeding=true;
      u.bleedTimeLeft=6;
      u.bleedTickTimer=.5;
    }

    if(dest&&isSafeSpot(u)){

      u.hp=Math.min(
        u.maxhp,
        u.hp+2
      );

      u.morale=Math.min(1,u.morale+dt*.4);

      // Reaching a safe point and being healed stops bleeding
      // early — same recovery trigger the ordinary HP-retreat
      // healing above already uses, no separate path needed.
      u.bleeding=false;

      if(
        u.hp>u.maxhp*.6&&
        u.morale>.55&&
        !isOutOfAmmo(u)
      )
        u.retreat=false;
    }

    return;
  }

  // Medic behavior — prioritizes Critical Failure casualties
  // above everything, then leaders, then the most wounded ally
  // in range rather than just the closest body.
  if(u.type==="medic"){

    let wounded=null;
    let bestScore=-Infinity;

    for(const v of units){

      if(
        v.team===u.team&&
        v!==u&&
        (v.critical||v.hp<v.maxhp*.65)
      ){

        const d=Math.hypot(
          u.x-v.x,
          u.y-v.y
        );

        let score=
          (1-v.hp/v.maxhp)*140-
          d*.12;

        if(v.type==="leader")
          score+=60;

        // Critical Failure always wins — a downed teammate
        // outranks every other consideration.
        if(v.critical)
          score+=1000;

        if(score>bestScore){
          bestScore=score;
          wounded=v;
        }
      }
    }

    if(wounded){

      const bd=Math.hypot(
        u.x-wounded.x,
        u.y-wounded.y
      );

      if(bd<70){

        if(wounded.critical){

          // Close enough to work — hold position and let
          // updateRescues() run the actual timed revive (3-7s
          // depending on how long they've already been down)
          // each frame, rather than an instant fix here.
          u.goal=null;

        }else{

          wounded.hp=Math.min(
            wounded.maxhp,
            wounded.hp+5
          );

          // A medic's care stops the bleeding, same idea as
          // reaching a safe point on your own already does.
          wounded.bleeding=false;
        }

      }else{

        u.goal={
          x:wounded.x,
          y:wounded.y
        };
      }

      return;
    }
  }

  // Supplier — carries a large field ammo pack and resupplies
  // allies over time (see updateSupplyDeliveries(), which does
  // the actual timed transfer once it's holding position next to
  // someone). Running dry takes priority over everything else: it
  // breaks off immediately and heads for the nearest depot, where
  // refueling is instant — a depot has effectively unlimited
  // logistics, a field handoff between two soldiers doesn't.
  if(u.type==="supplier"){

    if(u.ammoPack<=0){

      const depot=nearestSupplyDepot(u.team,u.x,u.y);

      if(depot){

        if(Math.hypot(u.x-depot.x,u.y-depot.y)<depot.r+20){

          u.ammoPack=1000;

        }else{

          u.goal={x:depot.x,y:depot.y};
          u.order="resupplying";
          return;
        }
      }
    }

    if(u.ammoPack>0){

      // Pick up a waiting upgrade if empty-handed and one's
      // queued for this team.
      if(!u.carryingUpgrade&&teams[u.team].pendingUpgrades.length){
        u.carryingUpgrade=teams[u.team].pendingUpgrades.shift();
      }
    }

    // Carrying an upgrade is a specific, time-sensitive mission —
    // it takes priority over routine ammo runs. Ghillie Suit and
    // Laser Sights are both marksman-only and mutually exclusive
    // with each other, same eligibility rule as before, just
    // delivered instead of instantly auto-applied.
    if(u.carryingUpgrade){

      let target=null;
      let bestD=Infinity;

      for(const v of units){

        if(
          v.team!==u.team||
          v.hp<=0||
          v.critical||
          v.type!=="marksman"||
          v.ghillie||
          v.laserSights
        )
          continue;

        const d=Math.hypot(u.x-v.x,u.y-v.y);

        if(d<bestD){
          bestD=d;
          target=v;
        }
      }

      if(target){

        const bd=Math.hypot(u.x-target.x,u.y-target.y);

        if(bd<40){

          if(u.carryingUpgrade==="ghillie")
            target.ghillie=true;
          else if(u.carryingUpgrade==="laserSights")
            target.laserSights=true;

          addChat(u.team,"Upgrade delivered.");

          u.carryingUpgrade=null;
          u.goal=null;

        }else{

          u.goal={x:target.x,y:target.y};
        }

        u.order="delivering";
        return;
      }

      // Nobody eligible exists right now (no marksmen at all, or
      // they're all already kitted out) — hang onto it and fall
      // through to normal ammo duty below; it'll keep checking
      // every tick for a marksman to hand it to.
    }

    if(u.ammoPack>0){

      let neediest=null;
      let bestScore=-Infinity;

      for(const v of units){

        if(
          v===u||
          v.team!==u.team||
          v.hp<=0||
          v.critical||
          v.reserve>=TYPES[v.type].reserveSize
        )
          continue;

        const d=Math.hypot(u.x-v.x,u.y-v.y);

        if(d>600)
          continue;

        const deficit=TYPES[v.type].reserveSize-v.reserve;
        const score=deficit-d*.2;

        if(score>bestScore){
          bestScore=score;
          neediest=v;
        }
      }

      if(neediest){

        const bd=Math.hypot(u.x-neediest.x,u.y-neediest.y);

        if(bd<SUPPLIER_RESUPPLY_RANGE){

          // Close enough to work — hold position and let
          // updateSupplyDeliveries() run the actual timed
          // transfer each frame.
          u.goal=null;

        }else{

          u.goal={x:neediest.x,y:neediest.y};
        }

        u.order="resupplying";
        return;
      }
    }
  }

  // Drone defense — a kamikaze drone closing in is a real,
  // urgent threat, so any unit that spots one in range engages
  // it directly instead of only ever downing one by accident
  // with fire meant for a human target.
  const threatDrone=nearestEnemyDrone(u,t.range*1.15);

  if(
    threatDrone&&
    hasLineOfSight(u,threatDrone)
  ){

    u.target=threatDrone;
    shoot(u,threatDrone,leader?1.35:1);

    if(
      Math.hypot(u.x-threatDrone.x,u.y-threatDrone.y)>
      t.range*.6
    ){
      u.goal={x:threatDrone.x,y:threatDrone.y};
    }else{
      u.goal=null;
    }

    return;
  }

  // Combat
  if(enemy){

    u.target=enemy;

    const dEnemy=Math.hypot(
      u.x-enemy.x,
      u.y-enemy.y
    );

    if(dEnemy<=engageRange){

      const bonus=leader?1.35:1;

      // No extra "can I actually fire out" check needed here —
      // nearestEnemy() already validated line of sight (per wall
      // segment, for anyone inside a building) when it picked
      // `enemy` in the first place.
      shoot(u,enemy,bonus);

      // Ranged specialists hold position and kite; everyone
      // else keeps pressing unless already at close quarters.
      const kiter=
        u.type==="mg"||
        u.role==="sniper";

      if(kiter){

        // Back off a step if the enemy has closed in too far,
        // otherwise hold the firing line.
        if(dEnemy<engageRange*.45){

          const a=Math.atan2(
            u.y-enemy.y,
            u.x-enemy.x
          );

          u.goal={
            x:u.x+Math.cos(a)*90,
            y:u.y+Math.sin(a)*90
          };

        }else{
          u.goal=null;
        }

        return;
      }

      // Close-quarters types press in a little rather than
      // standing dead still while trading shots.
      if(dEnemy>engageRange*.55){

        u.goal={
          x:enemy.x,
          y:enemy.y
        };
      }else{
        u.goal=null;
      }

      return;

    }else{

      // Approach with a lateral flank offset so a squad
      // spreads out around the target instead of forming
      // a single file into its guns.
      const a=Math.atan2(
        enemy.y-u.y,
        enemy.x-u.x
      )+Math.PI/2;

      const flankDist=
        outnumbered?0:
        70+Math.abs(u.flankBias)*90;

      u.goal={
        x:enemy.x+Math.cos(a)*flankDist*Math.sign(u.flankBias||1),
        y:enemy.y+Math.sin(a)*flankDist*Math.sign(u.flankBias||1)
      };

      u.order="attack";
      return;
    }
  }

  // Indirect fire — mortar's whole identity per the manual. We
  // only get here when `enemy` above came up empty, which (thanks
  // to nearestEnemy()'s sightBlocked() check) specifically means
  // "nothing visible," not "nobody around." If there's a living
  // enemy anywhere in range, lob a blind shell at wherever the
  // enemy is currently clustered thickest (the same grid-binning
  // findDenseEnemyPoint() the airstrike call-in uses) instead of
  // just sitting idle behind the treeline. This is an accuracy
  // trade, not omniscience — a random scatter (scaling with
  // distance, so blind shots at max range are genuinely riskier
  // than close ones) is applied before resolving the blast as a
  // direct point-in-space detonation, the same pattern mines and
  // airstrikes already use, rather than a traveling bullet — so
  // it never has to (and never does) fly through a building wall
  // to land. Buildings stay real shelter either way: this can hit
  // an unseen area, but never lands a clean, precise hit on a
  // specific hidden unit.
  if(
    u.type==="mortar"&&
    anyLivingEnemyInRange(u,engageRange)
  ){

    u.goal=null;

    if(u.cd<=0){

      const aim=findDenseEnemyPoint(u.team);

      if(aim&&tryConsumeAmmo(u)){

        const bonus=leader?1.35:1;
        const dist=Math.hypot(aim.x-u.x,aim.y-u.y);

        // Scatter scales with distance: at max range (560) a
        // high roll can push the impact well outside the 110px
        // blast radius (a real miss), while a typical roll still
        // lands solidly inside it. At short range the same
        // formula keeps shots tight and reliable.
        const scatterAngle=rand()*Math.PI*2;
        const scatterDist=rand()*dist*.28;

        const ix=aim.x+Math.cos(scatterAngle)*scatterDist;
        const iy=aim.y+Math.sin(scatterAngle)*scatterDist;

        u.cd=t.rate/bonus;

        const blastR=110;

        for(const v of units){

          if(
            v.team===u.team||
            (v.hp<=0&&!v.critical)
          )
            continue;

          const bd=Math.hypot(v.x-ix,v.y-iy);

          if(bd<blastR){

            const falloff=Math.max(0,1-bd/blastR);

            damageUnit(
              v,
              t.damage*falloff,
              u
            );
          }
        }

        spawnParticles(ix,iy,"#ffb347",10);
        spawnParticles(ix,iy,"#ff5a3d",6);
        spawnBlastRing(ix,iy,blastR,"#ff9a4d");
      }
    }

    return;
  }

  // Leader-follow: a unit that's built up enough continuous
  // dwell time near a living leader has its destination driven
  // by the leader instead of its own role goal, matching the
  // leader's speed for as long as that lasts. Retreat, medic
  // duty, drone defense, and active combat above all already
  // returned before reaching here — that ordering is exactly
  // what makes those states take priority over following. Capped
  // at LEADER_FOLLOW_CAP so the escort doesn't grow into "the
  // whole team clumped on the leader" — past the cap, a unit that
  // would otherwise qualify just falls through to its normal role
  // goal below instead.
  if(
    u.type!=="leader"&&
    u.leaderDwell>=LEADER_FOLLOW_DWELL&&
    u.dwellLeader&&
    u.dwellLeader.hp>0&&
    !u.dwellLeader.critical&&
    countLeaderFollowers(u.dwellLeader,u)<LEADER_FOLLOW_CAP
  ){

    const lead=u.dwellLeader;

    u.goal={
      x:lead.x+(rand()-.5)*90,
      y:lead.y+(rand()-.5)*90
    };

    u.order="following";
    u.followingLeader=lead;
    u.speedOverride=TYPES.leader.speed;

    return;

  }else{

    u.followingLeader=null;
    u.speedOverride=null;
  }

  // Defenders and snipers lean on cover more than the rest. The
  // leader has its own dedicated movement logic (chooseLeaderGoal)
  // and skips this generic roll even though it's still tagged
  // "defender" in ROLE_BY_TYPE.
  if(
    (u.role==="defender"||
     u.role==="sniper") &&
    u.type!=="leader"&&
    rand()<.4
  ){

    const cover=findCover(u);

    if(cover){

      u.goal={
        x:cover.x+(rand()-.5)*30,
        y:cover.y+(rand()-.5)*30
      };

      return;
    }
  }

  // With no enemy in sight, infantry occasionally stop to dig a
  // foxhole for cover.
  if(
    INFANTRY_TYPES.includes(u.type)&&
    rand()<.006
  ){
    digFieldTrench(u.team,u.x,u.y);
  }

  const goal=chooseRoleGoal(u);

  if(goal){

    u.goal=goal;
    u.order="advance";
  }
}


/* =========================================================
   LEADER MOVEMENT
   The leader ignores its assigned "defender" role for actual
   movement decisions (kept only for the incidental cover-seeking
   and combat-stance code that reads u.role generically) and
   instead reacts to the team's current radioed focus. See the
   Leader Unit Rehaul spec.
========================================================= */

function leaderAvoidConflictGoal(u){

  // "Avoid conflict but stay close to combat" — reuses the
  // sniper role's hang-back pattern verbatim: a point well short
  // of the objective, near cover, rather than sitting on the
  // flag itself or retreating all the way to base. The leader
  // still fights back if something closes to engagement range
  // (that's handled generically, earlier in updateUnitAI) — this
  // just governs where it goes when nothing's already shooting
  // at it.
  const objective=chooseObjective(u.team);

  if(objective){

    return {
      x:u.x+(objective.x-u.x)*.22+(rand()-.5)*140,
      y:u.y+(objective.y-u.y)*.22+(rand()-.5)*220
    };
  }

  const cover=findCover(u);

  if(cover){

    return {
      x:cover.x+(rand()-.5)*50,
      y:cover.y+(rand()-.5)*50
    };
  }

  return null;
}


function chooseLeaderGoal(u){

  const focus=teams[u.team].focus;

  if(focus==="rush"){

    // Only commits to a rush once it's actually built up an
    // escort — otherwise it's just a high-value target running
    // out alone. Below the threshold, build up followers near
    // the fighting instead of sitting idle at base.
    if(countLeaderFollowers(u)<LEADER_RUSH_FOLLOWER_THRESHOLD)
      return leaderAvoidConflictGoal(u);

    // Bee-line for whichever is closer — the nearest flag or
    // the nearest enemy unit — straight pursuit, not the
    // weighted chooseObjective() scoring a capturer uses.
    let bestFlag=null;
    let bestFlagD=Infinity;

    for(const f of flags){

      const d=Math.hypot(u.x-f.x,u.y-f.y);

      if(d<bestFlagD){
        bestFlagD=d;
        bestFlag=f;
      }
    }

    let bestEnemy=null;
    let bestEnemyD=Infinity;

    for(const v of units){

      if(v.team===u.team||v.hp<=0)
        continue;

      const d=Math.hypot(u.x-v.x,u.y-v.y);

      if(d<bestEnemyD){
        bestEnemyD=d;
        bestEnemy=v;
      }
    }

    if(bestFlag&&(!bestEnemy||bestFlagD<=bestEnemyD))
      return {x:bestFlag.x,y:bestFlag.y};

    if(bestEnemy)
      return {x:bestEnemy.x,y:bestEnemy.y};

    return null;
  }

  if(focus==="defend"||focus==="hold"){

    // Camp at the nearest point of value — an owned flag or a
    // barracks, whichever is closer. Close to the leader's old
    // default "defender" behavior.
    let best=null;
    let bestD=Infinity;

    for(const f of flags){

      if(f.team!==u.team)
        continue;

      const d=Math.hypot(u.x-f.x,u.y-f.y);

      if(d<bestD){
        bestD=d;
        best={x:f.x,y:f.y};
      }
    }

    for(const s of structures){

      if(s.team!==u.team||s.kind!=="barracks")
        continue;

      const d=Math.hypot(u.x-s.x,u.y-s.y);

      if(d<bestD){
        bestD=d;
        best={x:s.x,y:s.y};
      }
    }

    if(best){

      return {
        x:best.x+(rand()-.5)*70,
        y:best.y+(rand()-.5)*70
      };
    }

    // Nothing owned yet — fall back to guarding the base rather
    // than advancing, same as the old defender behavior.
    const ownHQ=findBase(u.team);

    if(ownHQ){

      return {
        x:ownHQ.x+(rand()-.5)*260,
        y:ownHQ.y+(rand()-.5)*360
      };
    }

    return null;
  }

  // flank, resupply, balanced — avoid conflict, stay close to
  // combat.
  return leaderAvoidConflictGoal(u);
}


/* =========================================================
   ROLE STRATEGIES
   Each unit type is assigned a role in ROLE_BY_TYPE, and picks
   its next destination differently depending on that role — this
   is what stops every unit dogpiling the same flag. Roles can
   nudge their behavior slightly based on what's happening nearby
   (a rusher briefly helping a contested friendly flag, a defender
   falling back if it has nothing to defend yet) but never fully
   switch strategies.
========================================================= */

function chooseRoleGoal(u){

  // The leader doesn't use the generic role-strategy table for
  // movement — see chooseLeaderGoal() and the Leader Unit
  // Rehaul spec. It keeps ROLE_BY_TYPE's "defender" tag only for
  // the generic cover-seeking/combat-stance code elsewhere that
  // reads u.role.
  if(u.type==="leader")
    return chooseLeaderGoal(u);

  const enemyHQ=findBase(u.team===BLUE?RED:BLUE);
  const ownHQ=findBase(u.team);

  if(u.role==="rusher"){

    // Mostly beelines for the enemy HQ. Small, occasional
    // exception: if a flag the team already holds is actively
    // being flipped by the enemy right nearby, peel off to help
    // hold it rather than sail straight past a losing fight.
    const contested=flags.find(
      f=>f.team===u.team&&
         f.progress>1&&
         Math.hypot(u.x-f.x,u.y-f.y)<380
    );

    if(contested&&rand()<.3){

      return {
        x:contested.x+(rand()-.5)*70,
        y:contested.y+(rand()-.5)*70
      };
    }

    if(enemyHQ){

      const spread=u.flankBias*150;

      return {
        x:enemyHQ.x+spread,
        y:enemyHQ.y+(rand()-.5)*280
      };
    }

    return null;
  }

  if(u.role==="defender"){

    // Prefer holding a flag the team already owns — that's the
    // "hold ground" job. If nothing is owned yet, fall back to
    // guarding the trench line / base instead of advancing.
    let best=null;
    let score=-Infinity;

    for(const f of flags){

      if(f.team!==u.team)
        continue;

      const d=Math.hypot(u.x-f.x,u.y-f.y);
      const s=260-d*.05+rand()*40;

      if(s>score){
        score=s;
        best=f;
      }
    }

    if(best){

      return {
        x:best.x+(rand()-.5)*70,
        y:best.y+(rand()-.5)*70
      };
    }

    const cover=findCover(u);

    if(cover){

      return {
        x:cover.x+(rand()-.5)*50,
        y:cover.y+(rand()-.5)*50
      };
    }

    if(ownHQ){

      return {
        x:ownHQ.x+(rand()-.5)*260,
        y:ownHQ.y+(rand()-.5)*360
      };
    }

    return null;
  }

  if(u.role==="sniper"){

    // Hangs back — aims for a point well short of the objective,
    // near cover, rather than sitting on the flag itself. Falls
    // back toward known cover if the front is quiet.
    const objective=chooseObjective(u.team);

    if(objective){

      return {
        x:u.x+(objective.x-u.x)*.22+(rand()-.5)*140,
        y:u.y+(objective.y-u.y)*.22+(rand()-.5)*220
      };
    }

    const cover=findCover(u);

    if(cover){

      return {
        x:cover.x+(rand()-.5)*50,
        y:cover.y+(rand()-.5)*50
      };
    }

    return null;
  }

  // "capturer" (and anything unassigned) — the classic push:
  // chase down and hold whatever flag is most worth taking.
  const objective=chooseObjective(u.team);

  if(objective){

    const spread=u.flankBias*70;

    return {
      x:objective.x+(rand()-.5)*80+spread,
      y:objective.y+(rand()-.5)*80+spread
    };
  }

  // No flags worth chasing yet — drift generally toward the
  // enemy side so the front still moves.
  if(enemyHQ){

    return {
      x:u.x+(enemyHQ.x-u.x)*.1+(rand()-.5)*160,
      y:u.y+(enemyHQ.y-u.y)*.1+(rand()-.5)*220
    };
  }

  return null;
}


/* =========================================================
   MOVEMENT
   Steers around obstacles instead of freezing against them,
   and never leaves a unit perfectly motionless.
========================================================= */

function idleWander(u,dt){

  const t=TYPES[u.type];

  u.wanderTimer-=dt;

  if(u.wanderTimer<=0||!u.wanderGoal){

    u.wanderTimer=.8+rand()*1.6;

    const a=rand()*Math.PI*2;
    const dist=18+rand()*40;

    u.wanderGoal={
      x:u.x+Math.cos(a)*dist,
      y:u.y+Math.sin(a)*dist
    };
  }

  const dx=u.wanderGoal.x-u.x;
  const dy=u.wanderGoal.y-u.y;
  const d=Math.hypot(dx,dy);

  if(d<3)
    return;

  const vx=dx/d;
  const vy=dy/d;

  const nx=u.x+vx*t.speed*.32*dt;
  const ny=u.y+vy*t.speed*.32*dt;

  if(!blocked(nx,ny,t.radius)){
    u.x=nx;
    u.y=ny;
  }else{
    u.wanderGoal=null;
  }
}


function updateFacing(u,dt){

  // Priority: whatever it's actively shooting at, then wherever
  // it's headed, then wherever it's idly wandering — otherwise
  // just keep the last facing rather than snapping around.
  let desired=null;

  if(u.target&&u.target.hp>0){

    desired=Math.atan2(
      u.target.y-u.y,
      u.target.x-u.x
    );

  }else if(u.goal){

    desired=Math.atan2(
      u.goal.y-u.y,
      u.goal.x-u.x
    );

  }else if(u.wanderGoal){

    desired=Math.atan2(
      u.wanderGoal.y-u.y,
      u.wanderGoal.x-u.x
    );
  }

  if(desired===null)
    return;

  let diff=desired-u.facing;

  // normalize to -PI..PI so it always turns the short way
  diff=Math.atan2(Math.sin(diff),Math.cos(diff));

  const maxStep=9*dt;

  if(Math.abs(diff)<=maxStep)
    u.facing=desired;
  else
    u.facing+=Math.sign(diff)*maxStep;
}


function nearOwnFlag(u){

  // A flag boosts the movement speed of allied units near it —
  // a small logistical edge for holding ground, on top of the
  // capture-progress mechanics in updateFlags().
  for(const f of flags){

    if(
      f.team===u.team&&
      Math.hypot(u.x-f.x,u.y-f.y)<95
    )
      return true;
  }

  return false;
}


function moveUnit(u,dt){

  const t=TYPES[u.type];

  // Down and out — stays exactly where it fell unless an ally
  // dragging it moves it (see updateRescues, which adjusts a
  // critical unit's x/y directly rather than through here).
  if(u.critical)
    return;

  updateFacing(u,dt);

  if(!u.goal){

    // Units always fidget/patrol a little rather than
    // standing perfectly still between orders.
    idleWander(u,dt);
    return;
  }

  const dx=u.goal.x-u.x;
  const dy=u.goal.y-u.y;

  const d=Math.hypot(dx,dy);

  if(d<10){

    u.goal=null;
    u.order="idle";
    u.stuck=0;
    u.lastDist=undefined;
    return;
  }

  // Track whether we're actually closing the distance; if not,
  // we're snagged on a trench/wall and need to widen our search
  // for an unblocked heading rather than push straight into it.
  if(u.lastDist!==undefined){

    if(d>u.lastDist-1)
      u.stuck=Math.min(2.5,u.stuck+dt);
    else
      u.stuck=Math.max(0,u.stuck-dt*2.2);
  }

  u.lastDist=d;

  const desiredAngle=Math.atan2(dy,dx);

  // A follower matches its leader's speed instead of its own
  // type's base speed for as long as it's following (see
  // updateUnitAI's leader-follow block).
  const baseSpeed=
    u.speedOverride!=null?
    u.speedOverride:
    t.speed;

  const speed=
    baseSpeed*
    (nearOwnFlag(u)?1.1:1)*
    (u.order==="melee"?1.5:1);

  const step=speed*dt;

  // Candidate headings, tried closest-to-desired first. The
  // search cone widens the longer we've been stuck, so a unit
  // pinned against a trench face gradually slides around its
  // curve instead of vibrating in place.
  const spread=Math.min(Math.PI*.9,.2+u.stuck*1.4);

  const offsets=[
    0,.3,-.3,.55,-.55,
    .85,-.85,1.2,-1.2,
    1.6,-1.6,2.1,-2.1
  ];

  let moved=false;

  for(const off of offsets){

    if(off!==0&&Math.abs(off)>spread)
      continue;

    const a=desiredAngle+off;

    let vx=Math.cos(a);
    let vy=Math.sin(a);

    // Soft separation from nearby friendlies so units don't
    // clump into an impenetrable mass at chokepoints.
    for(const v of units){

      if(v===u||v.hp<=0)
        continue;

      const dd=Math.hypot(u.x-v.x,u.y-v.y);

      if(dd<38){

        const aa=Math.atan2(u.y-v.y,u.x-v.x);

        vx+=Math.cos(aa)*.5;
        vy+=Math.sin(aa)*.5;
      }
    }

    const L=Math.hypot(vx,vy)||1;

    vx/=L;
    vy/=L;

    const nx=u.x+vx*step;
    const ny=u.y+vy*step;

    if(!blocked(nx,ny,t.radius)){

      u.x=nx;
      u.y=ny;
      moved=true;
      break;
    }
  }

  if(!moved){

    // Completely boxed in — escalate stuck time so next tick's
    // search cone is even wider, and jitter the goal a little
    // so the unit doesn't fixate on an unreachable point.
    u.stuck=Math.min(2.5,u.stuck+dt*3);

    if(u.stuck>1.8){

      u.goal={
        x:u.goal.x+(rand()-.5)*140,
        y:u.goal.y+(rand()-.5)*140
      };

      u.stuck=0;
    }
  }
}


/* =========================================================
   SHOOTING
========================================================= */

function isOutOfAmmo(u){

  // True only once BOTH the magazine and the reserve are empty —
  // a unit mid-reload still has ammo coming, so it isn't "out."
  return u.mag<=0&&u.reserve<=0;
}


function tryConsumeAmmo(u){

  // Returns true if a round was actually drawn from the magazine
  // this call. Returns false if the unit can't fire right now —
  // either it's already mid-reload, or the magazine just hit zero
  // and this call is what triggers the reload to start (as long
  // as there's reserve ammo left to pull from).
  if(u.reloading)
    return false;

  if(u.mag<=0){

    if(u.reserve>0){
      u.reloading=true;
      u.reloadTimer=TYPES[u.type].reloadTime;
    }

    return false;
  }

  u.mag--;
  return true;
}


function shoot(u,target,rateBonus=1){

  const t=TYPES[u.type];

  if(u.cd>0)
    return;

  // Reload Time and `rate` stack rather than one replacing the
  // other: `rate` still paces shots within a magazine (the check
  // above), while running dry adds this separate, additional
  // pause on top before the next shot is even possible.
  if(!tryConsumeAmmo(u))
    return;

  u.cd=t.rate/rateBonus;

  spawnParticles(u.x,u.y,"#ffe9a8",1);

  const angle=
    Math.atan2(
      target.y-u.y,
      target.x-u.x
    )+
    (rand()-.5)*
    (u.type==="marksman"?.01:
     u.type==="mortar"?.38:
     .06);

  bullets.push({
    x:u.x,
    y:u.y,

    vx:Math.cos(angle)*600,
    vy:Math.sin(angle)*600,

    damage:t.damage,
    team:u.team,

    life:1.1,
    source:u,

    explosive:
      u.type==="grenadier"||
      u.type==="mortar",

    // Mortars land a real blast that tapers off with distance
    // from the point of impact; grenades keep their old flat
    // splash radius (see updateBullets).
    blastRadius:
      u.type==="mortar"?110:75,

    blastFalloff:
      u.type==="mortar",

    // Laser Sights: a 100% chance to punch straight through a
    // building's walls or an engineer-built barrier instead of
    // being blocked or absorbed (see updateBullets()).
    laserPen:!!u.laserSights
  });
}


/* =========================================================
   STRUCTURE AI
========================================================= */

function pickSpawnType(team){

  // A smarter commander doesn't spawn off a flat random table —
  // it reacts to what the squad is actually missing, how the
  // fight is going, and whatever focus the last radio report
  // called for.
  const mine=units.filter(u=>u.team===team&&u.hp>0);
  const enemyCount=units.filter(u=>u.team!==team&&u.hp>0).length;

  const has=type=>mine.some(u=>u.type===type);
  const countOf=type=>mine.filter(u=>u.type===type).length;

  const weights={
    rifleman:3,
    mg:1,
    medic:1,
    marksman:1,
    grenadier:1,
    engineer:1,
    leader:1,
    comms:1,
    supplier:1
  };

  // No working radio means no resupply calls, no drone requests,
  // and a silent comms panel — worth fixing fast.
  if(!has("comms"))
    weights.comms+=5;

  // Nobody to reload a magazine in the field once it runs dry —
  // just as urgent as getting a radio up.
  if(!has("supplier"))
    weights.supplier+=4;

  if(countOf("medic")<Math.ceil(mine.length*.12))
    weights.medic+=2;

  if(!has("engineer"))
    weights.engineer+=2;

  if(!has("leader")&&mine.length>=4)
    weights.leader+=1.5;

  // Outnumbered — reinforce with cheap, quick bodies rather than
  // more specialists.
  if(mine.length<enemyCount-3){
    weights.rifleman+=2;
    weights.mg+=1;
  }

  const focus=teams[team].focus;

  if(focus==="rush"){
    weights.rifleman+=2;
  }else if(focus==="defend"){
    weights.mg+=2;
    weights.leader+=1;
  }else if(focus==="flank"){
    weights.grenadier+=1.5;
    weights.marksman+=1;
  }

  // Anti-repetition: the more of a type is already on the field,
  // and the more often it's been picked lately, the less likely
  // it gets picked again — and vice versa. Both fade the weight
  // down (never below a small floor, so nothing becomes truly
  // impossible), applied after the situational bonuses above so
  // an urgent need (no comms, no supplier, etc.) still competes
  // fairly rather than being drowned out entirely.
  const recency=teams[team].spawnRecency;

  for(const k in weights){

    const onField=countOf(k);
    const recent=recency[k]||0;

    weights[k]/=(1+onField*.3);
    weights[k]/=(1+recent*.45);
  }

  let total=0;

  for(const k in weights)
    total+=weights[k];

  let r=rand()*total;

  for(const k in weights){

    r-=weights[k];

    if(r<=0){

      recency[k]=(recency[k]||0)+1;

      return k;
    }
  }

  recency.rifleman=(recency.rifleman||0)+1;

  return "rifleman";
}


function buildBattleSummary(team){

  const enemyTeam=team===BLUE?RED:BLUE;

  const mine=units.filter(u=>u.team===team&&u.hp>0);
  const enemy=units.filter(u=>u.team===enemyTeam&&u.hp>0);

  const countBy=list=>{

    const c={};

    for(const u of list)
      c[u.type]=(c[u.type]||0)+1;

    return c;
  };

  return {
    team:teamNames[team],
    resources:Math.round(teams[team].res),
    ownUnits:countBy(mine),
    ownTotal:mine.length,
