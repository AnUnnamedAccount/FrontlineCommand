    // Bee-line for whichever is closer — the nearest flag or
    // the nearest enemy unit — straight pursuit, not the
    // weighted chooseObjective() scoring a capturer uses.
    let bestFlag=null;
    let bestFlagD=Infinity;

    for(const f of flags){

      const d=Math.hypot(u.x-f.x,u.y-f.y);

      if(d<bestFlagD){
        bestFlagD=d;
        bestFlag=f;
      }
    }

    let bestEnemy=null;
    let bestEnemyD=Infinity;

    for(const v of units){

      if(v.team===u.team||v.hp<=0)
        continue;

      const d=Math.hypot(u.x-v.x,u.y-v.y);

      if(d<bestEnemyD){
        bestEnemyD=d;
        bestEnemy=v;
      }
    }

    if(bestFlag&&(!bestEnemy||bestFlagD<=bestEnemyD))
      return {x:bestFlag.x,y:bestFlag.y};

    if(bestEnemy)
      return {x:bestEnemy.x,y:bestEnemy.y};

    return null;
  }

  if(focus==="defend"||focus==="hold"){

    // Camp at the nearest point of value — an owned flag or a
    // barracks, whichever is closer. Close to the leader's old
    // default "defender" behavior.
    let best=null;
    let bestD=Infinity;

    for(const f of flags){

      if(f.team!==u.team)
        continue;

      const d=Math.hypot(u.x-f.x,u.y-f.y);

      if(d<bestD){
        bestD=d;
        best={x:f.x,y:f.y};
      }
    }

    for(const s of structures){

      if(s.team!==u.team||s.kind!=="barracks")
        continue;

      const d=Math.hypot(u.x-s.x,u.y-s.y);

      if(d<bestD){
        bestD=d;
        best={x:s.x,y:s.y};
      }
    }

    if(best){

      return {
        x:best.x+(rand()-.5)*70,
        y:best.y+(rand()-.5)*70
      };
    }

    // Nothing owned yet — fall back to guarding the base rather
    // than advancing, same as the old defender behavior.
    const ownHQ=findBase(u.team);

    if(ownHQ){

      return {
        x:ownHQ.x+(rand()-.5)*260,
        y:ownHQ.y+(rand()-.5)*360
      };
    }

    return null;
  }

  // flank, resupply, balanced — avoid conflict, stay close to
  // combat.
  return leaderAvoidConflictGoal(u);
}


/* =========================================================
   ROLE STRATEGIES
   Each unit type is assigned a role in ROLE_BY_TYPE, and picks
   its next destination differently depending on that role — this
   is what stops every unit dogpiling the same flag. Roles can
   nudge their behavior slightly based on what's happening nearby
   (a rusher briefly helping a contested friendly flag, a defender
   falling back if it has nothing to defend yet) but never fully
   switch strategies.
========================================================= */

function chooseRoleGoal(u){

  // The leader doesn't use the generic role-strategy table for
  // movement — see chooseLeaderGoal() and the Leader Unit
  // Rehaul spec. It keeps ROLE_BY_TYPE's "defender" tag only for
  // the generic cover-seeking/combat-stance code elsewhere that
  // reads u.role.
  if(u.type==="leader")
    return chooseLeaderGoal(u);

  const enemyHQ=findBase(u.team===BLUE?RED:BLUE);
  const ownHQ=findBase(u.team);

  if(u.role==="rusher"){

    // Mostly beelines for the enemy HQ. Small, occasional
    // exception: if a flag the team already holds is actively
    // being flipped by the enemy right nearby, peel off to help
    // hold it rather than sail straight past a losing fight.
    const contested=flags.find(
      f=>f.team===u.team&&
         f.progress>1&&
         Math.hypot(u.x-f.x,u.y-f.y)<380
    );

    if(contested&&rand()<.3){

      return {
        x:contested.x+(rand()-.5)*70,
        y:contested.y+(rand()-.5)*70
      };
    }

    if(enemyHQ){

      const spread=u.flankBias*150;

      return {
        x:enemyHQ.x+spread,
        y:enemyHQ.y+(rand()-.5)*280
      };
    }

    return null;
  }

  if(u.role==="defender"){

    // Prefer holding a flag the team already owns — that's the
    // "hold ground" job. If nothing is owned yet, fall back to
    // guarding the trench line / base instead of advancing.
    let best=null;
    let score=-Infinity;

    for(const f of flags){

      if(f.team!==u.team)
        continue;

      const d=Math.hypot(u.x-f.x,u.y-f.y);
      const s=260-d*.05+rand()*40;

      if(s>score){
        score=s;
        best=f;
      }
    }

    if(best){

      return {
        x:best.x+(rand()-.5)*70,
        y:best.y+(rand()-.5)*70
      };
    }

    const cover=findCover(u);

    if(cover){

      return {
        x:cover.x+(rand()-.5)*50,
        y:cover.y+(rand()-.5)*50
      };
    }

    if(ownHQ){

      return {
        x:ownHQ.x+(rand()-.5)*260,
        y:ownHQ.y+(rand()-.5)*360
      };
    }

    return null;
  }

  if(u.role==="sniper"){

    // Hangs back — aims for a point well short of the objective,
    // near cover, rather than sitting on the flag itself. Falls
    // back toward known cover if the front is quiet.
    const objective=chooseObjective(u.team);

    if(objective){

      return {
        x:u.x+(objective.x-u.x)*.22+(rand()-.5)*140,
        y:u.y+(objective.y-u.y)*.22+(rand()-.5)*220
      };
    }

    const cover=findCover(u);

    if(cover){

      return {
        x:cover.x+(rand()-.5)*50,
        y:cover.y+(rand()-.5)*50
      };
    }

    return null;
  }

  // "capturer" (and anything unassigned) — the classic push:
  // chase down and hold whatever flag is most worth taking.
  const objective=chooseObjective(u.team);

  if(objective){

    const spread=u.flankBias*70;

    return {
      x:objective.x+(rand()-.5)*80+spread,
      y:objective.y+(rand()-.5)*80+spread
    };
  }

  // No flags worth chasing yet — drift generally toward the
  // enemy side so the front still moves.
  if(enemyHQ){

    return {
      x:u.x+(enemyHQ.x-u.x)*.1+(rand()-.5)*160,
      y:u.y+(enemyHQ.y-u.y)*.1+(rand()-.5)*220
    };
  }

  return null;
}


/* =========================================================
   MOVEMENT
   Steers around obstacles instead of freezing against them,
   and never leaves a unit perfectly motionless.
========================================================= */

function idleWander(u,dt){

  const t=TYPES[u.type];

  u.wanderTimer-=dt;

  if(u.wanderTimer<=0||!u.wanderGoal){

    u.wanderTimer=.8+rand()*1.6;

    const a=rand()*Math.PI*2;
    const dist=18+rand()*40;

    u.wanderGoal={
      x:u.x+Math.cos(a)*dist,
      y:u.y+Math.sin(a)*dist
    };
  }

  const dx=u.wanderGoal.x-u.x;
  const dy=u.wanderGoal.y-u.y;
  const d=Math.hypot(dx,dy);

  if(d<3)
    return;

  const vx=dx/d;
  const vy=dy/d;

  const nx=u.x+vx*t.speed*.32*dt;
  const ny=u.y+vy*t.speed*.32*dt;

  if(!blocked(nx,ny,t.radius)){
    u.x=nx;
    u.y=ny;
  }else{
    u.wanderGoal=null;
  }
}


function updateFacing(u,dt){

  // Priority: whatever it's actively shooting at, then wherever
  // it's headed, then wherever it's idly wandering — otherwise
  // just keep the last facing rather than snapping around.
  let desired=null;

  if(u.target&&u.target.hp>0){

    desired=Math.atan2(
      u.target.y-u.y,
      u.target.x-u.x
    );

  }else if(u.goal){

    desired=Math.atan2(
      u.goal.y-u.y,
      u.goal.x-u.x
    );

  }else if(u.wanderGoal){

    desired=Math.atan2(
      u.wanderGoal.y-u.y,
      u.wanderGoal.x-u.x
    );
  }

  if(desired===null)
    return;

  let diff=desired-u.facing;

  // normalize to -PI..PI so it always turns the short way
  diff=Math.atan2(Math.sin(diff),Math.cos(diff));

  const maxStep=9*dt;

  if(Math.abs(diff)<=maxStep)
    u.facing=desired;
  else
    u.facing+=Math.sign(diff)*maxStep;
}


function nearOwnFlag(u){

  // A flag boosts the movement speed of allied units near it —
  // a small logistical edge for holding ground, on top of the
  // capture-progress mechanics in updateFlags().
  for(const f of flags){

    if(
      f.team===u.team&&
      Math.hypot(u.x-f.x,u.y-f.y)<95
    )
      return true;
  }

  return false;
}


function moveUnit(u,dt){

  const t=TYPES[u.type];

  // Down and out — stays exactly where it fell unless an ally
  // dragging it moves it (see updateRescues, which adjusts a
  // critical unit's x/y directly rather than through here).
  if(u.critical)
    return;

  updateFacing(u,dt);

  if(!u.goal){

    // Units always fidget/patrol a little rather than
    // standing perfectly still between orders.
    idleWander(u,dt);
    return;
  }

  const dx=u.goal.x-u.x;
  const dy=u.goal.y-u.y;

  const d=Math.hypot(dx,dy);

  if(d<10){

    u.goal=null;
    u.order="idle";
    u.stuck=0;
    u.lastDist=undefined;
    return;
  }

  // Track whether we're actually closing the distance; if not,
  // we're snagged on a trench/wall and need to widen our search
  // for an unblocked heading rather than push straight into it.
  if(u.lastDist!==undefined){

    if(d>u.lastDist-1)
      u.stuck=Math.min(2.5,u.stuck+dt);
    else
      u.stuck=Math.max(0,u.stuck-dt*2.2);
  }

  u.lastDist=d;

  const desiredAngle=Math.atan2(dy,dx);

  // Speed is resolved in three explicit tiers rather than one
  // more inline ternary stacked on the last — this is the third
  // time a new feature has needed to interact with movement speed
  // (leader-follow override, melee boost, now the flame slow), so
  // structuring it as three lists evaluated in order makes the
  // next one a one-line addition instead of untangling this
  // expression again.
  //
  // 1. Overrides — if any are active, the highest positive one
  //    wins outright and everything else here is discarded.
  const speedOverrides=[];

  if(u.speedOverride!=null)
    speedOverrides.push(u.speedOverride);

  const baseSpeed=
    speedOverrides.length?
    Math.max(...speedOverrides):
    t.speed;

  // 2. Positive multipliers — all active ones multiply together.
  const speedBuffs=[];

  if(nearOwnFlag(u))
    speedBuffs.push(1.1);

  if(u.order==="melee")
    speedBuffs.push(1.5);

  let buffMultiplier=1;

  for(const b of speedBuffs)
    buffMultiplier*=b;

  // 3. Negative de-buffs — all active ones multiply together,
  //    applied last, on top of tiers 1 and 2.
  const speedDebuffs=[];

  if(u.inFlameCone)
    speedDebuffs.push(.85);

  if(inTrench(u))
    speedDebuffs.push(.9);

  let debuffMultiplier=1;

  for(const d of speedDebuffs)
    debuffMultiplier*=d;

  const speed=
    baseSpeed*
    buffMultiplier*
    debuffMultiplier;

  const step=speed*dt;

  // Candidate headings, tried closest-to-desired first. The
  // search cone widens the longer we've been stuck, so a unit
  // pinned against a trench face gradually slides around its
  // curve instead of vibrating in place.
  const spread=Math.min(Math.PI*.9,.2+u.stuck*1.4);

  const offsets=[
    0,.3,-.3,.55,-.55,
    .85,-.85,1.2,-1.2,
    1.6,-1.6,2.1,-2.1
  ];

  let moved=false;

  for(const off of offsets){

    if(off!==0&&Math.abs(off)>spread)
      continue;

    const a=desiredAngle+off;

    let vx=Math.cos(a);
    let vy=Math.sin(a);

    // Soft separation from nearby friendlies so units don't
    // clump into an impenetrable mass at chokepoints.
    for(const v of units){

      if(v===u||v.hp<=0)
        continue;

      const dd=Math.hypot(u.x-v.x,u.y-v.y);

      if(dd<38){

        const aa=Math.atan2(u.y-v.y,u.x-v.x);

        vx+=Math.cos(aa)*.5;
        vy+=Math.sin(aa)*.5;
      }
    }

    const L=Math.hypot(vx,vy)||1;

    vx/=L;
    vy/=L;

    const nx=u.x+vx*step;
    const ny=u.y+vy*step;

    if(!blocked(nx,ny,t.radius)){

      u.x=nx;
      u.y=ny;
      moved=true;
      break;
    }
  }

  if(!moved){

    // Completely boxed in — escalate stuck time so next tick's
    // search cone is even wider, and jitter the goal a little
    // so the unit doesn't fixate on an unreachable point.
    u.stuck=Math.min(2.5,u.stuck+dt*3);

    if(u.stuck>1.8){

      u.goal={
        x:u.goal.x+(rand()-.5)*140,
        y:u.goal.y+(rand()-.5)*140
      };

      u.stuck=0;
    }
  }
}


/* =========================================================
   SHOOTING
========================================================= */

function isOutOfAmmo(u){

  // Flamer has no magazine/reserve at all — its one resource is
  // fuel (see updateFlameEffects()/the fuel-drain block). Treating
  // an empty tank as "out of ammo" here means it automatically
  // gets the exact same retreat/melee branching every other
  // out-of-ammo unit already does, for free.
  if(u.type==="flamer")
    return u.fuel<=0;

  // True only once BOTH the magazine and the reserve are empty —
  // a unit mid-reload still has ammo coming, so it isn't "out."
  return u.mag<=0&&u.reserve<=0;
}


function tryConsumeAmmo(u){

  // Returns true if a round was actually drawn from the magazine
  // this call. Returns false if the unit can't fire right now —
  // either it's already mid-reload, or the magazine just hit zero
  // and this call is what triggers the reload to start (as long
  // as there's reserve ammo left to pull from).
  if(u.reloading)
    return false;

  if(u.mag<=0){

    if(u.reserve>0){
      u.reloading=true;
      u.reloadTimer=TYPES[u.type].reloadTime;
    }

    return false;
  }

  u.mag--;
  return true;
}


function shoot(u,target,rateBonus=1){

  const t=TYPES[u.type];

  // Weaponless units (Scout Drone) never fire at all — a single
  // guard here is simpler and safer than hunting down every call
  // site (combat, drone-defense) that might otherwise try to.
  if(t.damage<=0)
    return;

  if(u.cd>0)
    return;

  // Reload Time and `rate` stack rather than one replacing the
  // other: `rate` still paces shots within a magazine (the check
  // above), while running dry adds this separate, additional
  // pause on top before the next shot is even possible.
  if(!tryConsumeAmmo(u))
    return;

  u.cd=t.rate/rateBonus;

  spawnParticles(u.x,u.y,"#ffe9a8",1);

  const angle=
    Math.atan2(
      target.y-u.y,
      target.x-u.x
    )+
    (rand()-.5)*
    (u.type==="marksman"?.01:
     u.type==="mortar"?.38:
     .06);

  bullets.push({
    x:u.x,
    y:u.y,

    vx:Math.cos(angle)*600,
    vy:Math.sin(angle)*600,

    damage:t.damage,
    team:u.team,

    life:1.1,
    source:u,

    explosive:
      u.type==="grenadier"||
      u.type==="mortar",

    // Mortars land a real blast that tapers off with distance
    // from the point of impact; grenades keep their old flat
    // splash radius (see updateBullets).
    blastRadius:
      u.type==="mortar"?110:75,

    blastFalloff:
      u.type==="mortar",

    // Laser Sights: a 100% chance to punch straight through a
    // building's walls or an engineer-built barrier instead of
    // being blocked or absorbed (see updateBullets()).
    laserPen:!!u.laserSights
  });
}


/* =========================================================
   STRUCTURE AI
========================================================= */

function pickSpawnType(team){

  // A smarter commander doesn't spawn off a flat random table —
  // it reacts to what the squad is actually missing, how the
  // fight is going, and whatever focus the last radio report
  // called for.
  const mine=units.filter(u=>u.team===team&&u.hp>0);
  const enemyCount=units.filter(u=>u.team!==team&&u.hp>0).length;

  const has=type=>mine.some(u=>u.type===type);
  const countOf=type=>mine.filter(u=>u.type===type).length;

  const weights={
    rifleman:3,
    mg:1,
    medic:1,
    marksman:1,
    grenadier:1,
    engineer:1,
    leader:1,
    comms:1,
    supplier:1,
    flamer:1,
    droneOperator:1
  };

  // No working radio means no resupply calls, no drone requests,
  // and a silent comms panel — worth fixing fast.
  if(!has("comms"))
    weights.comms+=5;

  // Nobody to reload a magazine in the field once it runs dry —
  // just as urgent as getting a radio up.
  if(!has("supplier"))
    weights.supplier+=4;

  if(countOf("medic")<Math.ceil(mine.length*.12))
    weights.medic+=2;

  if(!has("engineer"))
    weights.engineer+=2;

  if(!has("leader")&&mine.length>=4)
    weights.leader+=1.5;

  // Outnumbered — reinforce with cheap, quick bodies rather than
  // more specialists.
  if(mine.length<enemyCount-3){
    weights.rifleman+=2;
    weights.mg+=1;
  }

  const focus=teams[team].focus;

  if(focus==="rush"){
    weights.rifleman+=2;
  }else if(focus==="defend"){
    weights.mg+=2;
    weights.leader+=1;
  }else if(focus==="flank"){
    weights.grenadier+=1.5;
    weights.marksman+=1;
  }

  // Anti-repetition: the more of a type is already on the field,
  // and the more often it's been picked lately, the less likely
  // it gets picked again — and vice versa. Both fade the weight
  // down (never below a small floor, so nothing becomes truly
  // impossible), applied after the situational bonuses above so
  // an urgent need (no comms, no supplier, etc.) still competes
  // fairly rather than being drowned out entirely.
  const recency=teams[team].spawnRecency;

  for(const k in weights){

    const onField=countOf(k);
    const recent=recency[k]||0;

    weights[k]/=(1+onField*.3);
    weights[k]/=(1+recent*.45);
  }

  let total=0;

  for(const k in weights)
    total+=weights[k];

  let r=rand()*total;

  for(const k in weights){

    r-=weights[k];

    if(r<=0){

      recency[k]=(recency[k]||0)+1;

      return k;
    }
  }

  recency.rifleman=(recency.rifleman||0)+1;

  return "rifleman";
}


function buildBattleSummary(team){

  const enemyTeam=team===BLUE?RED:BLUE;

  const mine=units.filter(u=>u.team===team&&u.hp>0);
  const enemy=units.filter(u=>u.team===enemyTeam&&u.hp>0);

  const countBy=list=>{

    const c={};

    for(const u of list)
      c[u.type]=(c[u.type]||0)+1;

    return c;
  };

  return {
    team:teamNames[team],
    resources:Math.round(teams[team].res),
    ownUnits:countBy(mine),
    ownTotal:mine.length,
    ownDowned:units.filter(u=>u.team===team&&u.critical).length,
    enemyUnits:countBy(enemy),
    enemyTotal:enemy.length,
    enemyDowned:units.filter(u=>u.team===enemyTeam&&u.critical).length,
    flagsHeld:flags.filter(f=>f.team===team).length,
    flagsEnemyHeld:flags.filter(f=>f.team===enemyTeam).length,
    flagsNeutral:flags.filter(f=>f.team!==team&&f.team!==enemyTeam).length,
    resupplyInbound:!!teams[team].pendingSupply,
    activeDrones:kamikazeDrones.filter(d=>d.team===team).length
  };
}


function localCommanderReport(summary){

  // No live model reachable right now (opened outside the
  // artifact sandbox, offline, rate-limited, etc.) — reason
  // about the same real numbers locally instead of going quiet.
  const diff=summary.ownTotal-summary.enemyTotal;

  const lines=[];

  if(summary.ownDowned>0)
    lines.push(
      summary.ownDowned+
      " man"+(summary.ownDowned>1?"s":"")+
      " down — need a rescue, hold the line here."
    );

  if(diff<=-3)
    lines.push(
      "Outnumbered "+summary.enemyTotal+" to "+summary.ownTotal+
      " — falling back, need reinforcements, over."
    );
  else if(diff>=3)
    lines.push(
      "We've got the numbers, "+summary.ownTotal+" to "+
      summary.enemyTotal+" — press it while it lasts."
    );

  if(summary.resources<40)
    lines.push(
      "Down to "+summary.resources+
      " material — requesting resupply, over."
    );

  if(summary.flagsEnemyHeld>summary.flagsHeld)
    lines.push(
      "Only holding "+summary.flagsHeld+" sector"+
      (summary.flagsHeld===1?"":"s")+
      " to their "+summary.flagsEnemyHeld+" — regroup and retake."
    );
  else if(summary.flagsHeld>summary.flagsEnemyHeld)
    lines.push(
      "Holding "+summary.flagsHeld+" sector"+
      (summary.flagsHeld===1?"":"s")+
      " to their "+summary.flagsEnemyHeld+" — dig in and defend."
    );

  if(summary.enemyDowned>0)
    lines.push(
      "Enemy's got "+summary.enemyDowned+
      " down out there — press the advantage."
    );

  if(summary.activeDrones>0)
    lines.push(
      "Drone's live and inbound — cover our approach."
    );

  if(!lines.length)
    lines.push(
      summary.ownTotal+
      " effectives on the line, steady contact — holding formation."
    );

  const message=
    lines[Math.floor(rand()*lines.length)];

  let focus="balanced";

  if(summary.resources<40)
    focus="resupply";
  else if(diff<=-3)
    focus="defend";
  else if(diff>=3)
    focus="rush";
  else if(summary.flagsEnemyHeld>summary.flagsHeld)
    focus="flank";

  return {message,focus};
}


async function requestCommanderReport(team){

  if(teams[team].commsPending||!hasComms(team))
    return;

  teams[team].commsPending=true;

  const summary=buildBattleSummary(team);

  try{

    const prompt=
      "You are the "+summary.team+" team commander in a live "+
      "battlefield simulation. Reply with ONLY one line of raw "+
      "JSON, no prose, no markdown fences, in exactly this shape: "+
      "{\"message\":\"...\",\"focus\":\"rush|defend|flank|resupply|hold\"}. "+
      "\"message\" is a short (under 16 words) military radio "+
      "brevity-code line grounded in the actual numbers below — "+
      "call out a real shortage, a real advantage, or a real plan "+
      "instead of generic chatter. \"focus\" is the single "+
      "strategic priority you're calling for right now, chosen to "+
      "actually fit the numbers.\n\nBattle state:\n"+
      JSON.stringify(summary);

    const response=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:1000,
        messages:[{role:"user",content:prompt}]
      })
    });

    if(!response.ok)
      throw new Error("bad response status");

    const data=await response.json();

    const textBlock=
      (data.content||[]).find(b=>b.type==="text");

    if(!textBlock)
      throw new Error("no text in response");

    const clean=
      textBlock.text
        .replace(/```json|```/g,"")
        .trim();

    const parsed=JSON.parse(clean);

    if(!parsed.message)
      throw new Error("no message in reply");

    addChat(team,String(parsed.message).slice(0,140));

    const allowedFocus=
      ["rush","defend","flank","resupply","hold","balanced"];

    teams[team].focus=
      allowedFocus.includes(parsed.focus)?
      parsed.focus:
      localCommanderReport(summary).focus;

  }catch(err){

    // Live model unreachable this round — fall back to a report
    // built straight from the real battle numbers so the comms
    // panel and strategy still move instead of going silent.
    const fallback=localCommanderReport(summary);

    addChat(team,fallback.message);
    teams[team].focus=fallback.focus;

  }finally{

    teams[team].commsPending=false;
  }
}


function updateCommanderComms(team,dt){

  teams[team].commsTimer-=dt;

  if(teams[team].commsTimer>0)
    return;

  // Loosely staggered so both sides don't always report at once,
  // and infrequent enough to read as deliberate radio traffic
  // rather than a stream of chatter.
  teams[team].commsTimer=16+rand()*10;

  requestCommanderReport(team);
}


function commanderAI(team,dt){

  teams[team].aiTimer-=dt;

  if(teams[team].aiTimer>0)
    return;

  teams[team].aiTimer=.7+rand()*.8;

  // Fades recent-spawn memory over time (used by pickSpawnType's
  // anti-repetition weighting) — roughly a 10-15s memory of "what
  // did we just spawn a lot of," not a permanent record.
  const recency=teams[team].spawnRecency;

  for(const k in recency)
    recency[k]*=.88;

  const base=findBase(team);

  if(!base)
    return;

  // Spawn units.
  if(teams[team].res>=20){

    const type=pickSpawnType(team);

    const cost=TYPES[type].cost;

    if(teams[team].res>=cost){

      teams[team].res-=cost;

      makeUnit(
        type,
        team,
        base.x+
          (team===BLUE?90:-90),
        base.y+
          (rand()-.5)*140
      );
    }
  }

  // Longer engineering projects: mortar (1 day), armored vehicle
  // (2 days), or a marksman upgrade kit (ghillie suit or laser
  // sights) — same construction/readyTime pattern, just cheaper
  // and faster since it's a single-unit item, not a whole new
  // asset. On completion (see processTeamTimers), an upgrade kit
  // doesn't apply itself — it gets handed to an available Supplier
  // to physically carry out and deliver.
  if(!teams[team].construction&&rand()<.3){

    const roll=rand();

    let type,dur,cost;

    if(roll<.3){
      type="mortar";dur=DAY*1;cost=90;
    }else if(roll<.55){
      type="vehicle";dur=DAY*2;cost=140;
    }else if(roll<.8){
      type="ghillie";dur=DAY*.4;cost=70;
    }else{
      type="laserSights";dur=DAY*.5;cost=90;
    }

    if(teams[team].res>=cost){

      teams[team].res-=cost;

      teams[team].construction={
        type,
        readyTime:gameTime+dur
      };

      addChat(
        team,
        "Engineers starting a "+
        (type==="ghillie"?"ghillie suit kit":
         type==="laserSights"?"laser sights kit":
         type)+
        "."
      );
    }
  }

  // Radio a resupply request — any infantry with a working radio
  // can call one in, not just engineers. An actual helicopter
  // then has to fly in, and it spawns somewhere random on the
  // battlefield itself (not safely off-map) so the enemy has a
  // genuine chance to catch and shoot it down before it lands.
  if(
    !teams[team].pendingSupply&&
    gameTime>=teams[team].chopperReadyTime&&
    teams[team].res<90&&
    hasComms(team)&&
    rand()<
      (teams[team].focus==="resupply"?.75:.4)
  ){

    let spawnX=W/2,spawnY=H/2,tries=0;

    do{

      spawnX=140+rand()*(W-280);
      spawnY=140+rand()*(H-280);
      tries++;

    }while(
      terrainAt(spawnX,spawnY)==="water"&&
      tries<20
    );

    const dist=
      Math.hypot(
        base.x-spawnX,
        base.y-spawnY
      );

    choppers.push({
      id:nextId++,
      team,
      x:spawnX,
      y:spawnY,
      hp:70,
      maxhp:70,
      cargo:50,
      speed:dist/(DAY*2),
      targetX:base.x,
      targetY:base.y
    });

    teams[team].pendingSupply=true;
    teams[team].chopperReadyTime=gameTime+30;

    addChat(
      team,
      "Requesting resupply — chopper's inbound, over."
    );
  }

  // Airstrike call-in — a deliberate, expensive area-denial tool
  // that sits alongside mortars rather than replacing them, so it
  // deliberately isn't cheap or spammable: 200 resources up front,
  // locked out for the first 60s of the match, and another 60s
  // cooldown after every use (measured from when the bomb actually
  // lands, not from the call itself — the plane still has to fly
  // in). Only one in flight per team at a time, same as the
  // resupply chopper.
  if(
    !teams[team].pendingAirstrike&&
    gameTime>=teams[team].airstrikeReadyTime&&
    teams[team].res>=200&&
    hasComms(team)&&
    rand()<.2
  ){

    const target=findDenseEnemyPoint(team);

    if(target){

      teams[team].res-=200;

      let spawnX=W/2,spawnY=H/2,tries=0;

      do{

        spawnX=140+rand()*(W-280);
        spawnY=140+rand()*(H-280);
        tries++;

      }while(
        (terrainAt(spawnX,spawnY)==="water"||
         Math.hypot(spawnX-target.x,spawnY-target.y)<1000)&&
        tries<20
      );

      const dist=
        Math.hypot(
          spawnX-target.x,
          spawnY-target.y
        );

      airstrikePlanes.push({
        id:nextId++,
        team,
        x:spawnX,
        y:spawnY,
        targetX:target.x,
        targetY:target.y,
        speed:dist/14
      });

      teams[team].pendingAirstrike=true;

      addChat(
        team,
        "Airstrike called in, danger close — fire in the hole."
      );
    }
  }

  // Engineers build defensive positions and run longer
  // construction projects.
  const engineers=units.filter(
    u=>u.team===team&&
       u.type==="engineer"&&
       u.hp>0&&
       !u.frozenByDrone
  );

  if(engineers.length){

    const objective=chooseObjective(team);

    // Place a wall segment toward a contested objective.
    // Structures are no longer spawned outright — four or
    // more walls clustered together get sealed into a real
    // building by updateWallClusters().
    if(
      objective&&
      teams[team].res>=18&&
      rand()<.5
    ){

      const e=engineers[
        Math.floor(rand()*engineers.length)
      ];

      if(
        Math.hypot(
          e.x-objective.x,
          e.y-objective.y
        )<420
      ){

        const wx=objective.x+(rand()-.5)*140;
        const wy=objective.y+(rand()-.5)*140;

        const cutDown=clearTreesForStructure(
          wx,wy,BUILDING_DATA.wall.r
        );

        structures.push({
          kind:"wall",
          team,
          x:wx,
          y:wy,
          angle:e.facing,
          r:BUILDING_DATA.wall.r,
          hp:BUILDING_DATA.wall.hp,
          maxhp:BUILDING_DATA.wall.hp
        });

        teams[team].res-=18;

        if(cutDown)
          addChat(team,"Clearing trees to build here.");
      }
    }

    // Lay a mine toward a contested objective — obscured to the
    // enemy (their AI never reacts to or avoids it), armed after
    // a short delay so the engineer has time to clear the area.
    // Any unit from any team can set one off, including the
    // owner's own side.
    if(
      objective&&
      teams[team].res>=40&&
      rand()<.15
    ){

      const e=engineers[
        Math.floor(rand()*engineers.length)
      ];

      if(
        Math.hypot(
          e.x-objective.x,
          e.y-objective.y
        )<420
      ){

        mines.push({
          id:nextId++,
          team,
          x:objective.x+(rand()-.5)*160,
          y:objective.y+(rand()-.5)*160,
          armTimer:3,
          armed:false,
          blastRadius:100
        });

        teams[team].res-=40;

        addChat(team,"Engineers laying a mine.");
      }
    }
  }

  // Drone Operator: builds and pilots any of three drone types
  // instead of risking a trained soldier directly. The operator
  // freezes in place (generalized frozenByDrone/droneThaw
  // mechanic) until the drone is gone for good — doHasDrone()
  // excludes an operator whose drone is merely Inactive (Part 5),
  // since that's a paused state, not a terminal one, and a new
  // drone can't be built until the old one is actually destroyed.
  const drOps=units.filter(
    u=>u.team===team&&
       u.type==="droneOperator"&&
       u.hp>0&&
       !u.frozenByDrone&&
       !doHasDrone(u)
  );

  if(
    drOps.length&&
    rand()<
      (
        teams[team].focus==="flank"||
        teams[team].focus==="rush"?
        .35:.22
      )
  ){

    const roll=rand();

    let droneType,cost;

    if(roll<.5){
      droneType="kamikaze";cost=20;
    }else if(roll<.8){
      droneType="scout";cost=20;
    }else{
      droneType="rifle";cost=25;
    }

    if(teams[team].res>=cost){

      const op=drOps[
        Math.floor(rand()*drOps.length)
      ];

      teams[team].res-=cost;

      op.frozenByDrone=true;
      op.droneThaw=0;
      op.goal=null;
      op.target=null;

      if(droneType==="kamikaze"){

        kamikazeDrones.push({
          id:nextId++,
          team,
          x:op.x,
          y:op.y,
          hp:14,
          maxhp:14,
          speed:82,
          facing:op.facing,
          operator:op,
          inactive:false
        });

        addChat(team,"Drone operator launching a kamikaze drone.");

      }else if(droneType==="scout"){

        makeUnit("scoutDrone",team,op.x,op.y);

        units[units.length-1].operator=op;

        addChat(team,"Drone operator launching a scout drone.");

      }else{

        makeUnit("rifleDrone",team,op.x,op.y);

        units[units.length-1].operator=op;

        addChat(team,"Drone operator launching a rifle drone.");
      }
    }
  }
}


function updateWallClusters(){

  // Four or more of a team's walls clustered together get
  // sealed into a proper bunker — buildings are man-made,
  // not spawned outright.
  for(const team of [BLUE,RED]){

    const walls=structures.filter(
      s=>s.kind==="wall"&&s.team===team
    );

    if(walls.length<4)
      continue;

    const visited=new Set();

    for(const w of walls){

      if(visited.has(w))
        continue;

      const group=[w];
      visited.add(w);

      let changed=true;

      while(changed){

        changed=false;

        for(const w2 of walls){

          if(visited.has(w2))
            continue;

          if(
            group.some(
              g=>Math.hypot(g.x-w2.x,g.y-w2.y)<100
            )
          ){
            group.push(w2);
            visited.add(w2);
            changed=true;
          }
        }
      }

      if(group.length>=4){

        let cx=0,cy=0;

        for(const g of group){
          cx+=g.x;
          cy+=g.y;
        }

        cx/=group.length;
        cy/=group.length;

        structures=structures.filter(
          s=>!group.includes(s)
        );

        // A bunker has a bigger footprint than the walls that
        // formed it — clear any extra trees inside that footprint.
        clearTreesForStructure(cx,cy,BUILDING_DATA.bunker.r);

        makeBuilding("bunker",team,cx,cy);

        addChat(
          team,
          "Walls sealed up — bunker's standing."
        );
      }
    }
  }
}


function processTeamTimers(){

  for(const team of [BLUE,RED]){

    const T=teams[team];

    if(
      T.construction&&
      gameTime>=T.construction.readyTime
    ){

      const c=T.construction;
      const base=findBase(team);

      if(c.type==="ghillie"||c.type==="laserSights"){

        // Doesn't apply itself — gets handed to an available
        // Supplier to physically carry out and deliver (see the
        // supplier behavior block in updateUnitAI). If none is
        // free right now, it waits in the team's queue for the
        // next Supplier that opens up. If that Supplier dies
        // while carrying it, the upgrade — and the resources
        // spent on it — are simply gone, no refund, no
        // reassignment.
        const supplier=units.find(
          u=>u.team===team&&
             u.type==="supplier"&&
             u.hp>0&&
             !u.critical&&
             !u.carryingUpgrade
        );

        if(supplier){

          supplier.carryingUpgrade=c.type;

          addChat(
            team,
            "Upgrade ready — a supplier's carrying it out."
          );

        }else{

          T.pendingUpgrades.push(c.type);

          addChat(
            team,
            "Upgrade ready, waiting on a free supplier."
          );
        }

      }else if(base){

        makeUnit(
          c.type,
          team,
          base.x+(team===BLUE?90:-90),
          base.y+(rand()-.5)*140
        );

        addChat(
          team,
          (c.type==="vehicle"?
            "Armored car rolling out.":
            "Mortar team is set up.")
        );
      }

      T.construction=null;
    }
  }
}


function updateChoppers(dt){

  // Resupply choppers physically fly in from off-map toward
  // their own base — the enemy can shoot them down along the
  // way (see updateBullets). If one makes it, it drops its
  // cargo and clears the way for the next request.
  for(let i=choppers.length-1;i>=0;i--){

    const c=choppers[i];

    const dx=c.targetX-c.x;
    const dy=c.targetY-c.y;
    const d=Math.hypot(dx,dy);

    if(d<55){

      teams[c.team].res+=c.cargo;

      addChat(
        c.team,
        "Chopper's here — supplies dropped, over."
      );

      teams[c.team].pendingSupply=null;

      choppers.splice(i,1);
      continue;
    }

    const vx=dx/(d||1);
    const vy=dy/(d||1);

    c.x+=vx*c.speed*dt;
    c.y+=vy*c.speed*dt;
  }
}


function updateAirstrikePlanes(dt){

  // Flies in from a random point on the map (at least 1000px from
  // the target, so it isn't just spawning on top of the blast) to
  // the commander AI's chosen point, then drops its bomb — no
  // in-flight shoot-down mechanic, unlike the resupply chopper;
  // this is fire-and-forget once called.
  for(let i=airstrikePlanes.length-1;i>=0;i--){

    const p=airstrikePlanes[i];

    const dx=p.targetX-p.x;
    const dy=p.targetY-p.y;
    const d=Math.hypot(dx,dy);

    if(d<40){

      // Same falloff-by-distance blast as a mine, scaled up, and
      // just as indiscriminate — no team filter, hits anyone
      // caught in range. Same known gap as every other explosion
      // in the game: doesn't yet account for building walls.
      const blastR=250;

      for(const v of units){

        if(v.hp<=0&&!v.critical)
          continue;

        const bd=Math.hypot(v.x-p.targetX,v.y-p.targetY);

        if(bd<blastR){

          const falloff=Math.max(0,1-bd/blastR);
          damageUnit(v,100*falloff,null);
        }
      }

      spawnParticles(p.targetX,p.targetY,"#ffb347",16);
      spawnParticles(p.targetX,p.targetY,"#ff5a3d",10);
      spawnParticles(p.targetX,p.targetY,"#8a8a82",8);
      spawnBlastRing(p.targetX,p.targetY,blastR,"#ff6a3d");

      // The cooldown starts now — from the bomb actually landing —
      // not from when the strike was called in.
      teams[p.team].airstrikeReadyTime=gameTime+60;
      teams[p.team].pendingAirstrike=null;

      addChat(p.team,"Bombs away — target hit, over.");

      airstrikePlanes.splice(i,1);
      continue;
    }

    const vx=dx/(d||1);
    const vy=dy/(d||1);

    p.x+=vx*p.speed*dt;
    p.y+=vy*p.speed*dt;
  }
}


// Releases a drone's operator from the freeze — called whenever a
// drone is destroyed, whether it detonated on contact or got shot
// down. The engineer stays frozen a moment longer (see
// updateDroneOperators()) before snapping back to normal.
function findPilotedDrone(op){

  // Reverse lookup: which drone (of any of the three types) this
  // Drone Operator currently owns, active or Inactive. Used by
  // doHasDrone() (can't build a new one until the old one is
  // truly gone), the Inactive-state damage hook in damageUnit(),
  // and the Out-of-Danger reactivation check below.
  for(const d of kamikazeDrones)
    if(d.operator===op)
      return d;

  for(const v of units)
    if(
      (v.type==="scoutDrone"||v.type==="rifleDrone")&&
      v.operator===op&&
      v.hp>0
    )
      return v;

  return null;
}


function doHasDrone(op){

  return !!findPilotedDrone(op);
}


function isOutOfDanger(u){

  // "Out of Danger" for Part 5's reactivation check is explicitly
  // a visibility check, not assessThreat()'s pure-distance one —
  // an enemy within 160px but blocked by a wall doesn't count.
  for(const v of units){

    if(v.team===u.team||v.hp<=0)
      continue;

    if(Math.hypot(u.x-v.x,u.y-v.y)>160)
      continue;

    if(hasLineOfSight(u,v))
      return false;
  }

  return true;
}


function releaseDroneOperator(d){

  if(
    d.operator&&
    d.operator.hp>0&&
    d.operator.frozenByDrone
  ){
    d.operator.droneThaw=1;
  }
}


function detonateDrone(d,indiscriminate=false,blastR=60,dmg=55){

  // Splash damage, mortar/mine-style — full damage right at the
  // point of impact, tapering off toward the edge of the blast.
  // Normally only the enemy team is caught in it (that's the
  // drone's whole purpose), but a drone shot down out of the sky,
  // one that strayed past its leash, or one whose operator died
  // detonates prematurely and doesn't discriminate — it can catch
  // its own team in the blast too. NOTE: blast damage is still
  // pure radial falloff and doesn't know building walls exist —
  // dampening/blocking a blast by walls is deferred, see the
  // Single-Room Buildings writeup.
  for(const v of units){

    if(
      (indiscriminate||v.team!==d.team)&&
      (v.hp>0||v.critical)
    ){

      const bd=Math.hypot(v.x-d.x,v.y-d.y);

      if(bd<blastR){

        const falloff=Math.max(0,1-bd/blastR);
        damageUnit(v,dmg*falloff,null);
      }
    }
  }

  spawnParticles(d.x,d.y,"#ffb347",10);
  spawnParticles(d.x,d.y,"#ff5a3d",6);
  spawnBlastRing(d.x,d.y,blastR,"#ffb347");

  releaseDroneOperator(d);
}


// How far a drone can stray from its Drone Operator before the
// leash rule kicks in — same distance regardless of drone type or
// active/Inactive state, only the consequence differs (see
// updateKamikazeDrones()/the Scout+Rifle Drone AI blocks).
const DRONE_LEASH_RANGE=500;
const DRONE_LEASH_BLAST_RADIUS=20;
const DRONE_LEASH_BLAST_DAMAGE=20;


function updateKamikazeDrones(dt){

  // Drone-Operator-piloted, expendable, unmanned — flies toward
  // the nearest living enemy infantry unit and self-destructs
  // once it's close, dealing splash damage. The enemy can shoot
  // it down first (see updateBullets), so it isn't a free kill.
  for(let i=kamikazeDrones.length-1;i>=0;i--){

    const d=kamikazeDrones[i];

    // Case 4: the DO piloting this drone has died outright —
    // friendly-fire explosion, same profile as a shoot-down.
    if(!d.operator||d.operator.hp<=0){

      detonateDrone(d,true);
      kamikazeDrones.splice(i,1);
      continue;
    }

    // Case 3: the 500px leash always applies, active or Inactive,
    // but the consequence differs — an active drone that strays
    // too far blows up on its own team with a small fixed blast;
    // an Inactive one just quietly ceases to exist, no explosion
    // at all. A DO fleeing far enough to reach safety can lose an
    // Inactive drone entirely as the price of surviving.
    const leashDist=Math.hypot(d.x-d.operator.x,d.y-d.operator.y);

    if(leashDist>DRONE_LEASH_RANGE){

      if(d.inactive){
        releaseDroneOperator(d);
      }else{
        detonateDrone(
          d,true,
          DRONE_LEASH_BLAST_RADIUS,
          DRONE_LEASH_BLAST_DAMAGE
        );
      }

      kamikazeDrones.splice(i,1);
      continue;
    }

    // Part 5: Inactive — stopped moving/attacking, but still
    // present and destructible by enemy fire (handled generically
    // in updateBullets, unaffected by this flag).
    if(d.inactive)
      continue;

    let target=null;
    let bd=Infinity;

    for(const v of units){

      if(
        v.team===d.team||
        v.hp<=0||
        !INFANTRY_TYPES.includes(v.type)
      )
        continue;

      const dist=Math.hypot(v.x-d.x,v.y-d.y);

      if(dist<bd){
        bd=dist;
        target=v;
      }
    }

    if(target&&bd<38){

      // Case 2: reached its own objective — enemy-only explosion.
      detonateDrone(d);
      kamikazeDrones.splice(i,1);
      continue;
    }

    let gx,gy;

    if(target){
      gx=target.x;
      gy=target.y;
    }else{

      // No infantry to hunt yet — drift toward the enemy side
      // of the map so it's in position once one appears.
      const enemyHQ=findBase(d.team===BLUE?RED:BLUE);

      gx=enemyHQ?enemyHQ.x:d.x;
      gy=enemyHQ?enemyHQ.y:d.y;
    }

    const dx=gx-d.x;
    const dy=gy-d.y;
    const dist=Math.hypot(dx,dy)||1;

    d.facing=Math.atan2(dy,dx);

    d.x+=(dx/dist)*d.speed*dt;
    d.y+=(dy/dist)*d.speed*dt;
  }
}


function updateDroneUnits(){

  // Scout Drone and Rifle Drone live as real units (for
  // chooseRoleGoal()/nearestEnemy()/moveUnit()), so they need
  // their own equivalent of the leash/DO-death rules
  // updateKamikazeDrones() already runs for the lightweight
  // Kamikaze Drone — cases 3 and 4 of the death rules, checked
  // every frame rather than left to the throttled AI think-cycle.
  for(const v of units){

    if(
      (v.type!=="scoutDrone"&&v.type!=="rifleDrone")||
      v.hp<=0
    )
      continue;

    // Case 4: the DO piloting this drone has died outright.
    if(!v.operator||v.operator.hp<=0){

      detonateDrone(v,true);

      v.hp=0;
      v.critical=false;

      continue;
    }

    // Case 3: the 500px leash — active drones blow up on their
    // own team with a small fixed blast; an Inactive one just
    // ceases to exist, no explosion at all.
    const leashDist=Math.hypot(v.x-v.operator.x,v.y-v.operator.y);

    if(leashDist>DRONE_LEASH_RANGE){

      if(v.droneInactive){
        releaseDroneOperator(v);
      }else{
        detonateDrone(
          v,true,
          DRONE_LEASH_BLAST_RADIUS,
          DRONE_LEASH_BLAST_DAMAGE
        );
      }

      v.hp=0;
      v.critical=false;
    }
  }
}


// How close a medic needs to be, either to a stationary critical
// casualty or one still being hauled, to start working on them.
const MEDIC_REVIVE_RANGE=70;

// A critical unit is "out of danger" once no enemy is within this
// radius — one of the conditions that makes a dragger set them
// down (see updateRescues).
const DRAG_SAFE_RADIUS=260;

function nearbyReviveMedic(v){

  for(const w of units){

    if(
      w.team===v.team&&
      w.type==="medic"&&
      w.hp>0&&
      !w.critical&&
      Math.hypot(w.x-v.x,w.y-v.y)<MEDIC_REVIVE_RANGE
    )
      return w;
  }

  return null;
}


function updateDroneOperators(dt){

  // An engineer's drone has died — keep them frozen a moment
  // longer (as if shaking off the loss of the remote link) before
  // they snap back to normal behavior.
  for(const u of units){

    if(u.frozenByDrone&&u.droneThaw>0){

      u.droneThaw-=dt;

      if(u.droneThaw<=0){
        u.droneThaw=0;
        u.frozenByDrone=false;
      }
    }

    // Part 5: a DO whose drone went Inactive (it got hit while
    // piloting — see the instant-thaw hook in damageUnit())
    // regains control the moment it reaches Out of Danger: no
    // visible enemy within 160px.
    if(
      u.type==="droneOperator"&&
      !u.frozenByDrone&&
      u.hp>0
    ){

      const drone=findPilotedDrone(u);

      if(
        drone&&
        (drone.inactive||drone.droneInactive)&&
        isOutOfDanger(u)
      ){

        u.frozenByDrone=true;
        u.droneThaw=0;
        u.goal=null;
        u.target=null;

        if(drone.inactive!==undefined)
          drone.inactive=false;
        else
          drone.droneInactive=false;
      }
    }
  }
}


function updateRescues(dt){

  // Clear any drag assignment that's gone stale (the rescuer
  // died, went critical themselves, or got reassigned some other
  // way) so the casualty can be picked up by someone else.
  for(const v of units){

    if(
      v.draggedBy&&
      (
        v.draggedBy.hp<=0&&!v.draggedBy.critical||
        v.draggedBy.critical||
        v.draggedBy.dragging!==v
      )
    ){
      v.draggedBy=null;
    }
  }

  // Assign the nearest eligible ally to drag any casualty that
  // doesn't already have a rescuer — "any unit" can do this, not
  // just medics.
  for(const v of units){

    if(!v.critical||v.draggedBy)
      continue;

    let best=null;
    let bd=Infinity;

    for(const w of units){

      if(
        w===v||
        w.team!==v.team||
        w.hp<=0||
        w.critical||
        w.dragging
      )
        continue;

      const d=Math.hypot(w.x-v.x,w.y-v.y);

      if(d<bd){
        bd=d;
        best=w;
      }
    }

    if(best){
      best.dragging=v;
      v.draggedBy=best;
    }
  }

  // Move every dragger + their casualty toward safety.
  for(const w of units){

    if(!w.dragging)
      continue;

    const v=w.dragging;

    if(!v.critical){

      // Already revived (a medic got there first) or gone —
      // release and go back to normal duty next think-tick.
      w.dragging=null;
      continue;
    }

    const dTo=Math.hypot(w.x-v.x,w.y-v.y);

    if(dTo>26){

      // Close the distance to the casualty first.
      w.goal={x:v.x,y:v.y};

    }else{

      // Got them — haul them toward whichever's closer: base
      // or a building.
      const dest=nearestSafePoint(w.team,w.x,w.y);

      w.goal=dest;

      // The casualty trails just behind the one dragging them.
      v.x+=(w.x-v.x)*.3;
      v.y+=(w.y-v.y)*.3;

      // Set the casualty down — and free the dragger to resume
      // normal duty/combat — as soon as any of three things is
      // true: they've reached safety (base, or simply out of any
      // enemy's sightline — see isSafeSpot()), a medic has caught
      // up and is ready to work on them, or they're simply clear
      // of the fighting.
      if(
        isSafeSpot(v)||
        nearbyReviveMedic(v)||
        assessThreat(v,DRAG_SAFE_RADIUS)===0
      ){

        w.dragging=null;
        v.draggedBy=null;
      }
    }

    w.order="dragging";
  }

  // A medic standing over a critical casualty (whether they
  // walked up to a stationary one or caught up to one still
  // being dragged) gradually revives them instead of an instant
  // fix. The longer the casualty has already been down, the
  // longer the revive takes — anywhere from 3s (only just went
  // down) up to 7s (close to bleeding out). The bleed-out timer
  // itself is paused for as long as the medic is actively
  // working on them.
  for(const v of units){

    if(!v.critical){

      v.reviveProgress=0;
      v.reviveRequired=undefined;
      v.beingHealed=false;
      continue;
    }

    // beingHealed starts false and only flips true below, as a
    // direct consequence of revive progress actually advancing
    // this tick — not as an independent "a medic happens to be
    // nearby" precondition. That way the two facts can't silently
    // drift apart after some future edit to this block.
    v.beingHealed=false;

    const medic=nearbyReviveMedic(v);

    if(!medic)
      continue;

    if(v.reviveRequired===undefined){

      const elapsed=22-v.criticalTimer;
      v.reviveRequired=clamp(3+(elapsed/22)*4,3,7);

      if(inTrench(v))
        v.reviveRequired*=.9;
    }

    const progressBefore=v.reviveProgress;

    v.reviveProgress+=dt;

    v.beingHealed=v.reviveProgress>progressBefore;

    if(v.reviveProgress>=v.reviveRequired){

      // A real revive — enough to get back on their feet and
      // rejoin the fight, not just a top-up.
      v.hp=v.maxhp*.4;
      v.critical=false;
      v.criticalTimer=0;
      v.draggedBy=null;
      v.reviveProgress=0;
      v.reviveRequired=undefined;
      v.beingHealed=false;
    }
  }

  // Critical casualties recover passively once safe (base, or
  // simply out of any enemy's sightline — see isSafeSpot()) — the
  // bleed-out timer pauses there, and enough regen brings them
  // back into the fight on their own, same as a medic revive but
  // slower. Out in the open (and not being actively healed above),
  // the clock runs.
  for(const v of units){

    if(!v.critical)
      continue;

    if(isSafeSpot(v)){

      v.hp=Math.min(v.maxhp*.4,v.hp+dt*2.2);

      if(v.hp>=v.maxhp*.4){

        v.critical=false;
        v.criticalTimer=0;
        v.draggedBy=null;
        v.reviveProgress=0;
        v.reviveRequired=undefined;
      }

    }else if(!v.beingHealed){

      v.criticalTimer-=dt;
    }
  }
}


// How close a unit needs to be to a Supplier for a field resupply
// to start — same spirit as MEDIC_REVIVE_RANGE.
const SUPPLIER_RESUPPLY_RANGE=70;


function updateSupplyDeliveries(dt){

  // Timed field ammo transfer — mirrors the medic critical-revive
  // pattern exactly: a receiving unit accumulates progress every
  // frame while a Supplier holds position in range, and the
  // transfer resolves once that reaches the required duration
  // (3-7s, scaled by how much reserve is actually missing — a
  // near-empty reserve takes the full 7s, a nearly-full one barely
  // any time at all).
  for(const v of units){

    if(v.hp<=0||v.critical){

      v.resupplyProgress=0;
      v.resupplyRequired=undefined;
      v.beingResupplied=false;
      continue;
    }

    if(v.reserve>=TYPES[v.type].reserveSize){

      v.resupplyProgress=0;
      v.resupplyRequired=undefined;
      v.beingResupplied=false;
      continue;
    }

    let supplier=null;

    for(const s of units){

      if(
        s!==v&&
        s.type==="supplier"&&
        s.team===v.team&&
        s.hp>0&&
        !s.critical&&
        s.ammoPack>0&&
        Math.hypot(s.x-v.x,s.y-v.y)<SUPPLIER_RESUPPLY_RANGE
      ){
        supplier=s;
        break;
      }
    }

    v.beingResupplied=!!supplier;

    if(!supplier)
      continue;

    if(v.resupplyRequired===undefined){

      const deficit=TYPES[v.type].reserveSize-v.reserve;
      const fraction=deficit/TYPES[v.type].reserveSize;

      v.resupplyRequired=3+fraction*4;

      if(inTrench(v))
        v.resupplyRequired*=.9;
    }

    v.resupplyProgress+=dt;

    if(v.resupplyProgress>=v.resupplyRequired){

      // Recomputed fresh at the moment of transfer (rather than
      // reusing whatever was true when the timer started) so it's
      // always correct even if a different Supplier picked up the
      // job partway through, or this one made other deliveries
      // in the meantime.
      const deficit=TYPES[v.type].reserveSize-v.reserve;
      const amount=Math.min(deficit,supplier.ammoPack);

      v.reserve+=amount;
      supplier.ammoPack=Math.max(0,supplier.ammoPack-amount);

      v.resupplyProgress=0;
      v.resupplyRequired=undefined;
      v.beingResupplied=false;
    }
  }
}


function updateMines(dt){

  // Obscured to the enemy — there's no avoidance/detection AI
  // for mines at all, so enemy units simply never react to them.
  // Any unit from any team (including the owner's own) can set
  // one off by walking too close, once it's armed.
  for(let i=mines.length-1;i>=0;i--){

    const m=mines[i];

    if(!m.armed){

      m.armTimer-=dt;

      if(m.armTimer<=0)
        m.armed=true;

      continue;
    }

    let triggered=false;

    for(const u of units){

      if(
        u.hp<=0&&!u.critical
      )
        continue;

      if(Math.hypot(u.x-m.x,u.y-m.y)<18){
        triggered=true;
        break;
      }
    }

    if(!triggered)
      continue;

    // Same falloff-by-distance blast as a mortar shell, but it
    // doesn't care whose team anyone's on — a mine hurts anyone
    // caught in range, including its own side. Same note as the
    // drone blast above: doesn't yet account for building walls.
    for(const v of units){

      if(
        v.hp<=0&&!v.critical
      )
        continue;

      const d=Math.hypot(v.x-m.x,v.y-m.y);

      if(d<m.blastRadius){

        const falloff=Math.max(0,1-d/m.blastRadius);

        damageUnit(v,65*falloff,null);
      }
    }

    spawnParticles(m.x,m.y,"#ffb347",10);
    spawnParticles(m.x,m.y,"#ff5a3d",6);
    spawnBlastRing(m.x,m.y,m.blastRadius,"#ffb347");

    mines.splice(i,1);
  }
}


/* =========================================================
   FLAGS
========================================================= */

function updateFlags(dt){

  for(const f of flags){

    const counts=[0,0];

    for(const u of units){

      if(
        u.hp>0 &&
        Math.hypot(
          u.x-f.x,
          u.y-f.y
        )<95
      ){

        // Scout Drone contributes half a "unit" toward its team's
        // pressure on a flag; Rifle Drone doesn't factor in at
        // all, same as Kamikaze already didn't (it lives in a
        // separate array, never reaches this loop in the first
        // place). Everyone else counts as a full unit, as before.
        counts[u.team]+=
          u.type==="scoutDrone"?.5:
          u.type==="rifleDrone"?0:
          1;
      }
    }

    if(counts[0]===counts[1]){

      // No clear majority present right now — leave progress
      // exactly where it was (frozen, not decaying), and hide
      // the contest indicator since nobody's actively flipping it.
      f.contestedBy=null;
      continue;
    }

    const team=
      counts[0]>counts[1]?0:1;

    if(team===f.team){

      f.progress=
        Math.max(
          0,
          f.progress-dt*.3
        );

      f.contestedBy=null;

    }else{

      f.progress+=dt*.55;
      f.contestedBy=team;

      if(f.progress>=4){

        f.team=team;
        f.progress=0;
        f.contestedBy=null;
        teams[team].score+=10;
      }
    }
  }
}


/* =========================================================
   BULLETS
========================================================= */

function updateBullets(dt){

  for(let i=bullets.length-1;i>=0;i--){

    const b=bullets[i];

    b.x+=b.vx*dt;
    b.y+=b.vy*dt;
    b.life-=dt;

    let remove=b.life<=0;

    if(
      b.x<0||
      b.y<0||
      b.x>W||
      b.y>H
    )
      remove=true;

    if(remove){

      bullets.splice(i,1);
      continue;
    }

    let hit=false;

    // Unit collision. No separate "inside a ruin" immunity check
    // needed anymore — a unit sheltering behind a building's
    // walls is protected because the bullet itself gets stopped
    // by those walls first (see the building-wall barrier check
    // below), the same way a "wall" barrier already works.
    for(const u of units){

      if(
        (u.hp<=0&&!u.critical)||
        u.team===b.team
      )
        continue;

      if(
        Math.hypot(
          u.x-b.x,
          u.y-b.y
        )<
        TYPES[u.type].radius+5
      ){

        if(b.explosive){

          const blastR=b.blastRadius||75;

          for(const v of units){

            if(
              v.team!==b.team &&
              (v.hp>0||v.critical)
            ){

              const bd2=Math.hypot(
                v.x-u.x,
                v.y-u.y
              );

              if(bd2<blastR){

                // Mortars fall off smoothly with distance from
                // the point of impact; grenades keep their old
                // flat splash so existing balance is unchanged.
                const mult=
                  b.blastFalloff?
                  Math.max(0,1-bd2/blastR):
                  .55;

                damageUnit(v,b.damage*mult,b.source);
              }
            }
          }

        }else{

          // A dug-in defender ducks clear of most direct fire —
          // explosions and flame contact don't roll against this
          // at all, they resolve through entirely separate code
          // paths (the blast-splash loop above, and
          // updateFlameEffects()).
          if(!(inTrench(u)&&rand()<.75))
            damageUnit(u,b.damage,b.source);
        }

        spawnParticles(
          u.x,
          u.y,
          "#eee",
          3
        );

        if(b.explosive)
          spawnBlastRing(
            u.x,
            u.y,
            b.blastRadius||75,
            b.blastFalloff?"#ff9a4d":"#ffcf6e"
          );

        bullets.splice(i,1);
        hit=true;
        break;
      }
    }

    if(hit)
      continue;

    // Barrier collision — a wall mostly stops bullets passing
    // through it (from either side, since it's just a physical
    // obstacle), but gaps in the sandbags occasionally let one
    // slip through. Uses a rotated rectangle so it matches the
    // barrier's actual drawn footprint (which now follows the
    // engineer's facing at build time) rather than a plain circle.
    // A Laser-Sighted shot punches through with no chance to be
    // stopped at all.
    for(const s of structures){

      if(s.kind!=="wall"||b.laserPen)
        continue;

      const angle=s.angle||0;
      const dx=b.x-s.x;
      const dy=b.y-s.y;

      const cos=Math.cos(-angle);
      const sin=Math.sin(-angle);

      const lx=dx*cos-dy*sin;
      const ly=dx*sin+dy*cos;

      if(
        Math.abs(lx)<=s.r&&
        Math.abs(ly)<=9
      ){

        if(rand()<.8){

          spawnParticles(
            b.x,
            b.y,
            "#8c7b57",
            3
          );

          bullets.splice(i,1);
          hit=true;
        }

        break;
      }
    }

    if(hit)
      continue;

    // Building-wall collision — a single-room building's solid
    // wall segments stop a bullet outright (no gap-chance the way
    // a sandbag barrier has; these are proper standing walls), but
    // an opening — a segment that simply isn't in s.walls — has
    // nothing here to hit at all, so a shot through a gap sails
    // through untouched. A Laser-Sighted shot punches through
    // regardless, same as it always could against the old ruins.
    for(const s of structures){

      if(s.kind!=="building"||b.laserPen)
        continue;

      if(Math.hypot(b.x-s.x,b.y-s.y)>s.r+20)
        continue;

      let hitWall=false;

      for(const w of s.walls){

        if(distToSegment(b.x,b.y,w.x1,w.y1,w.x2,w.y2)<6){
          hitWall=true;
          break;
        }
      }

      if(hitWall){

        spawnParticles(
          b.x,
          b.y,
          "#5c5648",
          3
        );

        bullets.splice(i,1);
        hit=true;
        break;
      }
    }

    if(hit)
      continue;

    // Structure collision — buildings were previously being
    // shot at (nearestEnemy correctly picks them as targets)
    // but nothing ever actually damaged them. HQ/barracks/bunker
    // now take real damage, which is what lets a side actually
    // win by destroying the enemy HQ.
    for(const s of structures){

      if(s.team===b.team)
        continue;

      if(
        s.kind!=="HQ"&&
        s.kind!=="barracks"&&
        s.kind!=="bunker"
      )
        continue;

      if(
        Math.hypot(
          s.x-b.x,
          s.y-b.y
        )<s.r
      ){

        s.hp-=b.damage;

        spawnParticles(
          b.x,
          b.y,
          "#ccc",
          4
        );

        bullets.splice(i,1);
        hit=true;
        break;
      }
    }

    if(hit)
      continue;

    // Chopper collision — the opposing team can shoot a supply
    // run down before it reaches base.
    for(const c of choppers){

      if(c.team===b.team)
        continue;

      if(
        Math.hypot(
          c.x-b.x,
          c.y-b.y
        )<24
      ){

        c.hp-=b.damage;

        spawnParticles(
          c.x,
          c.y,
          "#eee",
          3
        );

        bullets.splice(i,1);

        if(c.hp<=0){

          addChat(
            c.team,
            "Chopper's down — resupply lost!"
          );

          teams[c.team].pendingSupply=null;

          // Losing a resupply chopper is a real setback, not just
          // a wasted trip — the cargo (and then some) effectively
          // ends up funding whoever shot it down.
          const enemyTeam=c.team===BLUE?RED:BLUE;

          teams[c.team].res=Math.max(0,teams[c.team].res-50);
          teams[enemyTeam].res+=50;

          const idx=choppers.indexOf(c);

          if(idx>=0)
            choppers.splice(idx,1);
        }

        hit=true;
        break;
      }
    }

    if(hit)
      continue;

    // Kamikaze drone collision — the opposing team can shoot
    // a drone operator's drone down before it reaches a target.
    for(const kd of kamikazeDrones){

      if(kd.team===b.team)
        continue;

      if(
        Math.hypot(
          kd.x-b.x,
          kd.y-b.y
        )<28
      ){

        kd.hp-=b.damage;

        spawnParticles(
          kd.x,
          kd.y,
          "#eee",
          3
        );

        bullets.splice(i,1);

        if(kd.hp<=0){

          // Shot down mid-flight — it goes off right where it
          // was hit, and unlike a clean contact-detonation it
          // doesn't discriminate by team.
          detonateDrone(kd,true);

          const idx=kamikazeDrones.indexOf(kd);

          if(idx>=0)
            kamikazeDrones.splice(idx,1);
        }

        hit=true;
        break;
      }
    }
  }

  // Absolute safety cap.
  if(bullets.length>900)
    bullets.splice(
      0,
      bullets.length-900
    );
}


/* =========================================================
   PARTICLES
========================================================= */

function spawnParticles(x,y,color,n=4){

  for(let i=0;i<n;i++){

    particles.push({
      x,
      y,

      vx:(rand()-.5)*80,
      vy:(rand()-.5)*80,

      life:.25+rand()*.2,

      color
    });
  }
}

function updateParticles(dt){

  for(let i=particles.length-1;i>=0;i--){

    const p=particles[i];

    p.x+=p.vx*dt;
    p.y+=p.vy*dt;

    p.life-=dt;

    if(p.life<=0)
      particles.splice(i,1);
  }

  if(particles.length>500)
    particles.splice(
      0,
      particles.length-500
    );
}


/* =========================================================
   BLAST RINGS
   A visible ring drawn at an explosion's actual damage radius,
   so splash weapons (mortar, grenadier, mines, kamikaze drones,
   airstrikes) read clearly as "this is how far that just
   reached" instead of only a small particle puff at the center.
   Purely visual — has no effect on damage, which is already
   resolved wherever spawnBlastRing() gets called from.
========================================================= */

function spawnBlastRing(x,y,radius,color="#ffb347"){

  blastRings.push({
    x,y,radius,color,
    age:0,
    duration:.45
  });
}


function updateBlastRings(dt){

  for(let i=blastRings.length-1;i>=0;i--){

    const b=blastRings[i];

    b.age+=dt;

    if(b.age>=b.duration)
      blastRings.splice(i,1);
  }
}


function drawBlastRings(){

  for(const b of blastRings){

    const t=clamp(b.age/b.duration,0,1);

    // Quick outward pop from ~35% of the radius up to the full
    // blast radius, fading out as it goes — reads as a shockwave
    // that shows exactly how far the blast reached.
    const rr=b.radius*(.35+.65*t);
    const alpha=1-t;

    ctx.save();

    ctx.globalAlpha=alpha*.18;
    ctx.fillStyle=b.color;
    ctx.beginPath();
    ctx.arc(b.x,b.y,rr,0,Math.PI*2);
    ctx.fill();

    ctx.globalAlpha=alpha*.9;
    ctx.strokeStyle=b.color;
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.arc(b.x,b.y,rr,0,Math.PI*2);
    ctx.stroke();

    ctx.restore();
  }
}


/* =========================================================
   CLEANUP
========================================================= */

function cleanup(){

  // Remove dead units immediately — but a unit in Critical
  // Failure stays on the field (hp pinned at 0) until they're
  // rescued/healed or their bleed-out timer runs out. Anyone
  // actually removed here (bled out, or finished off while
  // already down) is a permanent loss for their team — tallied
  // for the Advanced Stats panel, separate from the "Downed"
  // count of units still recoverable on the field.
  units=units.filter(u=>{

    const stillHere=
      u.hp>0||(u.critical&&u.criticalTimer>0);

    if(
      !stillHere&&
      (u.team===BLUE||u.team===RED)
    )
      teams[u.team].casualties++;

    return stillHere;
  });

  structures=structures.filter(
    s=>s.kind==="trench"||s.hp>0
  );
}


/* =========================================================
   SIMULATION
========================================================= */

const SIM_STEP=1/30;
let simulationAccumulator=0;
let wallCheckTimer=1.5;

function simulationStep(){

  if(paused)
    return;

  gameTime+=SIM_STEP;

  for(const team of [0,1]){

    const camps=structures.filter(
      s=>s.team===team&&
         s.kind==="barracks"
    ).length;

    const sectors=flags.filter(
      f=>f.team===team
    ).length;

    teams[team].res+=
      SIM_STEP*
      (1.4+camps*.5+sectors*.8);
  }

  commanderAI(BLUE,SIM_STEP);
  commanderAI(RED,SIM_STEP);

  updateCommanderComms(BLUE,SIM_STEP);
  updateCommanderComms(RED,SIM_STEP);

  processTeamTimers();

  wallCheckTimer-=SIM_STEP;

  if(wallCheckTimer<=0){
    updateWallClusters();
    wallCheckTimer=1.5;
  }

  for(const u of units){

    u.cd=Math.max(
      0,
      u.cd-SIM_STEP
    );

    if(u.stunned>0)
      u.stunned=Math.max(0,u.stunned-SIM_STEP);

    if(u.meleeCd>0)
      u.meleeCd=Math.max(0,u.meleeCd-SIM_STEP);

    if(u.recentlyStabbedTimer>0)
      u.recentlyStabbedTimer=Math.max(0,u.recentlyStabbedTimer-SIM_STEP);

    if(u.recentFlameContactTimer>0)
      u.recentFlameContactTimer=Math.max(0,u.recentFlameContactTimer-SIM_STEP);

    if(u.type==="flamer"){

      if(u.fuel<=0){

        // The shared out-of-ammo retreat/melee branching in
        // updateUnitAI() returns early for a dry Flamer before
        // ever reaching the Flamer-specific block that normally
        // clears this flag — force it off here instead, so an
        // empty tank can never keep reading as an active cone.
        u.spraying=false;

        // Flat 1s tank swap once close enough to a Supplier —
        // deliberately not the proportional 3-7s scaling ammo
        // reserves use elsewhere; this is a full swap, not a
        // gradual transfer, so the duration doesn't depend on how
        // empty the tank was.
        const supplier=nearestSupplier(u.team,u.x,u.y);

        if(supplier&&Math.hypot(u.x-supplier.x,u.y-supplier.y)<40){

          const swapTime=inTrench(u)?.9:1;

          u.fuelRefillTimer=
            u.fuelRefillTimer>0?
            u.fuelRefillTimer-SIM_STEP:
            swapTime;

          if(u.fuelRefillTimer<=0){
            u.fuel=30;
            u.fuelRefillTimer=0;
          }

        }else{

          u.fuelRefillTimer=inTrench(u)?.9:1;
        }

      }else if(u.spraying){

        u.fuel=Math.max(0,u.fuel-SIM_STEP);
      }
    }

    if(u.reloading){

      u.reloadTimer-=SIM_STEP;

      if(u.reloadTimer<=0){

        const t=TYPES[u.type];
        const needed=t.magSize-u.mag;
        const drawn=Math.min(needed,u.reserve);

        u.mag+=drawn;
        u.reserve-=drawn;
        u.reloading=false;
        u.reloadTimer=0;
        u.lastReloadTime=gameTime;
      }
    }

    updateUnitAI(
      u,
      SIM_STEP
    );

    moveUnit(
      u,
      SIM_STEP
    );
  }

  updateFlags(SIM_STEP);
  updateBullets(SIM_STEP);
  updateParticles(SIM_STEP);
  updateBlastRings(SIM_STEP);
  updateChoppers(SIM_STEP);
  updateAirstrikePlanes(SIM_STEP);
  updateKamikazeDrones(SIM_STEP);
  updateDroneUnits();
  updateScoutDroneReveals();
  updateDroneOperators(SIM_STEP);
  updateLeaderFollowDwell(SIM_STEP);
  updateRescues(SIM_STEP);
  updateSupplyDeliveries(SIM_STEP);
  updateBleeding(SIM_STEP);
  updateFlameEffects(SIM_STEP);
  updateMines(SIM_STEP);

  cleanup();

  const blueHQ=structures.some(
    s=>s.team===BLUE&&s.kind==="HQ"
  );

  const redHQ=structures.some(
    s=>s.team===RED&&s.kind==="HQ"
  );

  if(!blueHQ||!redHQ){

    paused=true;

    setTimeout(()=>{

      alert(
        (blueHQ?"BLUE":"RED")+
        " WINS!\nSeed: "+
        seed
      );

    },50);
  }
}


/* =========================================================
   TERRAIN DRAWING
========================================================= */

function drawTerrain(){

  const left=
    cam.x-innerWidth/(2*cam.zoom)-80;

  const right=
    cam.x+innerWidth/(2*cam.zoom)+80;

  const top=
    cam.y-innerHeight/(2*cam.zoom)-80;

  const bottom=
    cam.y+innerHeight/(2*cam.zoom)+80;

  const minTX=Math.floor(left/TILE);
  const maxTX=Math.ceil(right/TILE);

  const minTY=Math.floor(top/TILE);
  const maxTY=Math.ceil(bottom/TILE);

  for(
    let ty=minTY;
    ty<=maxTY;
    ty++
  ){

    for(
      let tx=minTX;
      tx<=maxTX;
      tx++
    ){

      const n=hash(tx,ty);

      let c;

      if(n<.045)
        c="#315b69";
      else if(n<.14)
        c="#365b32";
      else if(n<.22)
        c="#686447";
      else if(n<.28)
        c="#5c6248";
      else
        c="#4e6d42";

      ctx.fillStyle=c;

      ctx.fillRect(
        tx*TILE,
        ty*TILE,
        TILE+1,
        TILE+1
      );
    }
  }
}


/* =========================================================
   TREE DRAWING
========================================================= */

function drawTrees(){

  for(const t of trees){

    // shadow
    ctx.fillStyle="#182617";

    ctx.beginPath();
    ctx.ellipse(
      t.x,
      t.y+8,
      t.r*1.25,
      t.r*.55,
      0,0,Math.PI*2
    );
    ctx.fill();

    // trunk
    ctx.fillStyle="#4b3423";

    ctx.fillRect(
      t.x-4,
      t.y,
      8,
      20
    );

    // foliage
    ctx.fillStyle="#203d24";

    ctx.beginPath();
    ctx.arc(
      t.x,
      t.y-7,
      t.r,
      0,
      Math.PI*2
    );
    ctx.fill();

    ctx.fillStyle="#31582d";

    ctx.beginPath();
    ctx.arc(
      t.x-7,
      t.y-12,
      t.r*.65,
      0,
      Math.PI*2
    );
    ctx.fill();

    ctx.beginPath();
    ctx.arc(
      t.x+7,
      t.y-8,
      t.r*.6,
      0,
      Math.PI*2
    );
    ctx.fill();
  }
}


/* =========================================================
   TRENCH DRAWING
========================================================= */

function drawTrench(s){

  ctx.save();

  ctx.translate(s.x,s.y);
  ctx.rotate(s.angle);

  // outer earth berm
  ctx.fillStyle="#504531";

  ctx.fillRect(
    -38,
    -17,
    76,
    34
  );

  // trench hole
  ctx.fillStyle="#171913";

  ctx.fillRect(
    -38,
    -7,
    76,
    14
  );

  // inner dirt
  ctx.strokeStyle="#806d4c";
  ctx.lineWidth=3;

  ctx.beginPath();

  ctx.moveTo(-38,-10);
  ctx.lineTo(-20,-10);
  ctx.lineTo(-10,-7);
  ctx.lineTo(5,-10);
  ctx.lineTo(20,-7);
  ctx.lineTo(38,-10);

  ctx.stroke();

  // sandbags
  for(let x=-30;x<35;x+=12){

    ctx.fillStyle="#8c7b57";

    ctx.fillRect(
      x,
      -19,
      9,
      5
    );
  }

  ctx.restore();
}


/* =========================================================
   BUILDING DRAWING
========================================================= */

function drawBuilding(s){

  const r=s.r;

  ctx.save();

  ctx.translate(s.x,s.y);

  if(s.kind==="trench"){

    drawTrench(s);
    ctx.restore();
    return;
  }

  if(s.kind==="wall"){

    ctx.rotate(s.angle||0);

    ctx.fillStyle="#75664c";

    ctx.fillRect(
      -r,
      -9,
      r*2,
      18
    );

    ctx.fillStyle="#a08b62";

    for(let x=-r;x<r;x+=16)
      ctx.fillRect(x,-13,11,5);

    ctx.restore();
    return;
  }

  if(s.kind==="building"){

    // Single-room building — neutral, crumbling cover replacing
    // the old ruins. Not team-colored, not a legitimate attack
    // target, just terrain to fight around. Each solid wall
    // segment is drawn individually (in local coords, since ctx
    // is already translated to the building's center) so the
    // irregular gaps between them read clearly as openings —
    // nothing is drawn there at all.
    const hw=s.halfW;
    const hh=s.halfH;

    ctx.fillStyle="#20241d";
    ctx.fillRect(-hw-8,-hh-8,hw*2+16,hh*2+16);

    ctx.fillStyle="#3a362c";
    ctx.fillRect(-hw,-hh,hw*2,hh*2);

    ctx.fillStyle="#4a4436";

    for(const [ox,oy,rr] of [
      [-hw*.5,hh*.4,6],
      [hw*.4,-hh*.3,5],
      [hw*.1,hh*.55,4],
      [-hw*.6,-hh*.5,5]
    ]){
      ctx.beginPath();
      ctx.arc(ox,oy,rr,0,Math.PI*2);
      ctx.fill();
    }

    ctx.strokeStyle="#6b6152";
    ctx.lineWidth=9;
    ctx.lineCap="butt";

    for(const w of s.walls){
      ctx.beginPath();
      ctx.moveTo(w.x1-s.x,w.y1-s.y);
      ctx.lineTo(w.x2-s.x,w.y2-s.y);
      ctx.stroke();
    }

    ctx.strokeStyle="#8b8172";
    ctx.lineWidth=2;

    for(const w of s.walls){
      ctx.beginPath();
      ctx.moveTo(w.x1-s.x,w.y1-s.y-3);
      ctx.lineTo(w.x2-s.x,w.y2-s.y-3);
      ctx.stroke();
    }

    ctx.restore();
    return;
  }

  const wallColor=
    s.team===BLUE?
    "#526b7b":
    "#76575b";

  const wallDark=
    s.team===BLUE?
    "#3d5361":
    "#5c4245";

  const roofColor=
    s.kind==="bunker"?
    "#3a3a34":
    "#292d2a";

  // ground foundation slab, a bit wider than the walls
  ctx.fillStyle="#20241d";

  ctx.fillRect(
    -r-10,
    -r-10,
    r*2+20,
    r*2+20
  );

  // building shadow
  ctx.fillStyle="#172018";

  ctx.fillRect(
    -r+7,
    -r+8,
    r*2,
    r*2
  );

  // main building
  ctx.fillStyle=wallColor;

  ctx.fillRect(
    -r,
    -r,
    r*2,
    r*2
  );

  // side annex wing (barracks/HQ only — bunkers stay squat and reinforced)
  if(s.kind!=="bunker"){

    const wingW=r*.85;
    const wingH=r*1.15;

    ctx.fillStyle=wallDark;

    ctx.fillRect(
      r-4,
      -wingH/2,
      wingW,
      wingH
    );

    ctx.fillStyle=roofColor;

    ctx.fillRect(
      r-8,
      -wingH/2-5,
      wingW+10,
      8
    );
  }

  // corrugated / paneled wall texture
  ctx.strokeStyle="#00000030";
  ctx.lineWidth=1.5;

  for(let x=-r+8;x<r-4;x+=9){

    ctx.beginPath();
    ctx.moveTo(x,-r+4);
    ctx.lineTo(x,r-4);
    ctx.stroke();
  }

  // concrete/brick foundation band
  ctx.fillStyle="#00000025";

  ctx.fillRect(
    -r,
    r-10,
    r*2,
    10
  );

  // corner support beams
  ctx.fillStyle=wallDark;

  const cSize=7;

  for(const cx of [-r,r-cSize])
    for(const cy of [-r,r-cSize])
      ctx.fillRect(cx,cy,cSize,cSize);

  // roof
  ctx.fillStyle=roofColor;

  ctx.fillRect(
    -r-5,
    -r-7,
    r*2+10,
    10
  );

  // roof ridge line + panel seams
  ctx.strokeStyle="#00000055";
  ctx.lineWidth=1.5;

  ctx.beginPath();
  ctx.moveTo(-r-5,-r-2);
  ctx.lineTo(r+5,-r-2);
  ctx.stroke();

  for(let x=-r;x<r;x+=14){
    ctx.beginPath();
    ctx.moveTo(x,-r-7);
    ctx.lineTo(x,-r+3);
    ctx.stroke();
  }

  // roof vent / chimney
  ctx.fillStyle="#1c1c19";

  ctx.fillRect(
    r*.35,
    -r-16,
    9,
    10
  );

  // bunker firing slits instead of house windows
  if(s.kind==="bunker"){

    ctx.fillStyle="#0c0c0a";

    for(const wy of [-r*.35,r*.1]){

      ctx.fillRect(
        -r+10,
        wy,
        r*2-20,
        6
      );
    }

    // reinforced concrete rib lines
    ctx.strokeStyle="#00000040";
    ctx.lineWidth=2;

    for(let y=-r+14;y<r-6;y+=13){
      ctx.beginPath();
      ctx.moveTo(-r+4,y);
      ctx.lineTo(r-4,y);
      ctx.stroke();
    }

  }else{

    // windows
    ctx.fillStyle="#16242b";

    const win=[
      [-r+15,-r+18],
      [r-27,-r+18],
      [-r+15,8],
      [r-27,8]
    ];

    for(const w of win){

      ctx.fillRect(
        w[0],
        w[1],
        12,
        16
      );

      // window mullion + frame
      ctx.strokeStyle="#6f6250";
      ctx.lineWidth=1.5;
      ctx.strokeRect(w[0],w[1],12,16);

      ctx.beginPath();
      ctx.moveTo(w[0]+6,w[1]);
      ctx.lineTo(w[0]+6,w[1]+16);
      ctx.stroke();
    }
  }

  // doors
  const doorColor="#171512";

  ctx.fillStyle=doorColor;

  // front entrance
  ctx.fillRect(
    -13,
    -r-2,
    26,
    18
  );

  // rear exit
  ctx.fillRect(
    -13,
    r-16,
    26,
    18
  );

  // side exits
  ctx.fillRect(
    -r-2,
    -13,
    18,
    26
  );

  ctx.fillRect(
    r-16,
    -13,
    18,
    26
  );

  // door frames
  ctx.strokeStyle="#b99b69";
  ctx.lineWidth=3;

  ctx.strokeRect(
    -13,
    -r-2,
    26,
    18
  );

  ctx.strokeRect(
    -13,
    r-16,
    26,
    18
  );

  // door handles
  ctx.fillStyle="#d8c48c";
  ctx.fillRect(6,-r+10,3,3);
  ctx.fillRect(6,r-9,3,3);

  // sandbags around entrances
  ctx.fillStyle="#897754";

  for(let x=-35;x<=25;x+=12){

    ctx.fillRect(
      x,
      -r-14,
      9,
      5
    );
  }

  // corner sandbag stacks
  ctx.fillStyle="#7d6c4b";

  for(const cx of [-r-14,r+5])
    for(let i=0;i<2;i++)
      ctx.fillRect(
        cx,
        r-2-i*7,
        14,
        6
      );

  // camouflage netting patches on the roof
  ctx.fillStyle="#3d4a30";

  ctx.beginPath();
  ctx.moveTo(-r*.5,-r-7);
  ctx.lineTo(-r*.15,-r-15);
  ctx.lineTo(r*.15,-r-7);
  ctx.closePath();
  ctx.fill();

  // HQ radio mast + secondary watch post
  if(s.kind==="HQ"){

    ctx.strokeStyle="#222";
    ctx.lineWidth=4;

    ctx.beginPath();
    ctx.moveTo(0,-r);
    ctx.lineTo(0,-r-55);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(-20,-r-42);
    ctx.lineTo(0,-r-55);
    ctx.lineTo(20,-r-42);
    ctx.stroke();

    // signal dish
    ctx.strokeStyle="#333";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(0,-r-48,7,Math.PI*.15,Math.PI*1.1);
    ctx.stroke();

    // flag
    ctx.fillStyle=teamColors[s.team];

    ctx.fillRect(
      0,
      -r-55,
      25,
      13
    );

    // watchtower on the opposite corner
    ctx.fillStyle=wallDark;
    ctx.fillRect(-r-18,-r-30,16,30+r*.4);

    ctx.fillStyle=roofColor;
    ctx.beginPath();
    ctx.moveTo(-r-22,-r-30);
    ctx.lineTo(-r-10,-r-30);
    ctx.lineTo(-r-16,-r-42);
    ctx.closePath();
    ctx.fill();
  }

  // health
  ctx.fillStyle="#111";

  ctx.fillRect(
    -r,
    -r-22,
    r*2,
    5
  );

  ctx.fillStyle=teamColors[s.team];

  ctx.fillRect(
    -r,
    -r-22,
