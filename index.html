    r*2*
      clamp(
        s.hp/s.maxhp,
        0,
        1
      ),
    5
  );

  ctx.restore();
}


/* =========================================================
   UNIT DRAWING
========================================================= */

function drawMeleeKnife(c){

  // Simple fighting knife — steel blade forward, dark grip
  // behind — drawn in place of a melee-eligible unit's normal
  // weapon whenever u.order==="melee". Swaps back to the regular
  // weapon automatically the instant order changes, since this is
  // just a live read of current state each frame, not a separate
  // animation to reset.
  c.fillStyle="#d8d8d8";
  c.strokeStyle="#111";
  c.lineWidth=1.5;

  c.beginPath();
  c.moveTo(6,-2);
  c.lineTo(24,0);
  c.lineTo(6,2);
  c.closePath();
  c.fill();
  c.stroke();

  c.fillStyle="#3d2c17";
  c.fillRect(0,-3,7,6);
}


function drawUnitIcon(c,type,team,ghillie,laser,melee){

  // Draws just the colored body + weapon/role icon, centered at
  // the origin, facing +X (0 radians). Shared by the live-game
  // renderer (drawUnit, which wraps this in translate+rotate) and
  // the field-manual reference icons (which call it unrotated).
  const t=TYPES[type];

  if(!t)
    return;

  // large team body
  c.fillStyle=teamColors[team];

  c.beginPath();

  c.arc(
    0,
    0,
    t.radius,
    0,
    Math.PI*2
  );

  c.fill();

  c.strokeStyle="#111";
  c.lineWidth=2;
  c.stroke();

  // role icon + weapon — everything below is drawn "facing
  // +X" (0 radians).
  c.fillStyle="#f0f0df";
  c.strokeStyle="#111";
  c.lineWidth=2;

  if(type==="rifleman"){

    c.fillRect(-7,-9,14,18);

    if(melee)
      drawMeleeKnife(c);
    else
      c.fillRect(3,-3,22,5); // rifle

  }else if(type==="mg"){

    c.fillRect(-9,-10,18,20);
    c.fillRect(3,-4,25,7); // heavier barrel

  }else if(type==="medic"){

    c.fillRect(-10,-10,20,20);

    c.fillStyle="#d33";

    c.fillRect(-3,-9,6,18);
    c.fillRect(-9,-3,18,6);

    // sidearm — medics still carry something
    c.fillStyle="#f0f0df";
    c.fillRect(6,-2,13,4);

  }else if(type==="leader"){

    c.beginPath();

    c.moveTo(0,-15);
    c.lineTo(12,7);
    c.lineTo(0,14);
    c.lineTo(-12,7);
    c.closePath();

    c.fill();

    c.fillStyle="#ffd66e";

    c.fillRect(-4,-4,8,8);

    // sidearm/rifle slung forward (or a knife, in melee mode)
    c.fillStyle="#f0f0df";

    if(melee)
      drawMeleeKnife(c);
    else
      c.fillRect(4,-2,18,5);

  }else if(type==="marksman"){

    c.beginPath();

    c.arc(
      0,0,9,
      0,Math.PI*2
    );

    c.fill();

    c.fillRect(
      0,-16,
      25,
      4
    ); // long scoped rifle

    if(ghillie){

      // Mottled camo blotches over the body — a quick visual
      // tell for "this one's much harder to spot in cover."
      c.fillStyle="#5c6b3d";

      for(const [ox,oy,rr] of [
        [-5,-4,4],
        [4,-6,3.5],
        [-2,5,4],
        [5,3,3]
      ]){

        c.beginPath();
        c.arc(ox,oy,rr,0,Math.PI*2);
        c.fill();
      }

      c.fillStyle="#7c8a55";

      c.beginPath();
      c.arc(0,0,3,0,Math.PI*2);
      c.fill();

    }else if(laser){

      // A bright red glint off the scope plus a thin laser
      // line down the barrel — the telltale sign that gives
      // this marksman away at a distance.
      c.fillStyle="#ff3b3b";

      c.beginPath();
      c.arc(6,-16,3,0,Math.PI*2);
      c.fill();

      c.strokeStyle="#ff3b3b";
      c.lineWidth=1.5;

      c.beginPath();
      c.moveTo(25,-14);
      c.lineTo(46,-14);
      c.stroke();
    }

  }else if(type==="grenadier"){

    c.beginPath();

    c.arc(
      0,0,11,
      0,Math.PI*2
    );

    c.fill();

    if(melee)
      drawMeleeKnife(c);
    else
      c.fillRect(
        0,-15,
        18,
        6
      ); // launcher tube

  }else if(type==="comms"){

    c.fillRect(
      -10,-10,
      20,20
    );

    c.beginPath();

    c.arc(
      0,-10,
      15,
      Math.PI,
      Math.PI*2
    );

    c.stroke();

    // sidearm
    c.fillStyle="#f0f0df";
    c.fillRect(8,-2,12,4);

  }else if(type==="engineer"){

    c.fillRect(
      -11,-10,
      22,20
    );

    c.fillStyle="#e0bd51";

    c.fillRect(
      -3,-15,
      6,30
    );

    c.fillRect(
      -15,-3,
      30,6
    );

  }else if(type==="vehicle"){

    // tracks
    c.fillStyle="#1c1c1a";
    c.fillRect(-20,-17,40,5);
    c.fillRect(-20,12,40,5);

    // hull
    c.fillStyle="#f0f0df";
    c.fillRect(-19,-12,36,24);

    // turret
    c.beginPath();
    c.arc(-2,0,11,0,Math.PI*2);
    c.fill();
    c.stroke();

    // cannon barrel
    c.fillRect(6,-3,27,6);

  }else if(type==="mortar"){

    // tripod legs
    c.strokeStyle="#443725";
    c.lineWidth=3;

    c.beginPath();
    c.moveTo(-2,-14);
    c.lineTo(-9,11);
    c.moveTo(-2,-14);
    c.lineTo(4,12);
    c.moveTo(-2,-14);
    c.lineTo(-2,15);
    c.stroke();

    // base plate
    c.fillStyle="#333";
    c.beginPath();
    c.arc(-2,12,5,0,Math.PI*2);
    c.fill();

    // tube, angled forward-and-up — mortars fire high-angle
    c.strokeStyle="#f0f0df";
    c.lineWidth=6;
    c.beginPath();
    c.moveTo(-2,-14);
    c.lineTo(20,-24);
    c.stroke();

    c.lineWidth=2;

  }else if(type==="supplier"){

    c.fillRect(-9,-9,18,18);

    // ammo crate slung on the back
    c.fillStyle="#7a5a2e";

    c.fillRect(-16,-9,10,18);

    c.strokeStyle="#3d2c17";
    c.lineWidth=1.5;
    c.strokeRect(-16,-9,10,18);

    c.beginPath();
    c.moveTo(-16,-2);
    c.lineTo(-6,-2);
    c.moveTo(-16,4);
    c.lineTo(-6,4);
    c.stroke();

    // sidearm
    c.fillStyle="#f0f0df";
    c.strokeStyle="#111";
    c.lineWidth=2;
    c.fillRect(6,-2,12,4);

  }else if(type==="flamer"){

    c.fillRect(-8,-9,16,18);

    // fuel tank slung on the back
    c.fillStyle="#5c3d1f";

    c.beginPath();
    c.arc(-13,0,7,0,Math.PI*2);
    c.fill();
    c.stroke();

    // nozzle/hose forward
    c.strokeStyle="#3d2c17";
    c.lineWidth=3;
    c.beginPath();
    c.moveTo(6,0);
    c.lineTo(18,0);
    c.stroke();

    if(melee){

      c.fillStyle="#d8d8d8";
      c.strokeStyle="#111";
      c.lineWidth=1.5;

      c.beginPath();
      c.moveTo(6,-2);
      c.lineTo(20,0);
      c.lineTo(6,2);
      c.closePath();
      c.fill();
      c.stroke();
    }

  }else if(type==="droneOperator"){

    c.fillRect(-8,-9,16,18);

    // handheld controller
    c.fillStyle="#2a2a26";
    c.fillRect(4,-6,10,10);

    c.strokeStyle="#ffb347";
    c.lineWidth=1.5;
    c.beginPath();
    c.moveTo(6,-4);
    c.lineTo(6,4);
    c.moveTo(11,-4);
    c.lineTo(11,4);
    c.stroke();

    // antenna
    c.strokeStyle="#111";
    c.lineWidth=1.5;
    c.beginPath();
    c.moveTo(-6,-9);
    c.lineTo(-9,-16);
    c.stroke();

  }else if(type==="scoutDrone"){

    // small, light quadcopter body — no weapon
    c.fillStyle="#c7cdbe";
    c.beginPath();
    c.arc(0,0,8,0,Math.PI*2);
    c.fill();
    c.stroke();

    c.strokeStyle="#111";
    c.lineWidth=1.5;
    c.beginPath();
    c.moveTo(-9,-9);c.lineTo(9,9);
    c.moveTo(9,-9);c.lineTo(-9,9);
    c.stroke();

    c.fillStyle="#63a7ff";
    for(const[ox,oy] of [[-9,-9],[9,-9],[-9,9],[9,9]]){
      c.beginPath();
      c.arc(ox,oy,2.5,0,Math.PI*2);
      c.fill();
    }

    // camera lens, forward-facing
    c.fillStyle="#111";
    c.beginPath();
    c.arc(6,0,2.5,0,Math.PI*2);
    c.fill();

  }else if(type==="rifleDrone"){

    // compact quadcopter body with a small rifle slung forward
    c.fillStyle="#8a8a82";
    c.beginPath();
    c.arc(0,0,9,0,Math.PI*2);
    c.fill();
    c.stroke();

    c.strokeStyle="#111";
    c.lineWidth=1.5;
    c.beginPath();
    c.moveTo(-10,-10);c.lineTo(10,10);
    c.moveTo(10,-10);c.lineTo(-10,10);
    c.stroke();

    c.fillStyle="#ff5a3d";
    for(const[ox,oy] of [[-10,-10],[10,-10],[-10,10],[10,10]]){
      c.beginPath();
      c.arc(ox,oy,2.5,0,Math.PI*2);
      c.fill();
    }

    c.fillStyle="#f0f0df";
    c.fillRect(5,-2,16,4);
  }
}


function drawUnit(u){

  const t=TYPES[u.type];

  ctx.save();

  // Concealed units render at reduced opacity — but only if
  // they're actually hidden right now, not just standing near
  // trees. A Scout Drone reveal (isRevealed()) overrides this
  // back to full opacity even though isConcealed() alone would
  // still say yes. 45% transparent = 55% opacity.
  ctx.globalAlpha=
    isConcealed(u)&&!isRevealed(u)?
    .55:
    1;

  ctx.translate(u.x,u.y);

  if(u.critical){

    // Down and out — the unit's own type icon, darkened with an
    // actual color tint (a semi-transparent black overlay), not
    // the alpha-reduction technique concealment uses elsewhere —
    // that visual language already means "translucent," this
    // needs to read as "dimmed" instead. A pulsing "!" stands in
    // for the weapon as a distress marker, and the bleed-out
    // countdown bar underneath is unchanged.
    ctx.save();
    ctx.rotate(u.facing);

    drawUnitIcon(ctx,u.type,u.team,u.ghillie,u.laserSights,false);

    ctx.fillStyle="rgba(0,0,0,.55)";
    ctx.beginPath();
    ctx.arc(0,0,t.radius+16,0,Math.PI*2);
    ctx.fill();

    ctx.restore();

    // Drawn unrotated (like the bar below), so the marker always
    // reads as hovering above the unit rather than spinning with
    // whichever way they happened to be facing when they went down.
    const pulse=.5+.5*Math.sin(gameTime*6);

    ctx.fillStyle=`rgba(255,80,60,${pulse})`;
    ctx.font="bold 14px sans-serif";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText("!",0,-t.radius-18);

    const frac=clamp(u.criticalTimer/22,0,1);

    ctx.fillStyle="#111";
    ctx.fillRect(-15,-t.radius-9,30,4);

    ctx.fillStyle=
      u.draggedBy?
      "#63a7ff":
      "#ff6269";

    ctx.fillRect(-15,-t.radius-9,30*frac,4);

    ctx.restore();
    return;
  }

  // Body + weapon rotate to face u.facing. The health bar below
  // is drawn afterward, outside this rotated block, so it stays
  // flat and readable no matter which way the unit is looking.
  ctx.save();
  ctx.rotate(u.facing);

  // selection / command aura
  ctx.strokeStyle="#ffffff55";
  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    t.radius+4,
    0,
    Math.PI*2
  );

  ctx.stroke();

  drawUnitIcon(ctx,u.type,u.team,u.ghillie,u.laserSights,u.order==="melee");

  ctx.restore();

  // health bar — deliberately unrotated so it's always readable
  ctx.fillStyle="#111";

  ctx.fillRect(
    -15,
    -t.radius-9,
    30,
    4
  );

  ctx.fillStyle=u.bleeding?"#ff4d4d":"#70df68";

  ctx.fillRect(
    -15,
    -t.radius-9,
    30*
      clamp(
        u.hp/u.maxhp,
        0,
        1
      ),
    4
  );

  // Ammo readout — visible the whole time a unit is mid-reload
  // (so the mechanic is actually visible while it's happening),
  // then lingers for a couple seconds afterward showing the
  // refreshed count before fading back out, rather than
  // permanently cluttering every unit on screen with numbers.
  const sinceReload=gameTime-u.lastReloadTime;
  const showAmmo=u.reloading||sinceReload<2.5;

  if(showAmmo){

    const ammoAlpha=
      u.reloading?
      1:
      clamp(1-sinceReload/2.5,0,1);

    ctx.save();

    ctx.globalAlpha=ammoAlpha;
    ctx.fillStyle=u.reloading?"#ffcf6e":"#e8e8dc";
    ctx.font="10px sans-serif";
    ctx.textAlign="center";

    ctx.fillText(
      u.mag+"/"+u.reserve,
      0,
      -t.radius-13
    );

    ctx.restore();
  }

  // Carrying-upgrade indicator — a Supplier physically hauling a
  // finished upgrade kit gets a small marker so it reads
  // differently from one that's just out running ammo. Doesn't
  // say which upgrade, just that it's carrying something.
  if(u.type==="supplier"&&u.carryingUpgrade){

    ctx.save();
    ctx.translate(t.radius+3,-t.radius-3);

    ctx.fillStyle="#ffd66e";
    ctx.strokeStyle="#5a4110";
    ctx.lineWidth=1;

    ctx.beginPath();
    ctx.arc(0,0,6,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();

    ctx.lineWidth=1.5;

    ctx.beginPath();
    ctx.moveTo(-3,0);
    ctx.lineTo(3,0);
    ctx.moveTo(0,-3);
    ctx.lineTo(0,3);
    ctx.stroke();

    ctx.restore();
  }

  ctx.restore();
}


/* =========================================================
   CHOPPER DRAWING
========================================================= */

function drawChopper(c){

  ctx.save();

  ctx.translate(c.x,c.y);

  const angle=Math.atan2(
    c.targetY-c.y,
    c.targetX-c.x
  );

  ctx.rotate(angle);

  const bodyColor=
    c.team===BLUE?
    "#2f4d63":
    "#5c3336";

  // rotor blur
  ctx.strokeStyle="#00000055";
  ctx.lineWidth=2;

  ctx.beginPath();
  ctx.ellipse(0,-2,26,7,0,0,Math.PI*2);
  ctx.stroke();

  // tail boom
  ctx.fillStyle=bodyColor;
  ctx.fillRect(-30,-3,20,6);

  // tail rotor
  ctx.strokeStyle="#00000055";
  ctx.beginPath();
  ctx.ellipse(-30,-2,2,7,0,0,Math.PI*2);
  ctx.stroke();

  // body
  ctx.beginPath();
  ctx.ellipse(4,0,16,10,0,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle="#111";
  ctx.lineWidth=1.5;
  ctx.stroke();

  // cockpit
  ctx.fillStyle="#bcd6e6";
  ctx.beginPath();
  ctx.ellipse(12,-1,6,5,0,0,Math.PI*2);
  ctx.fill();

  // skids
  ctx.strokeStyle="#111";
  ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(-6,9);
  ctx.lineTo(16,9);
  ctx.stroke();

  ctx.restore();

  // health bar (unrotated, above the chopper)
  ctx.fillStyle="#111";
  ctx.fillRect(c.x-15,c.y-24,30,4);

  ctx.fillStyle="#70df68";
  ctx.fillRect(
    c.x-15,
    c.y-24,
    30*clamp(c.hp/c.maxhp,0,1),
    4
  );
}


/* =========================================================
   AIRSTRIKE PLANE DRAWING
========================================================= */

function drawAirstrikePlane(p){

  // A target reticle at the impact point for the whole flight, so
  // the incoming strike reads as a threat worth reacting to, not
  // just a silent plane crossing the map.
  const pulse=
    .6+Math.sin(gameTime*6)*.4;

  ctx.strokeStyle=
    p.team===BLUE?
    "#3d8cff":
    "#ff4d55";

  ctx.globalAlpha=pulse;
  ctx.lineWidth=2;

  ctx.beginPath();
  ctx.arc(p.targetX,p.targetY,26,0,Math.PI*2);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(p.targetX-34,p.targetY);
  ctx.lineTo(p.targetX-14,p.targetY);
  ctx.moveTo(p.targetX+14,p.targetY);
  ctx.lineTo(p.targetX+34,p.targetY);
  ctx.moveTo(p.targetX,p.targetY-34);
  ctx.lineTo(p.targetX,p.targetY-14);
  ctx.moveTo(p.targetX,p.targetY+14);
  ctx.lineTo(p.targetX,p.targetY+34);
  ctx.stroke();

  ctx.globalAlpha=1;

  ctx.save();

  ctx.translate(p.x,p.y);

  const angle=Math.atan2(
    p.targetY-p.y,
    p.targetX-p.x
  );

  ctx.rotate(angle);

  const bodyColor=
    p.team===BLUE?
    "#2f4d63":
    "#5c3336";

  // wings
  ctx.fillStyle=bodyColor;
  ctx.fillRect(-4,-22,7,44);

  // fuselage
  ctx.beginPath();
  ctx.ellipse(0,0,20,5,0,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle="#111";
  ctx.lineWidth=1.2;
  ctx.stroke();

  // tail fin
  ctx.fillRect(-20,-10,5,12);

  ctx.restore();
}


/* =========================================================
   KAMIKAZE DRONE DRAWING
========================================================= */

function drawKamikazeDrone(d){

  ctx.save();

  ctx.translate(d.x,d.y);
  ctx.rotate(d.facing||0);

  const bodyColor=
    d.team===BLUE?
    "#3d8cff":
    "#ff4d55";

  // rotor arms
  ctx.strokeStyle="#1c1c1a";
  ctx.lineWidth=2;

  ctx.beginPath();
  ctx.moveTo(-8,-8); ctx.lineTo(8,8);
  ctx.moveTo(-8,8); ctx.lineTo(8,-8);
  ctx.stroke();

  // rotor blur circles
  ctx.strokeStyle="#00000055";
  ctx.lineWidth=1.5;

  for(const [rx,ry] of [[-8,-8],[8,-8],[-8,8],[8,8]]){
    ctx.beginPath();
    ctx.arc(rx,ry,4,0,Math.PI*2);
    ctx.stroke();
  }

  // body
  ctx.fillStyle=bodyColor;
  ctx.beginPath();
  ctx.arc(0,0,7,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle="#111";
  ctx.lineWidth=1.5;
  ctx.stroke();

  // armed indicator light — pulses so it reads as "live payload"
  const pulse=.6+.4*Math.sin(gameTime*8);

  ctx.fillStyle=`rgba(255,90,60,${pulse})`;
  ctx.beginPath();
  ctx.arc(3,0,2.5,0,Math.PI*2);
  ctx.fill();

  ctx.restore();

  // health bar (unrotated)
  ctx.fillStyle="#111";
  ctx.fillRect(d.x-12,d.y-18,24,3);

  ctx.fillStyle="#70df68";
  ctx.fillRect(
    d.x-12,
    d.y-18,
    24*clamp(d.hp/d.maxhp,0,1),
    3
  );
}


/* =========================================================
   MINE DRAWING
========================================================= */

function drawMine(m){

  // Deliberately subtle — mines are "obscured to the enemy" in
  // the sense that the enemy AI never reacts to or avoids them;
  // visually they're just kept low-key/low-opacity so they don't
  // read as an obvious marker on the battlefield.
  ctx.save();

  ctx.globalAlpha=m.armed?.75:.4;

  ctx.translate(m.x,m.y);

  ctx.fillStyle="#2a2a24";
  ctx.beginPath();
  ctx.arc(0,0,8,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle=
    m.team===BLUE?
    "#3d8cff":
    "#ff4d55";

  ctx.lineWidth=1.5;
  ctx.setLineDash([3,2]);
  ctx.beginPath();
  ctx.arc(0,0,8,0,Math.PI*2);
  ctx.stroke();
  ctx.setLineDash([]);

  if(m.armed){

    const pulse=.4+.6*Math.sin(gameTime*10);

    ctx.fillStyle=`rgba(255,60,50,${pulse})`;
    ctx.beginPath();
    ctx.arc(0,0,2.5,0,Math.PI*2);
    ctx.fill();
  }

  ctx.restore();
}


/* =========================================================
   RENDER
========================================================= */

function draw(){

  ctx.clearRect(
    0,0,
    innerWidth,
    innerHeight
  );

  ctx.save();

  ctx.translate(
    innerWidth/2,
    innerHeight/2
  );

  ctx.scale(
    cam.zoom,
    cam.zoom
  );

  ctx.translate(
    -cam.x,
    -cam.y
  );

  drawTerrain();

  // tree lines behind everything
  drawTrees();

  // trenches first
  for(const s of structures)
    if(s.kind==="trench")
      drawTrench(s);

  // buildings
  for(const s of structures)
    if(s.kind!=="trench")
      drawBuilding(s);

  // flags — drawn after buildings/trenches so a flag planted near
  // or inside a building's footprint renders on top of it, not
  // hidden underneath.
  for(const f of flags){

    ctx.strokeStyle=
      f.team===2?
      "#ddd":
      teamColors[f.team];

    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.arc(
      f.x,
      f.y,
      32,
      0,
      Math.PI*2
    );

    ctx.stroke();

    ctx.fillStyle=
      f.team===2?
      "#aaa":
      teamColors[f.team];

    ctx.fillRect(
      f.x-3,
      f.y-55,
      6,
      55
    );

    ctx.fillRect(
      f.x+3,
      f.y-55,
      28,
      15
    );

    // Capture progress bar — only shown while a team is actively
    // flipping this flag (contestedBy set in updateFlags), colored
    // in the contesting team's color, empty-to-full as progress
    // climbs from 0 toward the 4.0 flip threshold.
    if(f.contestedBy!=null&&f.progress>0){

      const barW=56;
      const barH=8;
      const bx=f.x-barW/2;
      const by=f.y+42;

      ctx.fillStyle="rgba(0,0,0,.55)";
      ctx.fillRect(bx-2,by-2,barW+4,barH+4);

      ctx.fillStyle="#20261e";
      ctx.fillRect(bx,by,barW,barH);

      const pct=clamp(f.progress/4,0,1);

      ctx.fillStyle=teamColors[f.contestedBy];
      ctx.fillRect(bx,by,barW*pct,barH);

      ctx.strokeStyle="#111";
      ctx.lineWidth=1;
      ctx.strokeRect(bx,by,barW,barH);
    }
  }

  // flame cones — drawn before units so anyone standing inside
  // reads as "in the fire" rather than the flame drawing over them
  for(const f of units){

    if(f.type!=="flamer"||!f.spraying||f.hp<=0||f.critical)
      continue;

    const range=TYPES.flamer.range;

    ctx.save();
    ctx.translate(f.x,f.y);
    ctx.rotate(f.facing);

    const grad=ctx.createRadialGradient(0,0,0,0,0,range);
    grad.addColorStop(0,"rgba(255,200,80,.55)");
    grad.addColorStop(.6,"rgba(255,120,40,.35)");
    grad.addColorStop(1,"rgba(255,60,20,0)");

    ctx.fillStyle=grad;

    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0,range,-FLAME_CONE_HALF_ANGLE,FLAME_CONE_HALF_ANGLE);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  // units
  for(const u of units)
    drawUnit(u);

  // resupply choppers
  for(const c of choppers)
    drawChopper(c);

  // airstrike planes
  for(const p of airstrikePlanes)
    drawAirstrikePlane(p);

  // kamikaze drones
  for(const kd of kamikazeDrones)
    drawKamikazeDrone(kd);

  // mines
  for(const m of mines)
    drawMine(m);

  // bullets
  for(const b of bullets){

    ctx.fillStyle=
      b.explosive?
      "#ffd66e":
      "#fff";

    ctx.beginPath();

    ctx.arc(
      b.x,
      b.y,
      b.explosive?4:3,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  // particles
  for(const p of particles){

    ctx.globalAlpha=
      clamp(
        p.life/.4,
        0,1
      );

    ctx.fillStyle=p.color;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      3,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.globalAlpha=1;

  // blast rings — visible extent of every explosion this frame
  drawBlastRings();

  ctx.restore();

  drawMinimap();

  updateUI();

  updateStatsPanel();

  renderChat();
}


/* =========================================================
   MINIMAP
========================================================= */

function drawMinimap(){

  const mw=140;
  const mh=90;

  mctx.fillStyle="#1d291b";
  mctx.fillRect(
    0,0,mw,mh
  );

  const sx=mw/W;
  const sy=mh/H;

  for(let y=0;y<H;y+=TILE){

    for(let x=0;x<W;x+=TILE){

      const n=hash(
        Math.floor(x/TILE),
        Math.floor(y/TILE)
      );

      mctx.fillStyle=
        n<.045?
        "#315b69":
        n<.14?
        "#365b32":
        "#4e6d42";

      mctx.fillRect(
        x*sx,
        y*sy,
        TILE*sx+1,
        TILE*sy+1
      );
    }
  }

  for(const s of structures){

    mctx.fillStyle=
      s.kind==="trench"?"#75664c":
      s.kind==="building"?"#6b6152":
      teamColors[s.team];

    mctx.fillRect(
      s.x*sx-2,
      s.y*sy-2,
      4,
      4
    );
  }

  for(const u of units){

    mctx.fillStyle=
      teamColors[u.team];

    mctx.fillRect(
      u.x*sx-1,
      u.y*sy-1,
      2,
      2
    );
  }

  for(const c of choppers){

    mctx.fillStyle="#ffd66e";

    mctx.fillRect(
      c.x*sx-2,
      c.y*sy-2,
      4,
      4
    );
  }

  for(const p of airstrikePlanes){

    mctx.fillStyle="#e8e8e8";

    mctx.fillRect(
      p.x*sx-2,
      p.y*sy-2,
      4,
      4
    );
  }

  for(const kd of kamikazeDrones){

    mctx.fillStyle="#ff5a3d";

    mctx.fillRect(
      kd.x*sx-1.5,
      kd.y*sy-1.5,
      3,
      3
    );
  }

  for(const m of mines){

    mctx.fillStyle=
      m.team===BLUE?
      "#3d8cff88":
      "#ff4d5588";

    mctx.fillRect(
      m.x*sx-1.5,
      m.y*sy-1.5,
      3,
      3
    );
  }
}

function updateUI(){

      u=>u.team===BLUE
    ).length;

    units.filter(
      u=>u.team===RED
    ).length;

    ).length;

  statusEl.innerHTML=`
    <span class="blue">BLUE AI</span>

    resources ·
    ${blueUnits} units ·
    ${blueFlags} sectors
    <br>
    <span class="red">RED AI</span>
    ${Math.floor(teams[RED].res)}
    resources ·
    ${redUnits} units ·
    ${redFlags} sectors
    <br>
    <span class="gold">
    Battle time:
    ${Math.floor(gameTime)}s
    </span>
    <br>
    Buildings:
    ${structures.length}
    <br>
    ${paused?
      "<b>⏸ PAUSED</b>":
      "⚔ AI BATTLE IN PROGRESS"}
  `;
}


function renderChat(){

  for(const team of [BLUE,RED]){

    const el=chatEls[team];

    if(!el)
      continue;

    const label=
      "<b class='"+
      (team===BLUE?"blue":"red")+
      "'>"+teamNames[team]+" COMMS</b>";

    if(!hasComms(team)){

      el.innerHTML=
        label+
        "<div class='chatline chatdown'>"+
        "[ radio operator down — comms silent ]"+
        "</div>";

      continue;
    }

    const recent=teamChat[team].slice(-6);

    if(!recent.length){

      el.innerHTML=
        label+
        "<div class='chatline chatdown'>"+
        "[ channel quiet ]"+
        "</div>";

      continue;
    }

    let html=label;

    for(const c of recent){

      html+=
        "<div class='chatline'>"+
        String(c.text)
          .replace(/&/g,"&amp;")
          .replace(/</g,"&lt;")+
        "</div>";
    }

    el.innerHTML=html;
  }
}


/* =========================================================
   CAMERA
========================================================= */

addEventListener(
  "keydown",
  e=>{

    if(e.code==="Space")
      paused=!paused;

    if(e.key.toLowerCase()==="r")
      newGame();
  }
);

let keys={};

addEventListener(
  "keydown",
  e=>{
    keys[e.key.toLowerCase()]=true;
  }
);

addEventListener(
  "keyup",
  e=>{
    keys[e.key.toLowerCase()]=false;
  }
);

canvas.addEventListener(
  "wheel",
  e=>{

    e.preventDefault();

    cam.zoom=clamp(
      cam.zoom*
      Math.exp(-e.deltaY*.001),
      .18,
      1.8
    );

  },
  {passive:false}
);

canvas.addEventListener(
  "mousedown",
  e=>{

    if(e.button===1){

      mouse.middle=true;

      canvas.style.cursor=
        "grabbing";
    }
  }
);

canvas.addEventListener(
  "mouseup",
  e=>{

    if(e.button===1){

      mouse.middle=false;

      canvas.style.cursor=
        "grab";
    }
  }
);

canvas.addEventListener(
  "mousemove",
  e=>{

    if(mouse.middle){

      cam.x-=
        e.movementX/cam.zoom;

      cam.y-=
        e.movementY/cam.zoom;
    }
  }
);


/* =========================================================
   CAMERA KEYBOARD
========================================================= */

function updateCamera(dt){

  const speed=
    950/cam.zoom;

  if(keys.w)
    cam.y-=speed*dt;

  if(keys.s)
    cam.y+=speed*dt;

  if(keys.a)
    cam.x-=speed*dt;

  if(keys.d)
    cam.x+=speed*dt;

  cam.x=clamp(
    cam.x,
    200,
    W-200
  );

  cam.y=clamp(
    cam.y,
    160,
    H-160
  );
}

   NEW GAME
========================================================= */

function newGame(){

  seed=(
    Date.now()^
    ((Math.random()*0xffffffff)>>>0)
  )>>>0;

  reset();
}

   RESET
========================================================= */

function reset(){

  units=[];
  structures=[];
  bullets=[];
  particles=[];
  blastRings=[];
  flags=[];
  trees=[];
  choppers=[];
  kamikazeDrones=[];
  mines=[];
  airstrikePlanes=[];

  nextId=1;
  gameTime=0;
  paused=false;

  teams[BLUE]={
    res:650,
    score:0,
    aiTimer:0,
    construction:null,
    pendingSupply:null,
    commsTimer:3+rand()*3,
    commsPending:false,
    focus:"balanced",
    lastReportUnits:0,
    followFocus:"balanced",
    totalKills:0,
    casualties:0,
    airstrikeReadyTime:gameTime+60,
    pendingAirstrike:null,
    pendingUpgrades:[],
    spawnRecency:{},
    chopperReadyTime:0
  };

  teams[RED]={
    res:650,
    score:0,
    aiTimer:0,
    construction:null,
    pendingSupply:null,
    commsTimer:3+rand()*3,
    commsPending:false,
    focus:"balanced",
    lastReportUnits:0,
    followFocus:"balanced",
    totalKills:0,
    casualties:0,
    airstrikeReadyTime:gameTime+60,
    pendingAirstrike:null,
    pendingUpgrades:[],
    spawnRecency:{},
    chopperReadyTime:0
  };

  teamChat=[[],[]];

  srand(seed);

  /*
      Enlarged battlefield.

      Each side gets a proper HQ,
      defensive trench line,
      bunkers,
      and barracks. All positions are
      defined as fractions of W/H so the
      layout scales cleanly with map size.
  */

  makeBuilding(
    "HQ",
    BLUE,
    fx(.075),
    H/2
  );

  makeBuilding(
    "HQ",
    RED,
    fx(.925),
    H/2
  );


  makeBuilding(
    "barracks",
    BLUE,
    fx(.13),
    H/2-fy(.15)
  );

  makeBuilding(
    "barracks",
    RED,
    fx(.87),
    H/2+fy(.15)
  );


  makeBuilding(
    "bunker",
    BLUE,
    fx(.185),
    H/2-fy(.135)
  );

  makeBuilding(
    "bunker",
    RED,
    fx(.815),
    H/2+fy(.135)
  );

  // A second bunker each, further down their own trench line —
  // a more built-up base than just one strongpoint.
  makeBuilding(
    "bunker",
    BLUE,
    fx(.165),
    H/2+fy(.32)
  );

  makeBuilding(
    "bunker",
    RED,
    fx(.835),
    H/2-fy(.32)
  );


  // Defensive trench systems — long zigzagged networks that
  // run most of the length of the map, WWI-front style.
  makeTrenchNetwork(BLUE,[
    {x:fx(.145),y:fy(.06)},
    {x:fx(.185),y:fy(.22)},
    {x:fx(.15),y:fy(.4)},
    {x:fx(.2),y:fy(.58)},
    {x:fx(.16),y:fy(.76)},
    {x:fx(.2),y:fy(.93)}
  ]);

  makeTrenchNetwork(RED,[
    {x:fx(.855),y:fy(.94)},
    {x:fx(.815),y:fy(.78)},
    {x:fx(.85),y:fy(.6)},
    {x:fx(.8),y:fy(.42)},
    {x:fx(.84),y:fy(.24)},
    {x:fx(.8),y:fy(.07)}
  ]);

  // A second, deeper support trench line behind the first —
  // real WWI-style fronts ran forward and support/reserve lines
  // connected by communication trenches, so the whole network
  // reads as much longer and more realistic.
  makeTrenchNetwork(BLUE,[
    {x:fx(.10),y:fy(.04)},
    {x:fx(.135),y:fy(.23)},
    {x:fx(.105),y:fy(.42)},
    {x:fx(.145),y:fy(.6)},
    {x:fx(.115),y:fy(.78)},
    {x:fx(.145),y:fy(.96)}
  ]);

  makeTrenchNetwork(RED,[
    {x:fx(.90),y:fy(.96)},
    {x:fx(.865),y:fy(.78)},
    {x:fx(.895),y:fy(.6)},
    {x:fx(.855),y:fy(.42)},
    {x:fx(.885),y:fy(.23)},
    {x:fx(.855),y:fy(.04)}
  ]);


  scatterBuildings();

  const placedBuildings=
    structures.filter(s=>s.kind==="building");

  // Central objectives, scattered across the whole no-man's-land
  // (as neutral flags) so the fight never funnels into one lane —
  // units then fight to capture and hold them based on their role.
  // Weighted toward the single-room buildings (sometimes landing
  // right inside one) so a contested flag often doubles as a
  // contested building, for more intense close-quarters fights.
  for(let i=0;i<14;i++){

    let x,y;

    if(placedBuildings.length&&rand()<.65){

      const b=
        placedBuildings[
          Math.floor(rand()*placedBuildings.length)
        ];

      // A bit wider than the footprint itself so a flag isn't
      // always planted dead-center — sometimes just outside the
      // walls, sometimes inside the room.
      x=b.x+(rand()-.5)*b.halfW*2.6;
      y=b.y+(rand()-.5)*b.halfH*2.6;

    }else{

      x=W/2+(rand()-.5)*fx(.42);
      y=H/2+(rand()-.5)*fy(.72);
    }

    flags.push({
      x,y,
      team:2,
      progress:0,
      contestedBy:null
    });
  }

  proceduralTrees();


  // Starting armies
  for(const team of [BLUE,RED]){

    const side=
      team===BLUE?
      1:
      -1;

    const bx=
      team===BLUE?
      fx(.13):
      fx(.87);

    const by=H/2;

    const starting=[
      ["rifleman",5],
      ["mg",1],
      ["medic",1],
      ["leader",1],
      ["marksman",1],
      ["grenadier",1],
      ["engineer",2],
      ["comms",1]
    ];

    for(const [type,count] of starting){

      for(let i=0;i<count;i++){

        makeUnit(
          type,
          team,
          bx+
            side*(rand()*120),
          by+
            (rand()-.5)*450
        );
      }
    }
  }
}

      "can drag one to safety — the nearest ally automatically "+
      "breaks off to do it — hauling them toward whichever's "+
      "closer: base or a building. Left out in the open too long, "+
      "or hit again while down, they die for good."
  },
  {
    name:"Mines",
    blurb:"Engineers can lay a mine for 40 material near a "+
      "contested position. It arms after a short delay, then "+
      "detonates on proximity — any unit from any team can set "+
      "one off, including its own side, dealing mortar-style blast "+
      "damage that falls off with distance."
  }
];

/* =========================================================
   ADVANCED STATS PANEL
   Live dashboard: unit composition per team, each team's
   currently-radioed strategy, and a spread of other numbers
   pulled straight from the same state the sim itself uses.
   Rebuilt every frame while open (see updateStatsPanel()),
   same as the always-on corner status panel already is.
========================================================= */

function buildStatsPanel(){

  const bodyEl=document.getElementById("statsBody");

  if(!bodyEl)
    return;

  const countsByType={};

  for(const type in TYPES)
    countsByType[type]=[0,0];

  const critical=[0,0];
  const moraleSum=[0,0];
  const moraleN=[0,0];
  const outOfAmmoCount=[0,0];

  for(const u of units){

    if(u.team!==BLUE&&u.team!==RED)
      continue;

    if(countsByType[u.type])
      countsByType[u.type][u.team]++;

    if(u.critical)
      critical[u.team]++;

    if(isOutOfAmmo(u))
      outOfAmmoCount[u.team]++;

    moraleSum[u.team]+=u.morale;
    moraleN[u.team]++;
  }

  const totalUnits=[
    units.filter(u=>u.team===BLUE).length,
    units.filter(u=>u.team===RED).length
  ];

  const sectors=[
    flags.filter(f=>f.team===BLUE).length,
    flags.filter(f=>f.team===RED).length
  ];

  const buildingsOwned=[
    structures.filter(s=>s.team===BLUE).length,
    structures.filter(s=>s.team===RED).length
  ];

  const dronesActive=[
    kamikazeDrones.filter(d=>d.team===BLUE).length,
    kamikazeDrones.filter(d=>d.team===RED).length
  ];

  const minesActive=[
    mines.filter(m=>m.team===BLUE).length,
    mines.filter(m=>m.team===RED).length
  ];

  const avgMorale=[
    moraleN[BLUE]?Math.round(moraleSum[BLUE]/moraleN[BLUE]*100):0,
    moraleN[RED]?Math.round(moraleSum[RED]/moraleN[RED]*100):0
  ];

  let html="";

  html+=
    "<div class='statSection'><h4>Current Strategy</h4>"+
    "<div style='display:flex;gap:14px;align-items:center'>"+
    "<span class='blue' style='min-width:64px;display:inline-block'>BLUE</span>"+
    "<span class='focusPill' style='color:#63a7ff;border-color:#63a7ff'>"+
    teams[BLUE].focus.toUpperCase()+
    "</span></div>"+
    "<div style='display:flex;gap:14px;align-items:center;margin-top:6px'>"+
    "<span class='red' style='min-width:64px;display:inline-block'>RED</span>"+
    "<span class='focusPill' style='color:#ff6269;border-color:#ff6269'>"+
    teams[RED].focus.toUpperCase()+
    "</span></div></div>";

  html+=
    "<div class='statSection'><h4>Unit Composition</h4>"+
    "<table class='statTable'><thead><tr>"+
    "<th>Type</th><th class='num blue'>Blue</th><th class='num red'>Red</th>"+
    "</tr></thead><tbody>";

  for(const type in TYPES){

    const c=countsByType[type];

    html+=
      "<tr><td>"+
      type.charAt(0).toUpperCase()+type.slice(1)+
      "</td><td class='num'>"+c[BLUE]+
      "</td><td class='num'>"+c[RED]+
      "</td></tr>";
  }

  html+=
    "<tr class='totalRow'><td>Total</td>"+
    "<td class='num'>"+totalUnits[BLUE]+"</td>"+
    "<td class='num'>"+totalUnits[RED]+"</td></tr>"+
    "</tbody></table></div>";

  const statRows=[
    ["Resources",Math.floor(teams[BLUE].res),Math.floor(teams[RED].res)],
    ["Score",teams[BLUE].score,teams[RED].score],
    ["Sectors held",sectors[BLUE],sectors[RED]],
    ["Total kills",teams[BLUE].totalKills,teams[RED].totalKills],
    ["Casualties",teams[BLUE].casualties,teams[RED].casualties],
    ["Out of ammo",outOfAmmoCount[BLUE],outOfAmmoCount[RED]],
    ["Buildings owned",buildingsOwned[BLUE],buildingsOwned[RED]],
    ["Downed (critical)",critical[BLUE],critical[RED]],
    ["Avg. morale",avgMorale[BLUE]+"%",avgMorale[RED]+"%"],
    ["Active drones",dronesActive[BLUE],dronesActive[RED]],
    ["Active mines",minesActive[BLUE],minesActive[RED]]
  ];

  html+=
    "<div class='statSection'><h4>Advanced Stats</h4>"+
    "<table class='statTable'><thead><tr>"+
    "<th>Stat</th><th class='num blue'>Blue</th><th class='num red'>Red</th>"+
    "</tr></thead><tbody>";

  for(const[label,b,r] of statRows){

    html+=
      "<tr><td>"+label+
      "</td><td class='num'>"+b+
      "</td><td class='num'>"+r+
      "</td></tr>";
  }

  html+="</tbody></table></div>";

  bodyEl.innerHTML=html;
}


function updateStatsPanel(){

  const overlay=document.getElementById("statsOverlay");

  if(!overlay||!overlay.classList.contains("open"))
    return;

  buildStatsPanel();
}


function buildManual(){

  const body=document.getElementById("manualBody");

  if(!body)
    return;

  let html="";

  html+="<div class='manualSection'><h4>Units</h4><div class='manualGrid' id='manualUnitGrid'></div></div>";

  html+="<div class='manualSection'><h4>Other Battlefield Assets</h4><div id='manualAssetList'></div></div>";

  body.innerHTML=html;

  const grid=document.getElementById("manualUnitGrid");

  for(const type in TYPES){

    const t=TYPES[type];
    const role=ROLE_BY_TYPE[type];

    const card=document.createElement("div");
    card.className="manualCard";

    const canvasEl=document.createElement("canvas");
    canvasEl.width=104;
    canvasEl.height=104;

    const info=document.createElement("div");
    info.className="manualCardBody";

    const label=
      type.charAt(0).toUpperCase()+type.slice(1);

    info.innerHTML=
      "<div class='name'>"+label+"</div>"+
      "<div class='roleTag'>"+(ROLE_LABELS[role]||role||"")+"</div>"+
      "<div class='stats'>"+
        "HP "+t.hp+" · Speed "+t.speed+" · Dmg "+t.damage+
        "<br>Range "+t.range+" · Rate "+t.rate+"s · Cost "+t.cost+
      "</div>"+
      "<div class='blurb'>"+(UNIT_INFO[type]||"")+"</div>";

    card.appendChild(canvasEl);
    card.appendChild(info);
    grid.appendChild(card);

    // Draw the unit's actual in-game icon (Blue team colors),
    // scaled up so it's clearly visible in the reference card.
    const ictx=canvasEl.getContext("2d");
    ictx.save();
    ictx.translate(52,52);
    ictx.scale(2,2);
    drawUnitIcon(ictx,type,BLUE,type==="marksman");
    ictx.restore();
  }

  const assetList=document.getElementById("manualAssetList");

  for(const a of ASSET_INFO){

    const card=document.createElement("div");
    card.className="assetCard";

    card.innerHTML=
      "<div class='name'>"+a.name+"</div>"+
      "<div class='blurb'>"+a.blurb+"</div>";

    assetList.appendChild(card);
  }
}

function openManual(){

  buildManual();

  wikiWasPaused=paused;
  paused=true;

  document.getElementById("manualOverlay").classList.add("open");
}

function closeManual(){

  paused=wikiWasPaused;

  document.getElementById("manualOverlay").classList.remove("open");
}

let wikiWasPaused=false;

document.getElementById("manualBtn")
  .addEventListener("click",openManual);

document.getElementById("manualClose")
  .addEventListener("click",closeManual);

document.getElementById("manualOverlay")
  .addEventListener("click",e=>{

    if(e.target.id==="manualOverlay")
      closeManual();
  });

// The Stats panel is deliberately NOT modal the way the Field
// Manual is — it's a live dashboard, so the battle keeps running
// underneath it (see updateStatsPanel(), called every frame while
// it's open) rather than pausing to read static reference text.
function openStats(){

  buildStatsPanel();

  document.getElementById("statsOverlay").classList.add("open");
}

function closeStats(){

  document.getElementById("statsOverlay").classList.remove("open");
}

document.getElementById("statsBtn")
  .addEventListener("click",openStats);

document.getElementById("statsClose")
  .addEventListener("click",closeStats);

document.getElementById("statsOverlay")
  .addEventListener("click",e=>{

    if(e.target.id==="statsOverlay")
      closeStats();
  });

addEventListener("keydown",e=>{

  if(e.key!=="Escape")
    return;

  if(
    document.getElementById("manualOverlay")
      .classList.contains("open")
  ){
    closeManual();
    return;
  }

  if(
    document.getElementById("statsOverlay")
      .classList.contains("open")
  ){
    closeStats();
  }
});


/* =========================================================
   MAIN LOOP
   Fixed simulation rate prevents the old freeze.
========================================================= */

reset();

let previous=
  performance.now();

let accumulator=0;

function loop(now){

  let frameTime=
    (now-previous)/1000;

  previous=now;

  // Never allow a tab-switch or lag spike
  // to generate hundreds of simulation steps.
  frameTime=
    Math.min(
      frameTime,
      .10
    );

  simulationAccumulator+=frameTime;

  let steps=0;
  while(simulationAccumulator>=SIM_STEP && steps<4){
    simulationStep();
    simulationAccumulator-=SIM_STEP;
    steps++;
  }
  // Drop excessive backlog instead of freezing after a stall.
  if(simulationAccumulator>SIM_STEP*4)
    simulationAccumulator=0;

  updateCamera(
    frameTime
  );

  draw();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

window.addEventListener("error", e => {
  console.error(e.error || e.message);
  const box=document.createElement("div");
  box.style.cssText="position:fixed;left:10px;bottom:10px;z-index:9999;background:#300;color:#fff;padding:10px 14px;border:1px solid #f66;border-radius:6px;font:12px monospace;max-width:90vw";
  box.textContent="Game error: "+(e.message||"unknown error");
  document.body.appendChild(box);
});
</script>
